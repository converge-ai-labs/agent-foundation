[project]
name = "a13n-workspace"
version = "0.0.0"
description = "Cloud foundation with an agent harness, hosted agents, and observability"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "deptry>=0.25,<0.26",
    # Keep real MCP server fixtures available in the default local development environment.
    "fastmcp>=4.0,<5",
    "grpcio-tools>=1.75,<2",
    "mdformat==1.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-front-matters==2.0.0",
    "mdformat-gfm==1.0.0",
    "opentelemetry-distro[otlp]==0.65b0",
    "opentelemetry-sdk>=1.39,<2",
    "pre-commit>=4.3,<5",
    "protobuf>=6.32,<7",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.16,<0.17",
    # 4.15.0 reads mapped ports before Docker publishes them; retain readiness retries.
    "testcontainers[postgres,redis]==4.13.1",
    "types-aiobotocore-s3>=2.1,<3",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[tool.uv]
default-groups = ["dev", "docs"]
package = false

[tool.uv.sources]
a13n-envd-client = { workspace = true }
a13n-harness = { workspace = true }
a13n-stream-protocol = { workspace = true }
a13n-logging = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]

[tool.pyright]
include = [
    "packages/a13n-envd-client/a13n_envd_client",
    "packages/a13n-harness/a13n_harness",
    "packages/a13n-stream-protocol/a13n_stream_protocol",
    "packages/a13n-harness-ui/a13n_harness_ui",
    "packages/a13n-logging/a13n_logging",
    "packages/a13n-service/a13n_service",
    "scripts/check-a13n-distributions.py",
    "scripts/check-a13n-harness-ui-distribution.py",
    "scripts/check_a13n_harness_ui_distribution.py",
    "scripts/check-release-version.py",
    "scripts/create-github-release.py",
    "scripts/eip_codegen",
    "scripts/prepare-a13n-harness-ui-assets.py",
    "scripts/prepare-release-version.py",
    "scripts/prepare_a13n_harness_ui_assets.py",
    "scripts/release_notes.py",
    "scripts/release_version.py",
    "scripts/run_python_tests.py",
    "scripts/k8s_local.py",
]
exclude = ["**/tests", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    "error:The garbage collector is trying to clean up non-checked-in connection:sqlalchemy.exc.SAWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
testpaths = [
    "packages/a13n-envd-client/tests",
    "packages/a13n-harness/tests",
    "packages/a13n-stream-protocol/tests",
    "packages/a13n-harness-ui/tests",
    "packages/a13n-logging/tests",
    "packages/a13n-service/tests",
    "scripts/tests",
]
