[project]
name = "a13n-workspace"
version = "0.0.0"
description = "Cloud foundation with an agent harness, hosted agents, and observability"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "deptry>=0.25,<0.26",
    "grpcio-tools>=1.75,<2",
    "mdformat==1.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-front-matters==2.0.0",
    "mdformat-gfm==1.0.0",
    "opentelemetry-distro[otlp]==0.65b0",
    "opentelemetry-sdk>=1.39,<2",
    "pre-commit>=4.3,<5",
    "protobuf>=6.32,<7",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "testcontainers[postgres,redis]>=4.8,<5",
    "types-aiobotocore-s3>=2.1,<3",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[tool.uv]
default-groups = ["dev", "docs"]
package = false

[tool.uv.sources]
a13n-envd-client = { workspace = true }
a13n-environment-provider = { workspace = true }
a13n-harness = { workspace = true }
a13n-stream-protocol = { workspace = true }
a13n-logging = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]

[tool.pyright]
include = [
    "packages/agent-envd-client/a13n_envd_client",
    "packages/agent-environment-provider/a13n_environment_provider",
    "packages/agent-harness/a13n_harness",
    "packages/agent-stream-protocol/a13n_stream_protocol",
    "packages/agent-ui/a13n_ui",
    "packages/logging/a13n_logging",
    "packages/foundation-service/a13n_service",
    "scripts/check-agent-distributions.py",
    "scripts/check-agent-ui-distribution.py",
    "scripts/check_agent_ui_distribution.py",
    "scripts/check-release-version.py",
    "scripts/create-github-release.py",
    "scripts/eip_codegen",
    "scripts/prepare-agent-ui-assets.py",
    "scripts/prepare-release-version.py",
    "scripts/prepare_agent_ui_assets.py",
    "scripts/release_notes.py",
    "scripts/release_version.py",
]
exclude = ["**/tests", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/agent-envd-client/tests",
    "packages/agent-environment-provider/tests",
    "packages/agent-harness/tests",
    "packages/agent-stream-protocol/tests",
    "packages/agent-ui/tests",
    "packages/logging/tests",
    "packages/foundation-service/tests",
    "scripts/tests",
]
