[project]
name = "a13n-environment"
version = "0.0.0"
description = "Independent environment management and execution providers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "a13n-envd-client",
    "anyio>=4,<5",
    "httpx2>=2.5,<3",
    "pathspec>=1.1,<2",
    "packaging>=24,<27",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
    "websockets>=15,<16",
]

[project.optional-dependencies]
docker = ["docker>=7.2,<8"]
e2b = ["e2b>=2.46.4,<3"]
modal = ["modal>=1.5.5,<2"]

[dependency-groups]
test = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_environment"]

[tool.a13n.release-dependencies]
a13n-envd-client = ">=0.1.0,<0.2.0"

[tool.deptry]
known_first_party = ["a13n_environment"]
package_module_name_map = { "a13n-envd-client" = "a13n_envd_client" }
