[project]
name = "a13n-environment"
version = "0.0.0"
description = "Shared environment provider boundary for Agent Foundation agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "a13n-envd-client",
    "anyio>=4,<5",
    "docker>=7.2,<8",
    "e2b>=2.46.4,<3",
    "pathspec>=1.1,<2",
    "pydantic>=2.12,<3",
    "pydantic-core>=2.41,<3",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
    "websockets>=15,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_environment"]

[tool.a13n.release-dependencies]
a13n-envd-client = ">=0.0.6,<0.1.0"

[tool.deptry]
known_first_party = ["a13n_environment"]
package_module_name_map = { "a13n-envd-client" = "a13n_envd_client" }
