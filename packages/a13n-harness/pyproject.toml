[project]
name = "a13n-harness"
version = "0.0.0"
description = "Process-local agent harness built on Pydantic AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "a13n-environment",
    "pillow>=11,<13",
    "a13n-logging",
    "anyio>=4,<5",
    "anthropic>=1.3,<2",
    "botocore>=1.43.3,<1.43.57",
    "filelock>=3.18,<4",
    "google-auth>=2.40,<3",
    "google-genai>=1.0,<3",
    "openai>=3.5,<4",
    "genai-prices>=0.1.9,<1",
    "httpx2>=2.5,<3",
    "jsonschema>=4.25,<5",
    "opentelemetry-api>=1.39,<2",
    "pydantic>=2.12,<3",
    "pydantic-ai[bedrock,bedrock-mantle,cohere,google-realtime,groq,huggingface,mistral,openai-realtime,openrouter,retries,typesafe,xai,xai-realtime]>=2.54.0,<3",
    "pydantic-core>=2.41,<3",
    "pydantic-monty>=1.1.0,<2",
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6.0,<7",
    "referencing>=0.37,<1",
    "tenacity>=9,<10",
    "typing-extensions>=4.15,<5",
    "typesafe-sdk>=0.7.1,<1",
]

[dependency-groups]
test = [
    "opentelemetry-sdk>=1.39,<2",
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_harness"]

[tool.a13n.release-dependencies]
a13n-environment = ">=0.1.0,<0.2.0"
a13n-logging = ">=0.2.0,<0.3.0"

[tool.deptry]
known_first_party = ["a13n_harness"]
package_module_name_map = { "a13n-environment" = "a13n_environment", "google-auth" = "google", "google-genai" = "google" }
