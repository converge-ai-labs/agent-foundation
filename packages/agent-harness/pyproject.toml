[project]
name = "converge-agent-harness"
version = "0.0.0"
description = "Process-local agent harness built on Pydantic AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "converge-agent-envd-client",
    "converge-agent-environment-provider",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim>=2.31.1,<2.32",
    "pydantic-core>=2.41,<3",
    "pydantic-monty>=0.0.19,<0.1",
    "pyyaml>=6.0,<7",
    "typing-extensions>=4.15,<5",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converge_agent_harness"]

[tool.deptry]
known_first_party = ["converge_agent_harness"]
package_module_name_map = { "converge-agent-environment-provider" = "converge_agent_environment_provider" }
