[project]
name = "a13n-harness"
version = "0.0.0"
description = "Process-local agent harness built on Pydantic AI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "a13n-envd-client",
    "a13n-environment-provider",
    "genai-prices>=0.1.4,<1",
    "opentelemetry-api>=1.39,<2",
    "pathspec>=1.1,<2",
    "pydantic>=2.12,<3",
    "pydantic-ai[bedrock,bedrock-mantle,cohere,google-realtime,groq,huggingface,mistral,openai-realtime,openrouter,xai,xai-realtime]>=2.31.1,<2.32",
    "pydantic-core>=2.41,<3",
    "pydantic-monty>=0.0.19,<0.1",
    "pyyaml>=6.0,<7",
    "typing-extensions>=4.15,<5",
]

[dependency-groups]
test = [
    "opentelemetry-sdk>=1.39,<2",
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_harness"]

[tool.deptry]
known_first_party = ["a13n_harness"]
package_module_name_map = { "a13n-environment-provider" = "a13n_environment_provider" }
