[project]
name = "a13n-service"
version = "0.0.0"
description = "Hosted control and execution service for Agent Foundation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "a13n-envd-client",
    "a2a-sdk[fastapi]>=1.1.2,<1.2",
    "aiobotocore[httpx2]>=3.9,<4",
    "alembic>=1.17.1,<2",
    "anyio>=4,<5",
    "botocore>=1.43.3,<1.43.57",
    "click>=8.2,<9",
    "cryptography>=50,<51",
    "a13n-harness[mem0,docker,e2b,modal]",
    "a13n-logging",
    "a13n-stream-protocol",
    "ag-ui-protocol>=0.1.18,<0.2",
    "fakeredis[lua]>=2.31,<3",
    "fastapi>=0.116,<1",
    "fastmcp>=4.0,<5",
    "mcp==2.2.0",
    "google-auth>=2.40,<3",
    "google-genai>=1.0,<3",
    "httpx2>=2.5,<3",
    "jsonschema>=4.25,<5",
    "opentelemetry-exporter-otlp>=1.39,<2",
    "opentelemetry-exporter-prometheus>=0.65b0,<0.66",
    "opentelemetry-sdk>=1.39,<2",
    "pydantic[email]>=2.12,<3",
    "pydantic-ai>=2.48.0,<3",
    "pydantic-core>=2.41,<3",
    "pydantic-graph>=2.48.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0,<7",
    "redis>=8,<9",
    "rfc8785>=0.1.4,<0.2",
    "referencing>=0.37,<1",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "starlette>=0.52,<2",
    "uvicorn>=0.35,<1",
    "mypy-boto3-bedrock-runtime>=1.43,<2",
    "authlib>=1.8,<2",
    "argon2-cffi>=25,<26",
    "aiosmtplib>=5,<6",
    "pillow>=11.3,<13",
    "zstandard>=0.25,<0.26",
    "websockets>=15,<16",
    "protobuf>=6.32,<7",
    "prometheus-client>=0.26,<1",
]

[project.scripts]
a13n-service = "a13n_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_service"]

[tool.a13n.release-dependencies]
a13n-envd-client = ">=0.0.6,<0.1.0"

[tool.deptry]
known_first_party = ["a13n_service"]
package_module_name_map = { "a13n-envd-client" = "a13n_envd_client", "a13n-harness" = "a13n_harness", "a13n-logging" = "a13n_logging", "a13n-stream-protocol" = "a13n_stream_protocol", "a2a-sdk" = "a2a", "ag-ui-protocol" = "ag_ui", "google-auth" = "google", "httpx2" = "httpx2", "pydantic-ai" = "pydantic_ai", "psycopg" = "psycopg", "sqlalchemy" = "sqlalchemy" }

# Database drivers are loaded by SQLAlchemy from the selected backend. httpx2
# is the service-wide outbound client contract and is used by service tests.
[tool.deptry.per_rule_ignores]
DEP002 = ["httpx2", "psycopg"]
