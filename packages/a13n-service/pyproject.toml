[project]
name = "a13n-service"
version = "0.0.0"
description = "Managed agent runtime for Agent Foundation"
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "a13n-logging",
    "a13n-harness[docker,e2b,modal]",
    "a13n-stream-protocol",
    "ag-ui-protocol>=1.0.0,<2",
    "aiobotocore[httpx2]>=3.9,<4",
    "alembic>=1.17.1,<2",
    "anyio>=4,<5",
    "argon2-cffi>=25,<26",
    "botocore>=1.43.3,<1.43.57",
    "click>=8.2,<9",
    "cryptography>=50,<51",
    "fastapi>=0.116,<1",
    "httpx2>=2.5,<3",
    "jsonschema>=4.25,<5",
    "mcp>=2.2,<3",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-exporter-prometheus>=0.60b0,<1",
    "opentelemetry-sdk>=1.39,<2",
    "packaging>=24,<27",
    "prometheus-client>=0.21,<1",
    "pydantic[email]>=2.12,<3",
    "pydantic-ai-slim>=2.51.0,<3",
    "pydantic-core>=2.41,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.32,<1",
    "pyyaml>=6.0,<7",
    "redis>=8.1,<9",
    "referencing>=0.37,<1",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "starlette>=0.52,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
a13n-service = "a13n_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["a13n_service/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["a13n_service"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# SQLAlchemy loads psycopg through its configured driver; FastAPI loads
# python-multipart to parse the upload endpoints' multipart forms.
[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg", "python-multipart"]

[tool.deptry]
known_first_party = ["a13n_service"]
package_module_name_map = { "a13n-logging" = "a13n_logging", "ag-ui-protocol" = "ag_ui", "argon2-cffi" = "argon2", "pyyaml" = "yaml" }

[tool.a13n.release-dependencies]
a13n-logging = ">=0.2.0,<0.3.0"
a13n-harness = ">=0.5.0,<0.6.0"
a13n-stream-protocol = ">=0.5.0,<0.6.0"
