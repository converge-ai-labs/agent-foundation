[project]
name = "converge-agent-stream-protocol"
version = "0.0.0"
description = "Shared AG-UI projection protocol for Converge agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "ag-ui-protocol>=0.1.18,<0.2",
    "converge-agent-harness",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim>=2.31.1,<2.32",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converge_agent_stream_protocol"]

[tool.deptry]
known_first_party = ["converge_agent_stream_protocol"]
package_module_name_map = { "ag-ui-protocol" = "ag_ui", "converge-agent-harness" = "converge_agent_harness", "pydantic-ai-slim" = "pydantic_ai" }
