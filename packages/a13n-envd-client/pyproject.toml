[project]
name = "a13n-envd-client"
version = "0.0.0"
description = "Low-level Python client for the Agent Environment Interaction Protocol"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.5,<3",
    "pydantic>=2.12,<3",
    "websockets>=15,<16",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_envd_client"]

[tool.deptry]
known_first_party = ["a13n_envd_client"]
package_module_name_map = { "httpx2" = "httpx2" }
