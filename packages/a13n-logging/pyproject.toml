[project]
name = "a13n-logging"
version = "0.0.0"
description = "Shared structured and developer-friendly logging for Agent Foundation"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "rich>=15,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_logging"]

[tool.deptry]
known_first_party = ["a13n_logging"]
package_module_name_map = { "rich" = "rich" }
