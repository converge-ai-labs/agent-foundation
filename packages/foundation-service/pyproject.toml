[project]
name = "converge-foundation-service"
version = "0.0.0"
description = "Internal storage and database infrastructure for Agent Foundation services"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiobotocore[httpx2]>=3.9,<4",
    "aiosqlite>=0.21,<1",
    "alembic>=1.17.1,<2",
    "anyio>=4,<5",
    "botocore>=1.43.3,<1.43.57",
    "fakeredis>=2.31,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=8,<9",
    "sqlalchemy[asyncio]>=2.0.41,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["converge_foundation_service"]

[tool.deptry]
known_first_party = ["converge_foundation_service"]
package_module_name_map = { "pydantic-settings" = "pydantic_settings", "sqlalchemy" = "sqlalchemy" }

# Database drivers are loaded by SQLAlchemy from the selected backend.
[tool.deptry.per_rule_ignores]
DEP002 = ["aiosqlite", "psycopg"]
