[project]
name = "converge-agent-ui"
version = "0.0.0"
description = "Local WebUI and TUI Host for Converge Agent Harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.17.1,<2",
    "anyio>=4,<5",
    "converge-agent-environment-provider",
    "converge-agent-harness",
    "converge-agent-stream-protocol",
    "converge-logging",
    "filelock>=3.20,<4",
    "pydantic>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "zstandard>=0.25,<0.26",
]

[project.scripts]
converge-agent-ui = "converge_agent_ui.cli:main"

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["converge_agent_ui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["converge_agent_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "converge_agent_ui",
    "hatch_build.py",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.converge.agent-ui-release]
harness-version = "0.0.0"

[tool.deptry]
known_first_party = ["converge_agent_ui"]
package_module_name_map = { "converge-agent-environment-provider" = "converge_agent_environment_provider", "converge-agent-harness" = "converge_agent_harness", "converge-agent-stream-protocol" = "converge_agent_stream_protocol", "converge-logging" = "converge_logging", "sqlalchemy" = "sqlalchemy" }

# aiosqlite is loaded by SQLAlchemy through the configured async driver. The
# runtime packages remain selected for later Agent UI application blocks.
[tool.deptry.per_rule_ignores]
DEP002 = ["aiosqlite", "converge-agent-environment-provider", "converge-agent-harness", "converge-agent-stream-protocol"]
