[project]
name = "converge-agent-ui"
version = "0.0.0"
description = "Local WebUI and TUI Host for Converge Agent Harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "converge-agent-environment-provider",
    "converge-agent-harness",
    "converge-agent-stream-protocol",
]

[project.scripts]
converge-agent-ui = "converge_agent_ui.cli:main"

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["converge_agent_ui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["converge_agent_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "converge_agent_ui",
    "hatch_build.py",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.converge.agent-ui-release]
harness-version = "0.0.0"

[tool.deptry]
known_first_party = ["converge_agent_ui"]
package_module_name_map = { "converge-agent-environment-provider" = "converge_agent_environment_provider", "converge-agent-harness" = "converge_agent_harness", "converge-agent-stream-protocol" = "converge_agent_stream_protocol" }

# The package is an initialization scaffold. The application-service modules
# will consume these runtime boundaries as their implementation is added.
[tool.deptry.per_rule_ignores]
DEP002 = ["converge-agent-environment-provider", "converge-agent-harness", "converge-agent-stream-protocol"]
