[project]
name = "a13n-ui"
version = "0.0.0"
description = "Local WebUI and CLI Host for Agent Foundation Harness"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.17.1,<2",
    "anyio>=4,<5",
    "a13n-environment-provider",
    "a13n-harness",
    "a13n-stream-protocol",
    "a13n-logging",
    "ag-ui-protocol>=0.1.18,<0.2",
    "filelock>=3.20,<4",
    "httpx2>=2.5,<3",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim>=2.31.1,<2.32",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "zstandard>=0.25,<0.26",
]

[project.scripts]
a13n-ui = "a13n_ui.cli:main"

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["a13n_ui/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["a13n_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "a13n_ui",
    "hatch_build.py",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.a13n.agent-ui-release]
harness-version = "0.0.3"

[tool.deptry]
known_first_party = ["a13n_ui"]
package_module_name_map = { "a13n-environment-provider" = "a13n_environment_provider", "a13n-harness" = "a13n_harness", "a13n-stream-protocol" = "a13n_stream_protocol", "a13n-logging" = "a13n_logging", "ag-ui-protocol" = "ag_ui", "sqlalchemy" = "sqlalchemy" }

# aiosqlite is loaded by SQLAlchemy through the configured async driver. The
# runtime packages remain selected for later Agent UI application blocks.
[tool.deptry.per_rule_ignores]
DEP002 = ["aiosqlite", "a13n-environment-provider", "a13n-harness", "a13n-stream-protocol"]
