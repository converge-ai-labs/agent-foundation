[project]
name = "a13n-environment-provider"
version = "0.0.0"
description = "Shared environment provider boundary for Agent Foundation agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "a13n-envd-client",
    "pydantic>=2.12,<3",
    "websockets>=15,<16",
]

[dependency-groups]
test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a13n_environment_provider"]

[tool.deptry]
known_first_party = ["a13n_environment_provider"]
package_module_name_map = { "a13n-envd-client" = "a13n_envd_client" }
