[project]
name = "a13n-environment-provider-example"
version = "0.0.0"
description = "Runnable Host-side lifecycle examples for Agent Foundation Environment Providers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "a13n-harness[docker,e2b]",
    "websockets>=15,<16",
]

[project.scripts]
environment-provider-example = "a13n_environment_example.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a13n_environment_example"]

[tool.uv.sources]
a13n-envd-client = { path = "../../packages/a13n-envd-client", editable = true }
a13n-harness = { path = "../../packages/a13n-harness", editable = true }

[tool.uv.workspace]
members = []

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
