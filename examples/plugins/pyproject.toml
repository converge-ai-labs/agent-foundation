[project]
name = "a13n-plugin-examples"
version = "0.0.0"
description = "Runnable Capability, Environment extension, provider, and Harness plugin examples for Agent Foundation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "a13n-harness",
    "fastmcp-slim[client]>=4.0,<5",
    "mcp>=2.2,<3",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim>=2.54.0,<3",
]

[project.entry-points."a13n_harness.providers.plugins"]
workspace = "a13n_plugin_examples.environment:manifest"

[project.entry-points."a13n_harness.environment_run_extensions"]
"example.workspace-marker" = "a13n_plugin_examples.environment_extension:WorkspaceMarkerExtensionFactory"

[project.entry-points."a13n_harness.plugins"]
"example.run-recorder" = "a13n_plugin_examples.harness:RunRecorderPluginFactory"

[project.scripts]
plugin-example-capability-agent-spec = "a13n_plugin_examples.demo_capability:main_agent_spec"
plugin-example-capability-code = "a13n_plugin_examples.demo_capability:main_code"
plugin-example-environment-entrypoint = "a13n_plugin_examples.demo_environment:main_entrypoint"
plugin-example-environment-code = "a13n_plugin_examples.demo_environment:main_code"
plugin-example-environment-extension-entrypoint = "a13n_plugin_examples.demo_environment_extension:main_entrypoint"
plugin-example-environment-extension-code = "a13n_plugin_examples.demo_environment_extension:main_code"
plugin-example-harness-entrypoint = "a13n_plugin_examples.demo_harness:main_entrypoint"
plugin-example-harness-code = "a13n_plugin_examples.demo_harness:main_code"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a13n_plugin_examples"]

[tool.uv.sources]
a13n-envd-client = { path = "../../packages/a13n-envd-client", editable = true }
a13n-harness = { path = "../../packages/a13n-harness", editable = true }

[tool.uv.workspace]
members = []

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
