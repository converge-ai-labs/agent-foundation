[project]
name = "converge-plugin-examples"
version = "0.0.0"
description = "Runnable Environment provider, Environment run-extension, and Harness plugin examples for Agent Foundation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "converge-agent-environment-provider",
    "converge-agent-harness",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim>=2.31.1,<2.32",
]

[project.entry-points."converge_agent_environment_provider.providers"]
"example.workspace" = "converge_plugin_examples.environment:WorkspaceEnvironmentProviderFactory"

[project.entry-points."converge_agent_harness.environment_run_extensions"]
"example.workspace-marker" = "converge_plugin_examples.environment_extension:WorkspaceMarkerExtensionFactory"

[project.entry-points."converge_agent_harness.plugins"]
"example.run-recorder" = "converge_plugin_examples.harness:RunRecorderPluginFactory"

[project.scripts]
plugin-example-environment-entrypoint = "converge_plugin_examples.demo_environment:main_entrypoint"
plugin-example-environment-code = "converge_plugin_examples.demo_environment:main_code"
plugin-example-environment-extension-entrypoint = "converge_plugin_examples.demo_environment_extension:main_entrypoint"
plugin-example-environment-extension-code = "converge_plugin_examples.demo_environment_extension:main_code"
plugin-example-harness-entrypoint = "converge_plugin_examples.demo_harness:main_entrypoint"
plugin-example-harness-code = "converge_plugin_examples.demo_harness:main_code"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/converge_plugin_examples"]

[tool.uv.sources]
converge-agent-environment-provider = { path = "../../packages/agent-environment-provider", editable = true }
converge-agent-harness = { path = "../../packages/agent-harness", editable = true }

[tool.uv.workspace]
members = []

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
