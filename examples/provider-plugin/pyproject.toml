[project]
name = "a13n-provider-acme-example"
version = "0.1.0"
description = "Installed deployment Provider plugin example for Agent Foundation"
requires-python = ">=3.13"
dependencies = [
    "a13n-harness>=0,<1",
    "a13n-logging>=0,<1",
    "anyio>=4,<5",
    "httpx2>=2,<3",
    "pydantic>=2.12,<3",
    "openai>=3.8,<4",
    "pydantic-ai>=2.41,<3",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pyright>=1.1,<2",
    "ruff>=0.16,<0.17",
]

[project.entry-points."a13n_harness.providers.plugins"]
acme = "acme_provider.plugin:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_provider"]

[tool.uv.workspace]
members = []

[tool.uv.sources]
a13n-envd-client = { path = "../../packages/a13n-envd-client", editable = true }
a13n-harness = { path = "../../packages/a13n-harness", editable = true }
a13n-logging = { path = "../../packages/a13n-logging", editable = true }
a13n-stream-protocol = { path = "../../packages/a13n-stream-protocol", editable = true }

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
