[project]
name = "acme-reports-app-example"
version = "0.1.0"
description = "An independently packaged Service App with a prebuilt Console frontend"
requires-python = ">=3.13"
dependencies = ["a13n-service"]

[project.entry-points."a13n_service.app_plugins"]
"acme.reports" = "acme_reports.app:definition"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_reports"]

[tool.hatch.build.targets.wheel.force-include]
"src/acme_reports/static" = "acme_reports/static"

[tool.hatch.build.targets.sdist]
include = ["src", "frontend", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"src/acme_reports/static" = "src/acme_reports/static"

[tool.uv.workspace]
members = []
