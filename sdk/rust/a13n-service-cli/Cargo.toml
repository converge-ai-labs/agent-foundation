[package]
name = "a13n-service-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Converge AI"]
license = "Apache-2.0"
repository = "https://github.com/converge-ai-labs/agent-foundation"
description = "Command-line client for a13n Service"
readme = "README.md"
publish = false

[[bin]]
name = "a13n-service-cli"
path = "src/main.rs"

[dependencies]
a13n = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
resolver = "2"
