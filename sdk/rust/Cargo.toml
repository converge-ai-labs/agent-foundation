[package]
name = "a13n"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Converge AI"]
license = "Apache-2.0"
repository = "https://github.com/converge-ai-labs/agent-foundation"
description = "Rust SDK for a13n Service"
readme = "README.md"
exclude = ["a13n-service-cli/**"]
keywords = ["agents", "ai", "api", "sdk"]
categories = ["api-bindings"]

[lib]
name = "a13n"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "multipart", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_repr = "0.1"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }

[workspace]
resolver = "2"
