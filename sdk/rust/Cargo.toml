[package]
name = "a13n-sdk"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Converge AI"]
license = "Apache-2.0"
repository = "https://github.com/converge-ai-labs/agent-foundation"
description = "Rust SDK for Agent Foundation Service"
readme = "README.md"
exclude = ["agent-foundation-cli/**"]
keywords = ["agents", "ai", "api", "sdk"]
categories = ["api-bindings"]

[lib]
name = "a13n_sdk"
path = "src/lib.rs"

[workspace]
resolver = "2"
