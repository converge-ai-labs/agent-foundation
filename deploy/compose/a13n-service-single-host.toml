[deployment]
mode = "single_host"

[service]
host = "0.0.0.0"

[database]
url = "postgresql+psycopg://a13n_service:a13n_service@postgres:5432/a13n_service"

[redis]
url = "redis://redis:6379/0"

[objects]
local_root = "/app/var/objects"

[filesystem]
root = "/app/var/files"

[migration]
auto_migrate = true

[logging]
format = "json"

[environments.local_providers.direct_local]

[environments.local_providers."docker"]
docker_host = "unix:///var/run/docker.sock"
