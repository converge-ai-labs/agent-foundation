# Single-host Service shares the host Docker Engine and its authority.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a13n_service
      POSTGRES_USER: a13n_service
      POSTGRES_PASSWORD: a13n_service
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a13n_service -d a13n_service"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  service:
    image: ${A13N_SERVICE_IMAGE:-ghcr.io/converge-ai-labs/a13n-service:dev}
    user: "10001:10001"
    group_add:
      - "${A13N_DOCKER_SOCKET_GID:?Set A13N_DOCKER_SOCKET_GID to the host Docker socket group ID}"
    environment:
      A13N_SERVICE_SECRET_MASTER_KEY_BASE64: ${A13N_SERVICE_SECRET_MASTER_KEY_BASE64:?Generate and retain a deployment master key}
      A13N_SERVICE_SECRET_ENCRYPTION_KEY_ID: ${A13N_SERVICE_SECRET_ENCRYPTION_KEY_ID:-local-1}
      A13N_SERVICE_IAM_INITIAL_ADMIN_EMAIL: ${A13N_SERVICE_IAM_INITIAL_ADMIN_EMAIL:?Set the initial administrator email}
      A13N_SERVICE_IAM_PUBLIC_ORIGIN: http://127.0.0.1:${A13N_SERVICE_PORT:-8000}
      A13N_SERVICE_CONNECTIVITY_PUBLIC_ORIGIN: http://127.0.0.1:${A13N_SERVICE_PORT:-8000}
      A13N_SERVICE_CONNECTIVITY_HTTP_ORIGINS: '["http://127.0.0.1:${A13N_SERVICE_PORT:-8000}"]'
    ports:
      - "127.0.0.1:${A13N_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./a13n-service-single-host.toml:/app/service.toml:ro
      - service-data:/app/var
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
volumes:
  postgres:
  redis:
  service-data:
