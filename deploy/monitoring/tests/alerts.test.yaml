rule_files:
- /config/capacity.yaml
- /config/availability.yaml
- /config/execution.yaml
- /config/query-rules.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: a13n_backlog_oldest_age_seconds{job="a13n-service",deployment="local-beta",instance="stale",queue="runs"}
    values: 900+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="local-beta",instance="stale",queue="runs"}
    values: 0+0x20
  - series: a13n_backlog_oldest_age_seconds{job="a13n-service",deployment="local-beta",instance="fresh",queue="runs"}
    values: 5+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="local-beta",instance="fresh",queue="runs"}
    values: 0+60x20
  - series: a13n_backlog_oldest_age_seconds{job="a13n-service",deployment="b",instance="fresh",queue="runs"}
    values: 700+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="b",instance="fresh",queue="runs"}
    values: 0+60x20
  promql_expr_test:
  # The dashboard's "Due work oldest age" panel, with the selected deployment.
  - expr: test:panel15_A
    eval_time: 20m
    exp_samples:
    - labels: 'test:panel15_A{deployment="local-beta",queue="runs"}'
      value: 5
  alert_rule_test:
  - eval_time: 20m
    alertname: A13nBacklogStuck
    exp_alerts:
    - exp_labels:
        job: a13n-service
        deployment: b
        queue: runs
        severity: warning
      exp_annotations:
        summary: Due work is not progressing
        description: 'b queue runs: oldest due item exceeded 10m. Check queue-specific
          owners; sleeping/retry-backoff work is excluded.'
- interval: 1m
  input_series:
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q0"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q1"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q2"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q3"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q4"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q5"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q6"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q7"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q8"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q9"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q10"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q11"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q12"}
    values: 0+0x20
  - series: a13n_backlog_updated_seconds{job="a13n-service",deployment="a",instance="stalled",queue="q13"}
    values: 0+0x20
  promql_expr_test:
  - expr: count(test:alert_A13nBacklogSnapshotStale) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
- interval: 1m
  input_series:
  - series: a13n_outbox_backlog_alert{job="a13n-service",deployment="a",instance="fresh",kind="webhook"}
    values: 1+0x20
  - series: a13n_outbox_updated_seconds{job="a13n-service",deployment="a",instance="fresh"}
    values: 0+60x20
  - series: a13n_outbox_backlog_alert{job="a13n-service",deployment="a",instance="stale",kind="email"}
    values: 1+0x20
  - series: a13n_outbox_updated_seconds{job="a13n-service",deployment="a",instance="stale"}
    values: 0+0x20
  - series: a13n_outbox_deliveries_total{job="a13n-service",deployment="a",instance="worker",kind="webhook",result="dead"}
    values: 0+1x20
  - series: a13n_outbox_deliveries_total{job="a13n-service",deployment="a",instance="worker",kind="email",result="dead"}
    values: 0+0x20
  - series: a13n_outbox_dead{job="a13n-service",deployment="a",instance="fresh",kind="email"}
    values: 1+0x20
  promql_expr_test:
  - expr: count(test:alert_A13nOutboxBacklogSustained) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(test:alert_A13nOutboxBacklogSustained{kind="email"}) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(test:alert_A13nOutboxDead) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(test:alert_A13nOutboxDead{kind="email"}) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
- interval: 1m
  input_series:
  - series: a13n_sweep_items_total{job="a13n-service",deployment="a",instance="control",sweep="occasional",result="failed"}
    values: 0+1x20
  - series: a13n_sweep_items_total{job="a13n-service",deployment="a",instance="control",sweep="occasional",result="succeeded"}
    values: 0+100x20
  - series: a13n_sweep_items_total{job="a13n-service",deployment="a",instance="control",sweep="broken",result="failed"}
    values: 0+1x20
  - series: a13n_sweep_items_total{job="a13n-service",deployment="a",instance="control",sweep="broken",result="succeeded"}
    values: 0+1x20
  - series: a13n_sweep_passes_total{job="a13n-service",deployment="a",instance="control",sweep="occasional",result="failed"}
    values: 0+1x20
  - series: a13n_sweep_passes_total{job="a13n-service",deployment="a",instance="control",sweep="occasional",result="succeeded"}
    values: 0+100x20
  - series: a13n_sweep_passes_total{job="a13n-service",deployment="a",instance="control",sweep="broken",result="failed"}
    values: 0+1x20
  - series: a13n_sweep_passes_total{job="a13n-service",deployment="a",instance="control",sweep="broken",result="succeeded"}
    values: 0+1x20
  promql_expr_test:
  - expr: count(test:alert_A13nSweepItemsFailing) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(test:alert_A13nSweepFailing) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(test:alert_A13nSweepItemsFailing{sweep="occasional"}) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(test:alert_A13nSweepFailing{sweep="occasional"}) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
- interval: 1m
  input_series:
  - series: a13n_stream_dropped_total{job="a13n-service",deployment="a",instance="worker",reason="oversized"}
    values: 0+100x20
  promql_expr_test:
  - expr: count(test:alert_A13nStreamDegraded) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
- interval: 1m
  input_series:
  - series: a13n_stream_dropped_total{job="a13n-service",deployment="a",instance="worker",reason="redis_append_failed"}
    values: 0+100x20
  promql_expr_test:
  - expr: count(test:alert_A13nStreamDegraded) or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 1
- interval: 1m
  input_series:
  - series: a13n_worker_realtime_slots{job="a13n-service",deployment="local-beta",instance="worker-a",state="free"}
    values: 0+0x20
  - series: a13n_worker_realtime_slots{job="a13n-service",deployment="local-beta",instance="worker-a",state="busy"}
    values: 8+0x20
  - series: a13n_worker_realtime_slots{job="a13n-service",deployment="disabled",instance="worker-b",state="free"}
    values: 0+0x20
  - series: a13n_worker_realtime_slots{job="a13n-service",deployment="disabled",instance="worker-b",state="busy"}
    values: 0+0x20
  - series: a13n_realtime_handshakes_duration_seconds_count{job="a13n-service",deployment="local-beta",transport="websocket",result="ready"}
    values: 0+2x20
  - series: a13n_realtime_handshakes_duration_seconds_count{job="a13n-service",deployment="local-beta",transport="websocket",result="failed"}
    values: 0+1x20
  - series: a13n_realtime_handshakes_duration_seconds_count{job="a13n-service",deployment="local-beta",transport="websocket",result="timeout"}
    values: 0+1x20
  - series: a13n_realtime_handshakes_duration_seconds_count{job="a13n-service",deployment="local-beta",transport="websocket",result="abandoned"}
    values: 0+100x20
  - series: a13n_realtime_handshakes_duration_seconds_count{job="a13n-service",deployment="local-beta",transport="webrtc",result="timeout"}
    values: 0+0.2x20
  - series: a13n_realtime_orphan_hangups_total{job="a13n-service",deployment="local-beta",result="failed"}
    values: 0+1x20
  - series: a13n_realtime_orphan_hangups_total{job="a13n-service",deployment="healthy",result="succeeded"}
    values: 0+1x20
  alert_rule_test:
  - eval_time: 4m
    alertname: A13nRealtimeSlotsSaturated
    exp_alerts: []
  - eval_time: 20m
    alertname: A13nRealtimeSlotsSaturated
    exp_alerts:
    - exp_labels:
        job: a13n-service
        deployment: local-beta
        severity: warning
      exp_annotations:
        summary: All realtime Worker slots are busy
        description: Check call duration and handshake outcomes before changing realtime capacity.
  - eval_time: 20m
    alertname: A13nRealtimeHandshakeFailures
    exp_alerts:
    - exp_labels:
        job: a13n-service
        deployment: local-beta
        transport: websocket
        severity: warning
      exp_annotations:
        summary: Realtime handshake failures or timeouts are elevated
        description: 'websocket had at least five failed or timed-out handshakes in 10m and a failure share above 20%.
          Check worker availability, Redis and provider connectivity.'
  - eval_time: 20m
    alertname: A13nRealtimeOrphanHangupsFailing
    exp_alerts:
    - exp_labels:
        job: a13n-service
        deployment: local-beta
        severity: warning
      exp_annotations:
        summary: Realtime orphan hangups keep failing
        description: At least three WebRTC cleanup attempts failed in 10m. Check provider connectivity and cleanup credentials.
