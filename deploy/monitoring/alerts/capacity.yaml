# Optional preset; load only if wanted. Configure deployment labels and adjust thresholds first.
groups:
- name: a13n-service-capacity
  rules:
  - alert: A13nBacklogStuck
    expr: max by (job,deployment,queue) (a13n_backlog_oldest_age_seconds{job="a13n-service"} and on (job,deployment,instance,queue)
      (time() - a13n_backlog_updated_seconds{job="a13n-service"} < 60)) > 600
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Due work is not progressing
      description: '{{ $labels.deployment }} queue {{ $labels.queue }}: oldest due item exceeded 10m. Check queue-specific
        owners; sleeping/retry-backoff work is excluded.'
  - alert: A13nOutboxBacklogSustained
    expr: max by (job,deployment,kind) (a13n_outbox_backlog_alert{job="a13n-service"} and on (job,deployment,instance)
      (time() - a13n_outbox_updated_seconds{job="a13n-service"} < 60)) == 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Outbox backlog exceeded its kind policy
      description: '{{ $labels.deployment }} kind {{ $labels.kind }} stayed above its configured count or age threshold
        for its policy duration. Check delivery throughput and the kind owner; restarting a reporter resets its timer.'
  - alert: A13nWorkersSaturated
    expr: (sum by (job,deployment) (a13n_worker_slots{job="a13n-service",state="free"}) == 0) and on (job,deployment)
      (max by (job,deployment) (a13n_backlog_oldest_age_seconds{job="a13n-service",queue="runs"} and on (job,deployment,instance,queue)
      (time() - a13n_backlog_updated_seconds{job="a13n-service"} < 60)) > 60)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Worker slots are full while due Runs wait
      description: Consider worker replicas/slots; first inspect Attempt duration, retained tools and external dependencies.
  - alert: A13nWorkersMissing
    expr: (max by (job,deployment) (a13n_backlog_oldest_age_seconds{job="a13n-service",queue="runs"} and on (job,deployment,instance,queue)
      (time() - a13n_backlog_updated_seconds{job="a13n-service"} < 60)) > 60) unless on (job,deployment) (sum by
      (job,deployment) (a13n_worker_slots{job="a13n-service"}) > 0)
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: No worker capacity is visible for waiting Runs
      description: Check worker processes, scrape configuration and role labels. Absence of a slot series is not
        zero utilization.
  - alert: A13nBacklogCountCapped
    expr: max by (job,deployment,queue) ((a13n_backlog_size{job="a13n-service"} and on (job,deployment,instance,queue)
      (time() - a13n_backlog_updated_seconds{job="a13n-service"} < 60)) >= bool a13n_backlog_limit{job="a13n-service"})
      == 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Bounded backlog count reached its ceiling
      description: Queue {{ $labels.queue }} is at least the reported size. Investigate age and throughput; do not
        treat the count as exact.
