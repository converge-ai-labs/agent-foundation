# Optional preset; load only if wanted. Configure deployment labels and adjust thresholds first.
groups:
- name: a13n-service-availability
  rules:
  - alert: A13nServiceDown
    expr: up{job="a13n-service"} == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Service metrics target is unreachable
      description: Scraping {{ $labels.instance }} failed. Check the process and separately /readyz. A removed discovery
        target is not detected by up == 0.
  - alert: A13nServiceErrors
    expr: (sum by (job,deployment) (rate(http_server_request_duration_seconds_count{job="a13n-service",a13n_request_kind="api",http_response_status_code=~"5.."}[5m]))
      / sum by (job,deployment) (rate(http_server_request_duration_seconds_count{job="a13n-service",a13n_request_kind="api"}[5m]))
      > 0.05) and on (job,deployment) (sum by (job,deployment) (rate(http_server_request_duration_seconds_count{job="a13n-service",a13n_request_kind="api",http_response_status_code=~"5.."}[5m]))
      > 0.02)
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Business API requests are failing
      description: '{{ $labels.deployment }}: >5% 5xx and >0.02 failures/sec over 5m, sustained 10m. Probes, static
        content and SSE excluded. Inspect request logs.'
  - alert: A13nBacklogSnapshotStale
    expr: (time() - a13n_backlog_updated_seconds{job="a13n-service"} > 60) or (up{job="a13n-service",role=~"all|control"}
      == 1 unless on (job,deployment,instance) a13n_backlog_updated_seconds{job="a13n-service"})
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Backlog reporter is stale or has not initialized
      description: Cached queue values are excluded after 60s. Check report_backlog, sweeps and PostgreSQL before
        interpreting missing queues.
  - alert: A13nSweepStalled
    expr: (time() - a13n_sweep_last_success_seconds{job="a13n-service"}) > a13n_sweep_stale_after_seconds{job="a13n-service"}
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Sweep has not completed a scan
      description: '{{ $labels.sweep }} on {{ $labels.instance }} exceeded its startup/interval/deadline allowance.
        Item outcomes are independent.'
