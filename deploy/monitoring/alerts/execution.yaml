# Optional preset; load only if wanted. Configure deployment labels and adjust thresholds first.
groups:
- name: a13n-service-execution
  rules:
  - alert: A13nRunFailures
    expr: (sum by (job,deployment) (rate(a13n_runs_sealed_total{job="a13n-service",status="failed"}[15m])) / sum
      by (job,deployment) (rate(a13n_runs_sealed_total{job="a13n-service",status=~"failed|completed"}[15m])) > 0.2)
      and on (job,deployment) (sum by (job,deployment) (increase(a13n_runs_sealed_total{job="a13n-service",status="failed"}[15m]))
      >= 5)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Run failure rate is elevated
      description: Failure share among completed+failed seals, not accepted cohort success. waiting/cancelled excluded;
        >=5 failures in 15m. Inspect reason breakdown.
  - alert: A13nOutboxDead
    expr: max by (job,deployment,kind) (a13n_outbox_dead{job="a13n-service"} and on (job,deployment,instance) (time()
      - a13n_outbox_updated_seconds{job="a13n-service"} < 60)) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Retained dead outbox deliveries exist
      description: Kind {{ $labels.kind }} needs diagnosis. This is retained state, not only newly dead events;
        purging clears it.
  - alert: A13nOutboxSettlementFailing
    expr: sum by (job,deployment,kind) (increase(a13n_outbox_settlement_failures_total{job="a13n-service"}[15m]))
      >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Outbox results cannot be settled
      description: Claims retry after lease expiry. Inspect Outbox settlement failed logs and database availability.
  - alert: A13nSweepItemsFailing
    expr: sum by (job,deployment,sweep) (increase(a13n_sweep_items_total{job="a13n-service",result="failed"}[15m]))
      >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Isolated background calls are failing
      description: '{{ $labels.sweep }} may report a succeeded outer pass while its item calls fail. Inspect item-level
        logs.'
  - alert: A13nSweepFailing
    expr: sum by (job,deployment,sweep) (increase(a13n_sweep_passes_total{job="a13n-service",result="failed"}[15m]))
      >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Background sweep scans are failing
      description: Inspect Sweep failed logs. A successful pass does not prove all individual work succeeded.
  - alert: A13nLeaseExpiry
    expr: sum by (job,deployment) (increase(a13n_attempt_ended_total{job="a13n-service",reason="lease_expired"}[15m]))
      >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Attempts repeatedly lose their worker lease
      description: Inspect worker shutdown/crashes, heartbeat/storage failures and recovery starts. Planned handoffs
        are excluded.
  - alert: A13nScheduleMissedDeadline
    expr: sum by (job,deployment) (increase(a13n_schedule_dispositions_total{job="a13n-service",trigger="scheduled",reason="missed_deadline"}[15m]))
      >= 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Scheduled inputs missed dispatch deadlines
      description: Inspect scheduling queues, creator authority, dispatch retries and worker/control health. Submission
        is distinct from execution.
  - alert: A13nStreamDegraded
    expr: sum by (job,deployment) (increase(a13n_stream_dropped_total{job="a13n-service"}[5m])) >= 100
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Live output is being dropped
      description: Durable checkpoint output may still be intact. Inspect Redis, writer buffers and oversized frames;
        gap counts are per reader.
