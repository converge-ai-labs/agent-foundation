# Replace every REPLACE_* value; this uses an S3-compatible endpoint, NOT GCS.
roles:
  control:
    replicaCount: 2
  worker:
    replicaCount: 2
image:
  repository: us-central1-docker.pkg.dev/REPLACE_PROJECT/REPLACE_REPOSITORY/a13n-service
  tag: REPLACE_IMMUTABLE_TAG
publicUrl: https://agents.example.com
# Google's load-balancer proxy ranges forward client addresses.
trustedProxies: [35.191.0.0/16, 130.211.0.0/22]
objects:
  backend: s3
  bucket: REPLACE_S3_COMPATIBLE_BUCKET
  region: us-east-1
  endpointUrl: https://REPLACE_S3_ENDPOINT.example.com
service:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"a13n-backend"}'
ingress:
  enabled: false # Enable after configuring a TLS Secret and GKE Ingress.
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "false"
  tls:
    - hosts: [agents.example.com]
      secretName: a13n-ingress-tls
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
