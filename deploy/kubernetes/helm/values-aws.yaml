# Replace every REPLACE_* value; external infrastructure must already exist.
roles:
  control:
    replicaCount: 2
  worker:
    replicaCount: 2
image:
  repository: REPLACE_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/a13n-service
  tag: REPLACE_IMMUTABLE_TAG
publicUrl: https://agents.example.com
# The load balancer forwards client addresses from inside the VPC.
trustedProxies: [REPLACE_VPC_CIDR]
objects:
  backend: s3
  bucket: REPLACE_S3_BUCKET
  region: us-east-1
ingress:
  enabled: false # Enable after the controller, certificate and DNS are prepared.
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
# Associate this release's ServiceAccount with an IAM role through EKS Pod Identity
# or IRSA. The role must permit the Service object-store operations on the bucket.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
