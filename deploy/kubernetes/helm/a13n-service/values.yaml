# One image runs the control and worker Deployments and the per-revision migration Job; control also serves Console.
image:
  repository: ghcr.io/converge-ai-labs/a13n-service
  # Empty selects the chart's appVersion.
  tag: ""
  # When set, repository@digest takes precedence over tag and appVersion.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Credential settings as A13N_<SECTION>__<FIELD> keys, such as the database URL and encryption key ring.
existingSecret: a13n-service-secrets
# The externally reachable Service URL; browsers may change state only from its origin.
publicUrl: http://127.0.0.1:8000
# Addresses or CIDRs of the front proxies whose forwarded client addresses are trusted.
trustedProxies: []
# Must cover HTTP shutdown, background-task cleanup and client/telemetry shutdown together.
# Increase this when raising server.shutdown_timeout or worker.drain_seconds in Service settings.
terminationGracePeriodSeconds: 60
# Each role runs replicaCount Pods, or with autoscaling enabled, keeps its CPU near the target share of its request.
roles:
  control:
    replicaCount: 1
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
  worker:
    replicaCount: 1
    resources: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
objects:
  # local: a claim every Service Pod mounts; s3: an S3-compatible bucket.
  backend: local
  bucket: ""
  prefix: ""
  region: ""
  endpointUrl: ""
  # Empty preserves Service defaults; otherwise auto, path or virtual.
  addressingStyle: ""
# Local objects only. The chart's claim is retained on uninstall.
persistence:
  existingClaim: ""
  storageClassName: null
  size: 10Gi
# The control Service, which serves the API and Console.
service:
  type: ClusterIP
  # Extra metadata labels on the control Service only; never copied to selectors or Pods.
  labels: {}
  annotations: {}
  nodePort: 30080
serviceAccount:
  create: true
  # Empty uses the release-derived name when create is true; required when create is false.
  name: ""
  annotations: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: agents.example.com
  paths: [/]
  tls: []
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
# Prometheus metrics of every Service Pod, on their own port, which no Service or Ingress exposes. Pods carry
# prometheus.io scrape annotations; a PodMonitor serves the Prometheus or VictoriaMetrics operator instead.
metrics:
  enabled: true
  port: 9464
  podMonitor:
    enabled: false
    interval: 30s
    # Labels the operator's podMonitorSelector matches, such as release: kube-prometheus-stack.
    labels: {}
# Additional non-secret TOML sections, such as [providers] or [telemetry]. The chart writes [server], [database],
# [objects] and, with bundled Redis, [redis]; set their other fields as A13N_<SECTION>__<FIELD> Secret keys.
extraConfig: ""
# Optional Environment metrics collection; separate from Service process metrics above.
monitoring:
  vmagent:
    enabled: false
    image:
      repository: victoriametrics/vmagent
      tag: v1.128.0
      digest: ""
      pullPolicy: IfNotPresent
    # Convenience for a Prometheus server with its remote-write receiver enabled.
    # Derives /api/v1/write only when remoteWriteUrl is empty; never inferred from queryEndpoint.
    prometheusUrl: ""
    remoteWriteUrl: ""
    remoteWriteBearerTokenSecret:
      name: ""
      key: token
    remoteWriteCASecret:
      name: ""
      key: ca.crt
    persistence:
      existingClaim: ""
      storageClassName: null
      size: 10Gi
    # Leave space for fragment files, queue chunks and filesystem overhead.
    maxDiskUsage: 8GiB
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # This is a full control process, isolated from the public API Service and HPA.
    writerResources: {}
  deploymentPreset:
    enabled: false
    name: Deployment metrics
    collector: vmagent
    # Query API base, independently configured from the ingestion destination.
    # Empty uses vmagent.prometheusUrl, when provided.
    queryEndpoint: ""
    # Only these workspaces' administrators can view or confirm the preset.
    workspaceIds: []
    queryBearerTokenSecret:
      name: ""
      key: token
redis:
  enabled: false
  image: redis:7-alpine
  storageClassName: null
  size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
postgresql:
  enabled: false
  image: postgres:17-alpine
  existingSecret: a13n-postgres-secrets
  storageClassName: null
  size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
