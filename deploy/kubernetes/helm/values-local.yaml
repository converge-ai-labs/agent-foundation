# Local kind cluster: bundled development stores, local objects on the node, Service and Console on 127.0.0.1:8080.
image:
  repository: a13n-service
  tag: local
  pullPolicy: Never
publicUrl: http://127.0.0.1:8080
service:
  type: NodePort
  nodePort: 30080
redis:
  enabled: true
postgresql:
  enabled: true
