# Generic Alibaba Cloud ACS example: copy to a private file and replace placeholders.
# No company-specific deployment tool or gateway is required.
image:
  repository: REPLACE_REGISTRY/REPLACE_NAMESPACE/a13n-service
  tag: REPLACE_IMMUTABLE_TAG
  # Alternatively set sha256:<64 hexadecimal characters>; digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent
existingSecret: a13n-service-secrets
imagePullSecrets:
  - name: REPLACE_IMAGE_PULL_SECRET
# The chart creates a workload account; use create:false + name for a pre-existing account.
serviceAccount:
  create: true
  name: ""
publicUrl: https://agents.example.com
# Set the actual ingress proxy addresses/CIDRs; never trust arbitrary clients.
trustedProxies: []
terminationGracePeriodSeconds: 300
service:
  type: ClusterIP
  labels: {}
  annotations: {}
# Choose a controller already installed in the target cluster and an existing TLS Secret.
# No ingress controller, load balancer, DNS record or certificate is provisioned by this chart.
ingress:
  enabled: true
  className: REPLACE_INGRESS_CLASS
  host: agents.example.com
  paths: [/]
  tls:
    - secretName: REPLACE_TLS_SECRET
      hosts: [agents.example.com]
roles:
  control:
    replicaCount: 1
  worker:
    replicaCount: 1
# Supply external endpoints and credentials using service-acs.env.example.
postgresql:
  enabled: false
redis:
  enabled: false
objects:
  backend: s3
  bucket: REPLACE_BUCKET
  prefix: service/
  region: REPLACE_REGION
  endpointUrl: https://REPLACE_S3_ENDPOINT
# Alternative to S3: all Service Pods must mount the same existing RWX filesystem.
# objects:
#   backend: local
# persistence:
#   existingClaim: REPLACE_SHARED_OBJECTS_PVC
# Verify S3 conditional writes before choosing an OSS endpoint. An OSS mount is not
# automatically equivalent to the filesystem backend's hard-link and fsync operations.
# Set A13N_OBJECTS__PATH_STYLE in the Secret when the S3 provider requires it.
