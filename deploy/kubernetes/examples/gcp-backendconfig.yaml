# Requires GKE's BackendConfig CRD. Apply in the release namespace before enabling
# Ingress; values-gcp.yaml references this object from its Service annotations.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: a13n-backend
spec:
  timeoutSec: 3600
  healthCheck:
    type: HTTP
    port: 8000
    requestPath: /readyz
