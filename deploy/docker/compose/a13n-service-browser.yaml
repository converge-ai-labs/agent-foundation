# Linux single-host Service with Docker Browser support. Docker socket access grants host-level authority.
name: a13n-service-browser
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a13n_service
      POSTGRES_USER: a13n_service
      POSTGRES_PASSWORD: a13n_service
    ports:
      - "127.0.0.1:${A13N_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a13n_service -d a13n_service"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${A13N_REDIS_PORT:-16379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  service:
    image: ${A13N_SERVICE_IMAGE:-ghcr.io/converge-ai-labs/a13n-service:latest}
    user: root
    network_mode: host
    environment:
      A13N_SERVER__HOST: 127.0.0.1
      A13N_SERVER__PORT: ${A13N_PORT:-8080}
      A13N_SERVER__PUBLIC_URL: ${A13N_PUBLIC_URL:-http://127.0.0.1:${A13N_PORT:-8080}}
      A13N_DATABASE__URL: postgresql+psycopg://a13n_service:a13n_service@127.0.0.1:${A13N_POSTGRES_PORT:-15432}/a13n_service
      A13N_REDIS__URL: redis://127.0.0.1:${A13N_REDIS_PORT:-16379}/0
      A13N_BROWSERS__ROOT: /app/var/browsers
      A13N_PROVISIONING__DOCKER: '{"enabled":true}'
      A13N_ENCRYPTION__KEY_FILE: /app/var/encryption.key
    volumes:
      - service-data:/app/var
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${A13N_PORT:-8080}/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      start_interval: 2s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
volumes:
  postgres:
  redis:
  service-data:
