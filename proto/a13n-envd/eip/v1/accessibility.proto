// Session-local accessibility handles. No Harness execution identity crosses EIP.
// Native units, protected values and cross-field limits are checked before native dispatch.
// google.protobuf.Value is limited to scalar native values: bool, integer, finite number, string.
// State maps accept bool or string only. Containers and null are invalid in these fields.

