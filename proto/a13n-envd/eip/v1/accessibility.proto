}

message AccessibilityActionReference {
  AccessibilityNodeReference node = 1;
  string action_handle = 2 [(eip_field).min_length = 1, (eip_field).max_length = 128];
  string native_identifier = 3 [(eip_field).min_length = 1, (eip_field).max_length = 1024];
}

message AccessibilityAttributeRun {
  AccessibilityRangeReference range = 1;
  repeated AccessibilityProperty properties = 2 [(eip_field).max_length = 128];
}

message AccessibilityBoundsValue {
  string kind = 1 [(eip_field).const_string = "bounds", (eip_field).default_string = "bounds"];
  repeated AccessibilityNativeBounds values = 2 [(eip_field).max_length = 512];
}

message AccessibilityCapability {
  string operation = 1 [(eip_field).min_length = 1, (eip_field).max_length = 128];
  AccessibilityCapabilitySupported supported = 2;
  string source = 3 [(eip_field).max_length = 128];
  optional AccessibilityActionReference action = 4;
  optional string label = 5;
  optional string description = 6;
}

message AccessibilityCompleteness {
  bool complete = 1;
  optional AccessibilityCompletenessReason reason = 2;
  optional AccessibilityCursor continuation = 3;
  string consistency = 4 [(eip_field).const_string = "live", (eip_field).default_string = "live"];
}

message AccessibilityAttributeMetadata {
  string name = 1 [(eip_field).min_length = 1, (eip_field).max_length = 1024];
  bool parameterized = 2;
  optional bool writable = 3;
}

message AccessibilityContent {
  AccessibilityNodeReference node = 1;
  google.protobuf.Timestamp sampled_at = 2;
  AccessibilityCompleteness completeness = 3;
  optional AccessibilityTextContent text = 4;
  repeated AccessibilityProperty properties = 5 [(eip_field).max_length = 512];
  repeated AccessibilityNode nodes = 6 [(eip_field).max_length = 512];
  repeated AccessibilityRangeReference ranges = 7 [(eip_field).max_length = 256];
  repeated AccessibilityFieldError field_errors = 8 [(eip_field).max_length = 128];
  repeated AtspiDocumentSelection document_selections = 9 [(eip_field).max_length = 256];
  repeated AccessibilityAttributeMetadata attributes = 10 [(eip_field).max_length = 512];
}

message AccessibilityCursor {
  AccessibilityNodeReference root = 1;
  string cursor_handle = 2 [(eip_field).min_length = 1, (eip_field).max_length = 128];
}

message AccessibilityDescription {
  AccessibilityDescriptionBackend backend = 1;
  optional string backend_epoch = 2;
  bool ready = 3;
  AccessibilityDescriptionReason reason = 4;
  string desktop_identity = 5 [(eip_field).max_length = 1024];
  repeated string methods = 6 [(eip_field).max_length = 128];
  repeated AccessibilityDescriptionFrames frames = 7;
  AccessibilityLimits limits = 8 [(eip_field).default_message = true];
}

message AccessibilityFieldError {
  string field = 1 [(eip_field).max_length = 128];
  AccessibilityFieldErrorReason reason = 2;
  optional sint32 native_code = 3;
}

message AccessibilityFind {
  optional string role = 1;
  optional string native_role = 2;
  optional string name = 3;
  AccessibilityFindNameMatch name_match = 4 [(eip_field).default_string = "exact"];
  optional string identifier = 5;
  map<string, google.protobuf.Value> states = 6 [(eip_field).max_length = 128, (eip_field).json_primitives = EIP_JSON_PRIMITIVE_BOOLEAN, (eip_field).json_primitives = EIP_JSON_PRIMITIVE_STRING];
  optional string operation = 7;
}

message AccessibilityIdleRead {
  string kind = 1 [(eip_field).const_string = "wait_for_input_idle", (eip_field).default_string = "wait_for_input_idle"];
  uint32 timeout_ms = 2 [(eip_field).minimum = 0, (eip_field).maximum = 15000, (eip_field).default_uint = 1000];
}

message AccessibilityItemRead {
  string kind = 1 [(eip_field).const_string = "item", (eip_field).default_string = "item"];
  AccessibilityItemReadSource source = 2;
  string name = 3 [(eip_field).max_length = 4096];
  optional AccessibilityNodeReference after = 4;
}

message AccessibilityLimits {
