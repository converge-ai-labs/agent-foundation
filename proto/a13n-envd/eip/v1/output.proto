syntax = "proto3";

package a13n.agent_envd.eip.v1;

import "a13n-envd/eip/v1/common.proto";
import "a13n-envd/eip/v1/options.proto";

message EncodedBytes {
  string encoding = 1 [(eip_field).const_string = "base64"];
  string data = 2 [(eip_field).string_format = EIP_STRING_FORMAT_BASE64_UNPADDED];
}

message OutputInfo {
  OutputReference reference = 1;
  bool producer_complete = 2;
  bool content_complete = 3;
  uint64 produced_bytes = 4;
  uint64 retained_bytes = 5;
  EncodedBytes preview = 6;
}

message OutputReadParams {
  reserved 3, 5;
  reserved "cursor", "output_policy";

  EIPCallContext context = 1;
  OutputReference reference = 2;
  uint64 start_offset = 4;
  optional uint64 wait_ms = 6 [(eip_field).default_uint = 0];
}

message OutputReadResult {
  reserved 1, 2, 3;
  reserved "chunks", "next_cursor", "capture";

  uint64 next_offset = 4;
  uint64 start_offset = 5;
  EncodedBytes data = 6;
  OutputInfo output = 7;
}

message OutputReleaseParams {
  reserved 3;
  reserved "cursor";

  EIPCallContext context = 1;
  OutputReference reference = 2;
}

message OutputReleaseResult {
  bool released = 1;
  OperationReceipt receipt = 2;
}
