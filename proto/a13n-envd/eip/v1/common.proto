syntax = "proto3";

package a13n.agent_envd.eip.v1;

import "google/protobuf/timestamp.proto";
import "a13n-envd/eip/v1/options.proto";

message ProcessHandle {
  option (eip_message).transparent = true;
  string value = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
}

message FileReaderHandle {
  option (eip_message).transparent = true;
  string value = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
}

message FileWriterHandle {
  option (eip_message).transparent = true;
  string value = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
}

message OutputReference {
  option (eip_message).transparent = true;
  string value = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
}

message ContentDigest {
  string algorithm = 1 [(eip_field).const_string = "sha256"];
  string value = 2 [(eip_field).string_format = EIP_STRING_FORMAT_SHA256];
}

message EIPCallContext {
  reserved 2, 3, 4;
  reserved "deadline", "idempotency_key", "invocation_grant";

  string operation_id = 1 [
    (eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER,
    (eip_field).max_length = 128
  ];
  optional uint64 timeout_ms = 5 [(eip_field).minimum = 1];
}

enum ReceiptStage {
  RECEIPT_STAGE_UNSPECIFIED = 0;
  RECEIPT_STAGE_ACCEPTED = 1 [(eip_enum_value).json_name = "accepted"];
  RECEIPT_STAGE_DISPATCHED = 2 [(eip_enum_value).json_name = "dispatched"];
  RECEIPT_STAGE_EXEC_CONFIRMED = 3 [(eip_enum_value).json_name = "exec_confirmed"];
  RECEIPT_STAGE_COMPLETED = 4 [(eip_enum_value).json_name = "completed"];
  RECEIPT_STAGE_UNKNOWN = 5 [(eip_enum_value).json_name = "unknown"];
}

enum ReceiptOutcome {
  RECEIPT_OUTCOME_UNSPECIFIED = 0;
  RECEIPT_OUTCOME_SUCCEEDED = 1 [(eip_enum_value).json_name = "succeeded"];
  RECEIPT_OUTCOME_FAILED = 2 [(eip_enum_value).json_name = "failed"];
  RECEIPT_OUTCOME_CANCELLED = 3 [(eip_enum_value).json_name = "cancelled"];
  RECEIPT_OUTCOME_TIMED_OUT = 4 [(eip_enum_value).json_name = "timed_out"];
  RECEIPT_OUTCOME_UNKNOWN = 5 [(eip_enum_value).json_name = "unknown"];
}

message OperationReceipt {
  reserved 1;
  reserved "receipt_ref";

  string operation_id = 2 [
    (eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER,
    (eip_field).max_length = 128
  ];
  string method = 3;
  string environment_id = 4 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  uint64 generation = 5 [(eip_field).minimum = 1];
  string request_digest = 6 [(eip_field).string_format = EIP_STRING_FORMAT_SHA256];
  ReceiptStage stage = 7;
  optional ReceiptOutcome outcome = 8;
  google.protobuf.Timestamp observed_at = 9;
}

enum OperationCancelStatus {
  OPERATION_CANCEL_STATUS_UNSPECIFIED = 0;
  OPERATION_CANCEL_STATUS_NOT_FOUND = 1 [(eip_enum_value).json_name = "not_found"];
  OPERATION_CANCEL_STATUS_ALREADY_TERMINAL = 2 [(eip_enum_value).json_name = "already_terminal"];
  OPERATION_CANCEL_STATUS_CANCELLATION_REQUESTED = 3 [(eip_enum_value).json_name = "cancellation_requested"];
  OPERATION_CANCEL_STATUS_NOT_CANCELLABLE = 4 [(eip_enum_value).json_name = "not_cancellable"];
}

message OperationCancelParams {
  EIPCallContext context = 1;
  string target_operation_id = 2 [
    (eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER,
    (eip_field).max_length = 128
  ];
}

message OperationCancelResult {
  OperationCancelStatus status = 1;
}

message ReceiptGetParams {
  reserved 2;
  reserved "receipt_ref";

  EIPCallContext context = 1;
  string operation_id = 3 [
    (eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER,
    (eip_field).max_length = 128
  ];
}

message ReceiptGetResult {
  OperationReceipt receipt = 1;
}
