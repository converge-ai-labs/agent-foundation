syntax = "proto3";

package a13n.agent_envd.eip.v1;

import "google/protobuf/timestamp.proto";
import "a13n-envd/eip/v1/common.proto";
import "a13n-envd/eip/v1/options.proto";

message EIPPath {
  string mount_id = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  string path = 2 [(eip_field).string_format = EIP_STRING_FORMAT_PATH];
}

message MountDescriptor {
  reserved 6;
  reserved "supports_file_revision";

  string mount_id = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  string logical_root = 2 [(eip_field).string_format = EIP_STRING_FORMAT_PATH];
  bool writable = 3;
  optional bool case_sensitive = 4;
  bool supports_atomic_replace = 5;
  uint64 max_file_bytes = 7;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_FILE = 1 [(eip_enum_value).json_name = "file"];
  FILE_KIND_DIRECTORY = 2 [(eip_enum_value).json_name = "directory"];
  FILE_KIND_SYMLINK = 3 [(eip_enum_value).json_name = "symlink"];
  FILE_KIND_OTHER = 4 [(eip_enum_value).json_name = "other"];
}

message FileInfo {
  reserved 6;
  reserved "revision";

  EIPPath path = 1;
  FileKind kind = 2;
  optional uint64 size_bytes = 3;
  optional google.protobuf.Timestamp modified_at = 4;
  optional bool executable = 5;
}

message FileStatParams {
  EIPCallContext context = 1;
  EIPPath path = 2;
  optional bool follow_symlinks = 3 [(eip_field).default_bool = true];
}

message FileStatResult {
  FileInfo info = 1;
}

message FileReadTextParams {
  reserved 3, 4, 6, 7;
  reserved "cursor", "start_line", "max_bytes", "expected_revision";

  EIPCallContext context = 1;
  EIPPath path = 2;
  uint64 line_limit = 5 [(eip_field).minimum = 1];
  optional uint64 line_offset = 8 [(eip_field).default_uint = 0];
  uint64 max_line_length = 9 [(eip_field).minimum = 1];
}

message FileReadTextResult {
  reserved 3, 4, 5, 6, 7;
  reserved "start", "end", "next_cursor", "content_complete", "truncated";

  FileInfo info = 1;
  string text = 2;
  uint64 line_offset = 8;
  uint64 lines_read = 9;
  bool has_more = 10;
  repeated uint64 truncated_lines = 11;
}

message FileByteRange {
  optional uint64 offset = 1 [(eip_field).default_uint = 0];
  optional uint64 length = 2;
}

message FileReaderOpenParams {
  reserved 4, 5;
  reserved "expected_revision", "transfer_deadline";

  EIPCallContext context = 1;
  EIPPath path = 2;
  optional FileByteRange byte_range = 3;
  optional uint64 transfer_timeout_ms = 6 [(eip_field).minimum = 1];
}

message FileReaderOpenResult {
  reserved 3, 4, 5;
  reserved "range_start", "range_end", "source_eof_at_end";

  FileReaderHandle reader = 1;
  FileInfo info = 2;
  google.protobuf.Timestamp expires_at = 6;
}

message FileReadCompletion {
  reserved 1, 2, 5, 6, 7;
  reserved "range_start", "range_end", "source_eof_at_end", "stability", "complete";

  uint64 produced_bytes = 3;
  ContentDigest digest = 4;
}

message FileReaderCloseParams {
  reserved 3;
  reserved "accept_complete";

  EIPCallContext context = 1;
  FileReaderHandle reader = 2;
}

message FileReaderCloseResult {
  FileReadCompletion completion = 1;
}

message FileListParams {
  reserved 3, 4, 5, 6;
  reserved "recursive", "max_depth", "cursor", "output_policy";

  EIPCallContext context = 1;
  EIPPath path = 2;
  optional uint64 offset = 7 [(eip_field).default_uint = 0];
  optional uint32 max_results = 8 [(eip_field).minimum = 1, (eip_field).default_uint = 100];
  optional bool include_hidden = 9 [(eip_field).default_bool = false];
}

message FileListEntry {
  string relative_path = 1;
  FileInfo info = 2;
}

message FileListResult {
  reserved 2;
  reserved "output";

  repeated FileListEntry entries = 1;
  uint64 offset = 3;
  bool has_more = 4;
  uint64 omitted_unrepresentable_entries = 5;
}

message FileFindParams {
  reserved 4, 5, 6, 7, 8;
  reserved "mode", "kind", "max_depth", "cursor", "output_policy";

  EIPCallContext context = 1;
  EIPPath root = 2;
  string pattern = 3;
  optional uint64 offset = 9 [(eip_field).default_uint = 0];
  optional uint32 max_results = 10 [(eip_field).minimum = 1, (eip_field).default_uint = 100];
  optional bool recursive = 11 [(eip_field).default_bool = true];
  optional bool include_hidden = 12 [(eip_field).default_bool = false];
  repeated FileKind kinds = 13;
  optional bool respect_git_ignore = 14 [(eip_field).default_bool = false];
}

message FileFindResult {
  reserved 2;
  reserved "output";

  repeated FileListEntry entries = 1;
  uint64 offset = 3;
  bool has_more = 4;
  uint64 omitted_unrepresentable_entries = 5;
}

enum SearchMode {
  reserved 2;
  reserved "SEARCH_MODE_GLOB";

  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_LITERAL = 1 [(eip_enum_value).json_name = "literal"];
  SEARCH_MODE_REGEX = 3 [(eip_enum_value).json_name = "regex"];
}

message FileSearchParams {
  reserved 5, 6, 7, 8, 9;
  reserved "include", "exclude", "max_depth", "cursor", "output_policy";

  EIPCallContext context = 1;
  EIPPath root = 2;
  string query = 3;
  SearchMode mode = 4;
  optional bool case_sensitive = 10 [(eip_field).default_bool = true];
  optional uint64 offset = 11 [(eip_field).default_uint = 0];
  optional uint32 max_results = 12 [(eip_field).minimum = 1, (eip_field).default_uint = 100];
  optional bool include_hidden = 13 [(eip_field).default_bool = false];
  uint64 max_line_length = 14 [(eip_field).minimum = 1];
  optional string include_pattern = 15 [(eip_field).default_string = "**/*"];
  optional bool respect_git_ignore = 16 [(eip_field).default_bool = false];
  optional uint32 context_lines = 17 [(eip_field).default_uint = 0, (eip_field).maximum = 20];
  optional uint32 max_matches_per_file = 18 [(eip_field).minimum = 1];
  optional uint32 max_files = 19 [(eip_field).minimum = 1];
  optional uint64 max_file_bytes = 20 [(eip_field).minimum = 1, (eip_field).default_uint = 67108864];
}

message FileSearchMatch {
  reserved 3;
  reserved "byte_offset";

  EIPPath path = 1;
  uint64 line_number = 2 [(eip_field).minimum = 1];
  string preview = 4;
  bool preview_truncated = 5;
  optional string context = 6 [(eip_field).default_string = ""];
  optional uint64 context_start_line = 7 [(eip_field).minimum = 1, (eip_field).default_uint = 1];
}

message FileSearchResult {
  reserved 2;
  reserved "output";

  repeated FileSearchMatch matches = 1;
  uint64 offset = 3;
  bool has_more = 4;
  uint64 omitted_unrepresentable_entries = 5;
}

enum FileWriteMode {
  reserved 5;
  reserved "FILE_WRITE_MODE_WRITE_AT";

  FILE_WRITE_MODE_UNSPECIFIED = 0;
  FILE_WRITE_MODE_CREATE = 1 [(eip_enum_value).json_name = "create"];
  FILE_WRITE_MODE_REPLACE = 2 [(eip_enum_value).json_name = "replace"];
  FILE_WRITE_MODE_UPSERT = 3 [(eip_enum_value).json_name = "upsert"];
  FILE_WRITE_MODE_APPEND = 4 [(eip_enum_value).json_name = "append"];
}

message FileWriteTextParams {
  reserved 5;
  reserved "expected_revision";

  EIPCallContext context = 1;
  EIPPath path = 2;
  FileWriteMode mode = 3;
  string text = 4;
  optional bool executable = 6;
}

message FileWriteTextResult {
  FileInfo info = 1;
  uint64 bytes_written = 2;
  OperationReceipt receipt = 3;
}

message FileCommitCondition {
  EIPPath path = 1;
  optional ContentDigest digest = 2;
}

message FileCommitWrite {
  EIPPath path = 1;
  string text = 2;
}

message FileCommitParams {
  EIPCallContext context = 1;
  EIPPath root = 2;
  repeated FileCommitCondition conditions = 3;
  repeated EIPPath directories = 4;
  repeated FileCommitWrite writes = 5;
  repeated EIPPath removals = 6;
}

message FileCommitResult {
  uint64 files_written = 1;
  OperationReceipt receipt = 2;
}

message FileWriterOpenParams {
  reserved 4, 6;
  reserved "expected_revision", "transfer_deadline";

  EIPCallContext context = 1;
  EIPPath path = 2;
  FileWriteMode mode = 3;
  optional bool executable = 5;
  optional uint64 transfer_timeout_ms = 7 [(eip_field).minimum = 1];
}

message FileWriterOpenResult {
  FileWriterHandle writer = 1;
  uint64 max_transfer_bytes = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message FileWriterCommitParams {
  EIPCallContext context = 1;
  FileWriterHandle writer = 2;
  uint64 transferred_bytes = 3;
  ContentDigest transfer_digest = 4;
}

message FileWriterCommitResult {
  FileInfo info = 1;
  uint64 transferred_bytes = 2;
  ContentDigest transfer_digest = 3;
  OperationReceipt receipt = 4;
}

enum FileWriterAbortStatus {
  FILE_WRITER_ABORT_STATUS_UNSPECIFIED = 0;
  FILE_WRITER_ABORT_STATUS_ABORTED = 1 [(eip_enum_value).json_name = "aborted"];
  FILE_WRITER_ABORT_STATUS_ALREADY_ABORTED = 2 [(eip_enum_value).json_name = "already_aborted"];
  FILE_WRITER_ABORT_STATUS_COMMIT_IN_PROGRESS = 3 [(eip_enum_value).json_name = "commit_in_progress"];
  FILE_WRITER_ABORT_STATUS_ALREADY_COMMITTED = 4 [(eip_enum_value).json_name = "already_committed"];
}

message FileWriterAbortParams {
  EIPCallContext context = 1;
  FileWriterHandle writer = 2;
}

message FileWriterAbortResult {
  FileWriterAbortStatus status = 1;
}

message FileMkdirParams {
  EIPCallContext context = 1;
  EIPPath path = 2;
  optional bool parents = 3 [(eip_field).default_bool = false];
  optional bool exist_ok = 4 [(eip_field).default_bool = false];
}

message FileMkdirResult {
  FileInfo info = 1;
  uint64 created_directories = 2;
  OperationReceipt receipt = 3;
}

message FilePatchTextParams {
  reserved 5;
  reserved "expected_revision";

  EIPCallContext context = 1;
  EIPPath path = 2;
  string patch_format = 3 [(eip_field).const_string = "unified_diff"];
  string patch = 4;
}

message FilePatchTextResult {
  FileInfo info = 1;
  uint64 hunks_applied = 2;
  OperationReceipt receipt = 3;
}

message FileCopyParams {
  reserved 4, 5, 7, 8;
  reserved "expected_source_revision", "expected_destination_revision", "require_atomic_destination", "require_stable_source";

  EIPCallContext context = 1;
  EIPPath source = 2;
  EIPPath destination = 3;
  optional bool replace = 6 [(eip_field).default_bool = false];
}

message FileCopyResult {
  reserved 3, 5;
  reserved "atomic_destination", "source_stability";

  FileInfo destination = 1;
  uint64 bytes_copied = 2;
  OperationReceipt receipt = 4;
}

message FileMoveParams {
  reserved 4, 5;
  reserved "expected_source_revision", "expected_destination_revision";

  EIPCallContext context = 1;
  EIPPath source = 2;
  EIPPath destination = 3;
  optional bool replace = 6 [(eip_field).default_bool = false];
}

message FileMoveResult {
  FileInfo destination = 1;
  OperationReceipt receipt = 2;
}

message FileRemoveParams {
  reserved 4;
  reserved "expected_revision";

  EIPCallContext context = 1;
  EIPPath path = 2;
  FileKind expected_kind = 3;
  optional bool recursive = 5 [(eip_field).default_bool = false];
  optional uint64 max_entries = 6 [(eip_field).default_uint = 1];
}

message FileRemoveResult {
  uint64 removed_entries = 1;
  OperationReceipt receipt = 2;
}

enum PortAddress {
  PORT_ADDRESS_UNSPECIFIED = 0;
  PORT_ADDRESS_LOOPBACK = 1 [(eip_enum_value).json_name = "loopback"];
  PORT_ADDRESS_ANY = 2 [(eip_enum_value).json_name = "any"];
}

enum PortStatus {
  PORT_STATUS_UNSPECIFIED = 0;
  PORT_STATUS_LISTENING = 1 [(eip_enum_value).json_name = "listening"];
  PORT_STATUS_NOT_LISTENING = 2 [(eip_enum_value).json_name = "not_listening"];
  PORT_STATUS_UNKNOWN = 3 [(eip_enum_value).json_name = "unknown"];
}

enum DesiredPortStatus {
  DESIRED_PORT_STATUS_UNSPECIFIED = 0;
  DESIRED_PORT_STATUS_LISTENING = 1 [(eip_enum_value).json_name = "listening"];
  DESIRED_PORT_STATUS_NOT_LISTENING = 2 [(eip_enum_value).json_name = "not_listening"];
}

message PortTarget {
  string protocol = 1 [(eip_field).const_string = "tcp"];
  PortAddress address = 2;
  uint32 port = 3 [(eip_field).minimum = 1, (eip_field).maximum = 65535];
}

message PortObservation {
  PortTarget target = 1;
  PortStatus status = 2;
  optional ProcessHandle managed_process = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message PortInspectParams {
  EIPCallContext context = 1;
  PortTarget target = 2;
}

message PortInspectResult {
  PortObservation observation = 1;
}

message PortWaitParams {
  EIPCallContext context = 1;
  PortTarget target = 2;
  DesiredPortStatus desired_status = 3;
}

message PortWaitResult {
  PortObservation observation = 1;
}
