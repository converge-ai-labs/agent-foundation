syntax = "proto3";

package a13n.agent_envd.eip.v1;

import "a13n-envd/eip/v1/common.proto";
import "a13n-envd/eip/v1/options.proto";
import "a13n-envd/eip/v1/process.proto";

enum ErrorType {
  reserved 28;
  reserved "ERROR_TYPE_INVALID_STATE";

  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_PARSE_ERROR = 1 [(eip_enum_value).json_name = "parse_error", (eip_enum_value).error_code = -32700];
  ERROR_TYPE_INVALID_REQUEST = 2 [(eip_enum_value).json_name = "invalid_request", (eip_enum_value).error_code = -32600];
  ERROR_TYPE_METHOD_NOT_FOUND = 3 [(eip_enum_value).json_name = "method_not_found", (eip_enum_value).error_code = -32601];
  ERROR_TYPE_INVALID_PARAMS = 4 [(eip_enum_value).json_name = "invalid_params", (eip_enum_value).error_code = -32602];
  ERROR_TYPE_INTERNAL_ERROR = 5 [(eip_enum_value).json_name = "internal_error", (eip_enum_value).error_code = -32603];
  ERROR_TYPE_NOT_INITIALIZED = 6 [(eip_enum_value).json_name = "not_initialized", (eip_enum_value).error_code = -32001];
  ERROR_TYPE_ALREADY_INITIALIZED = 7 [(eip_enum_value).json_name = "already_initialized", (eip_enum_value).error_code = -32002];
  ERROR_TYPE_PROTOCOL_INCOMPATIBLE = 8 [(eip_enum_value).json_name = "protocol_incompatible", (eip_enum_value).error_code = -32003];
  ERROR_TYPE_DENIED = 9 [(eip_enum_value).json_name = "denied", (eip_enum_value).error_code = -32010];
  ERROR_TYPE_NOT_FOUND_OR_DENIED = 10 [(eip_enum_value).json_name = "not_found_or_denied", (eip_enum_value).error_code = -32011];
  ERROR_TYPE_UNSUPPORTED = 11 [(eip_enum_value).json_name = "unsupported", (eip_enum_value).error_code = -32012];
  ERROR_TYPE_STALE_GENERATION = 12 [(eip_enum_value).json_name = "stale_generation", (eip_enum_value).error_code = -32020];
  ERROR_TYPE_INVALID_HANDLE = 13 [(eip_enum_value).json_name = "invalid_handle", (eip_enum_value).error_code = -32021];
  reserved 14;
  reserved "ERROR_TYPE_RETENTION_GAP";
  ERROR_TYPE_BUSY = 15 [(eip_enum_value).json_name = "busy", (eip_enum_value).error_code = -32030];
  ERROR_TYPE_QUOTA_EXCEEDED = 16 [(eip_enum_value).json_name = "quota_exceeded", (eip_enum_value).error_code = -32031];
  ERROR_TYPE_OUTPUT_LIMIT_EXCEEDED = 17 [(eip_enum_value).json_name = "output_limit_exceeded", (eip_enum_value).error_code = -32032];
  ERROR_TYPE_TIMEOUT = 18 [(eip_enum_value).json_name = "timeout", (eip_enum_value).error_code = -32040];
  ERROR_TYPE_CANCELLED = 19 [(eip_enum_value).json_name = "cancelled", (eip_enum_value).error_code = -32041];
  ERROR_TYPE_UNKNOWN_OUTCOME = 20 [(eip_enum_value).json_name = "unknown_outcome", (eip_enum_value).error_code = -32042];
  ERROR_TYPE_OPERATION_IN_PROGRESS = 21 [(eip_enum_value).json_name = "operation_in_progress", (eip_enum_value).error_code = -32043];
  reserved 22;
  reserved "ERROR_TYPE_IDEMPOTENCY_CONFLICT";
  ERROR_TYPE_PROVIDER_UNAVAILABLE = 23 [(eip_enum_value).json_name = "provider_unavailable", (eip_enum_value).error_code = -32050];
  ERROR_TYPE_EXECUTION_ISOLATION_FAILED = 24 [(eip_enum_value).json_name = "execution_isolation_failed", (eip_enum_value).error_code = -32051];
  ERROR_TYPE_CLEANUP_FAILED = 25 [(eip_enum_value).json_name = "cleanup_failed", (eip_enum_value).error_code = -32052];
  ERROR_TYPE_COMMAND_START_FAILED = 26 [(eip_enum_value).json_name = "command_start_failed", (eip_enum_value).error_code = -32053];
  ERROR_TYPE_CONFLICT = 27 [(eip_enum_value).json_name = "conflict", (eip_enum_value).error_code = -32060];
  ERROR_TYPE_INTEGRITY_MISMATCH = 29 [(eip_enum_value).json_name = "integrity_mismatch", (eip_enum_value).error_code = -32061];
}

enum RetryHint {
  RETRY_HINT_UNSPECIFIED = 0;
  RETRY_HINT_NEVER = 1 [(eip_enum_value).json_name = "never"];
  RETRY_HINT_SAME_REQUEST = 2 [(eip_enum_value).json_name = "same_request"];
  RETRY_HINT_AFTER_REFRESH = 3 [(eip_enum_value).json_name = "after_refresh"];
  RETRY_HINT_AFTER_CAPACITY = 4 [(eip_enum_value).json_name = "after_capacity"];
  reserved 5;
  reserved "RETRY_HINT_AFTER_AUTHORITY_CHANGE";
  RETRY_HINT_RECONCILE_FIRST = 6 [(eip_enum_value).json_name = "reconcile_first"];
}

enum DispatchStage {
  DISPATCH_STAGE_UNSPECIFIED = 0;
  DISPATCH_STAGE_PRE_DISPATCH = 1 [(eip_enum_value).json_name = "pre_dispatch"];
  DISPATCH_STAGE_DISPATCHING = 2 [(eip_enum_value).json_name = "dispatching"];
  DISPATCH_STAGE_DISPATCHED = 3 [(eip_enum_value).json_name = "dispatched"];
  DISPATCH_STAGE_COMPLETED = 4 [(eip_enum_value).json_name = "completed"];
  DISPATCH_STAGE_UNKNOWN = 5 [(eip_enum_value).json_name = "unknown"];
}

message EIPErrorData {
  ErrorType error_type = 1;
  RetryHint retry_hint = 2;
  DispatchStage dispatch_stage = 3;
  optional string operation_id = 4 [
    (eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER,
    (eip_field).max_length = 128
  ];
  optional string device_id = 5 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  optional string session_id = 22 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  optional uint64 generation = 6 [(eip_field).minimum = 1];
  reserved 7;
  reserved "capability";
  optional string field = 8;
  optional string handle_kind = 9;
  optional uint64 produced_bytes = 10;
  reserved 11, 12;
  reserved "captured_bytes", "dropped_bytes";
  optional uint64 emitted_items = 13;
  optional uint64 dropped_items = 14;
  optional ProcessStatus process_status = 15;
  optional OperationReceipt receipt = 16;
  optional string safe_detail = 17;
  reserved 18, 19;
  reserved "available_start", "available_end";
  optional ProcessInfo process = 20;
  optional ProcessOutput output = 21;
}

message EIPError {
  sint32 code = 1;
  string message = 2;
  EIPErrorData data = 3;
}
