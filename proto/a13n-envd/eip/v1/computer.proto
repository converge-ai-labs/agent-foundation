syntax = "proto3";

package a13n.agent_envd.eip.v1;

import "google/protobuf/timestamp.proto";
import "a13n-envd/eip/v1/common.proto";
import "a13n-envd/eip/v1/options.proto";

// Computer operations observe shared GUI state; they do not acquire a desktop.
message ComputerDescribeParams {
  EIPCallContext context = 1;
}

message ComputerTarget {
  string target_id = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  string name = 2;
  uint32 width = 3 [(eip_field).minimum = 1];
  uint32 height = 4 [(eip_field).minimum = 1];
}

message ComputerDescribeResult {
  repeated ComputerTarget targets = 1;
  bool observe_ready = 2;
  bool input_ready = 3;
  repeated ComputerScrollUnit scroll_units = 4;
}

message ComputerObserveParams {
  EIPCallContext context = 1;
  optional string target_id = 2 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  optional uint32 max_dimension = 3 [(eip_field).minimum = 256, (eip_field).maximum = 2048, (eip_field).default_uint = 1280];
}

message ComputerObservation {
  string observation_id = 1 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  string target_id = 2 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  uint32 width = 3 [(eip_field).minimum = 1];
  uint32 height = 4 [(eip_field).minimum = 1];
  string mime_type = 5;
  google.protobuf.Timestamp captured_at = 6;
}

message ComputerObserveResult {
  ComputerObservation observation = 1;
  FileReaderHandle reader = 2;
  uint64 size_bytes = 3 [(eip_field).minimum = 1];
  google.protobuf.Timestamp expires_at = 4;
}

message ComputerPoint {
  uint32 x = 1;
  uint32 y = 2;
}

enum ComputerButton {
  COMPUTER_BUTTON_UNSPECIFIED = 0;
  COMPUTER_BUTTON_LEFT = 1 [(eip_enum_value).json_name = "left"];
  COMPUTER_BUTTON_RIGHT = 2 [(eip_enum_value).json_name = "right"];
  COMPUTER_BUTTON_MIDDLE = 3 [(eip_enum_value).json_name = "middle"];
}

message ComputerClickParams {
  EIPCallContext context = 1;
  string observation_id = 2 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  ComputerPoint point = 3;
  ComputerButton button = 4;
  optional uint32 count = 5 [(eip_field).minimum = 1, (eip_field).maximum = 2, (eip_field).default_uint = 1];
}

message ComputerMoveParams {
  EIPCallContext context = 1;
  string observation_id = 2 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  ComputerPoint point = 3;
}

message ComputerDragParams {
  EIPCallContext context = 1;
  string observation_id = 2 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  ComputerPoint start = 3;
  ComputerPoint end = 4;
  ComputerButton button = 5;
  optional uint32 duration_ms = 6 [(eip_field).minimum = 100, (eip_field).maximum = 3000, (eip_field).default_uint = 500];
}

enum ComputerScrollUnit {
  COMPUTER_SCROLL_UNIT_UNSPECIFIED = 0;
  COMPUTER_SCROLL_UNIT_PIXELS = 1 [(eip_enum_value).json_name = "pixels"];
  COMPUTER_SCROLL_UNIT_STEPS = 2 [(eip_enum_value).json_name = "steps"];
}

message ComputerScrollParams {
  EIPCallContext context = 1;
  string observation_id = 2 [(eip_field).string_format = EIP_STRING_FORMAT_IDENTIFIER];
  ComputerPoint point = 3;
  sint32 delta_x = 4;
  sint32 delta_y = 5;
  // Omission retains the original pixel semantics.
  optional ComputerScrollUnit unit = 6;
}

message ComputerTypeTextParams {
  EIPCallContext context = 1;
  string text = 2;
}

message ComputerPressKeysParams {
  EIPCallContext context = 1;
  repeated string keys = 2;
}

enum ComputerEffect {
  COMPUTER_EFFECT_UNSPECIFIED = 0;
  COMPUTER_EFFECT_NOT_EXECUTED = 1 [(eip_enum_value).json_name = "not_executed"];
  COMPUTER_EFFECT_EXECUTED = 2 [(eip_enum_value).json_name = "executed"];
  COMPUTER_EFFECT_PARTIAL = 3 [(eip_enum_value).json_name = "partial"];
  COMPUTER_EFFECT_UNKNOWN = 4 [(eip_enum_value).json_name = "unknown"];
}

message ComputerActionResult {
  OperationReceipt receipt = 1;
  ComputerEffect effect = 2;
  bool input_cleanup_complete = 3;
}
