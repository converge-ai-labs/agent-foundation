repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^sdk/go/generated/client\.gen\.go$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-footnote==0.1.3
          - mdformat-front-matters==2.0.0
          - mdformat-gfm==1.0.0

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: sdk-generate
        name: Regenerate SDKs when the Service contract changes
        entry: make sdk-generate
        exclude: ^packages/[^/]+/tests/
        language: system
        files: ^(packages/|scripts/export-a13n-service-openapi\.py$|sdk/codegen/|sdk/openapi\.json$|sdk/typescript/(generate\.mjs|package(-lock)?\.json)$|sdk/python/pyproject\.toml$|uv\.lock$)
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: root-rustfmt
        name: rustfmt (root workspace)
        entry: cargo fmt --all
        language: system
        files: ^crates/.*\.rs$
        pass_filenames: false

      - id: sdk-rustfmt
        name: rustfmt (Rust SDK)
        entry: cargo fmt --manifest-path sdk/rust/Cargo.toml
        language: system
        files: ^sdk/rust/.*\.rs$
        exclude: ^sdk/rust/a13n-service-cli/
        pass_filenames: false

      - id: a13n-service-cli-rustfmt
        name: rustfmt (a13n Service CLI)
        entry: cargo fmt --manifest-path sdk/rust/a13n-service-cli/Cargo.toml
        language: system
        files: ^sdk/rust/a13n-service-cli/.*\.rs$
        pass_filenames: false

      - id: frontend-prettier
        name: Prettier (frontend workspace)
        entry: frontend/node_modules/.bin/prettier --write --ignore-path frontend/.prettierignore
        language: system
        files: ^frontend/.*\.(css|html|js|json|jsx|mjs|ts|tsx|yaml|yml)$

      - id: sdk-typescript-prettier
        name: Prettier (TypeScript SDK)
        entry: npm exec --offline --prefix sdk/typescript -- prettier --write
        language: system
        files: ^sdk/typescript/.*\.(css|html|js|json|jsx|md|mjs|ts|tsx|yaml|yml)$
