# Checkout-owned development infrastructure. All credentials below are public fixtures.
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: local-mem0-database
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mem0 -d mem0"]
      interval: 2s
      timeout: 5s
      retries: 30
  embeddings:
    image: python:3.13.12-slim
    command: [python, /fixture_embeddings.py]
    volumes:
      - ./fixture_embeddings.py:/fixture_embeddings.py:ro
    user: "10001:10001"
    read_only: true
    # No host port: the fixture is reachable only within this Compose project.
  mem0:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      embeddings:
        condition: service_started
    ports:
      - "127.0.0.1:${MEM0_LOCAL_PORT:-18888}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: local-mem0-database
      APP_DB_NAME: mem0
      POSTGRES_COLLECTION_NAME: "${MEM0_OSS_COLLECTION:-memories}"
      ADMIN_API_KEY: "${MEM0_LOCAL_API_KEY:-local-mem0-api-key}"
      JWT_SECRET: public-local-mem0-jwt-secret-not-for-production
      MEM0_TELEMETRY: "false"
      MEM0_OSS_LLM_BASE_URL: "${MEM0_OSS_LLM_BASE_URL:-http://embeddings:18081/v1}"
      MEM0_OSS_LLM_MODEL: "${MEM0_OSS_LLM_MODEL:-local-unused}"
      MEM0_OSS_LLM_API_KEY: "${MEM0_OSS_LLM_API_KEY:-local-fixture-key}"
      MEM0_OSS_EMBEDDING_BASE_URL: "${MEM0_OSS_EMBEDDING_BASE_URL:-http://embeddings:18081/v1}"
      MEM0_OSS_EMBEDDING_MODEL: "${MEM0_OSS_EMBEDDING_MODEL:-local-hash-128}"
      MEM0_OSS_EMBEDDING_API_KEY: "${MEM0_OSS_EMBEDDING_API_KEY:-local-fixture-key}"
      MEM0_OSS_EMBEDDING_DIMENSIONS: "${MEM0_OSS_EMBEDDING_DIMENSIONS:-128}"
      MEM0_OSS_EMBEDDING_SEND_DIMENSIONS: "${MEM0_OSS_EMBEDDING_SEND_DIMENSIONS:-false}"
    volumes:
      - history:/app/history
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/memories/page?user_id=health&top_k=1', headers={'X-API-Key': os.environ['ADMIN_API_KEY']}), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 36
volumes:
  postgres:
  history:
