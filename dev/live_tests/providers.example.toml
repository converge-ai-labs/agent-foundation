# Copy to providers.local.toml (gitignored) and chmod 600 the copy.
# All sections are optional. Keep unused sections entirely blank.
[environment]
type = "" # a13n.e2b
api_key = ""
template = "" # Optional; defaults to base when enabled.

[connector]
provider = "" # composio or openconnector
api_key = ""
# Optional when enabled; defaults to ["github"].
# toolkits = ["github"]
# For openconnector, leave api_key/toolkits unset and supply both OOMOL keys:
# project_api_key = ""
# catalog_api_key = ""
# services = ["slack"]

[model]
provider = "" # openrouter or openai_compatible
api_key = ""
model = "" # Required for the configured case; ignored by the fixed OpenRouter matrix.
base_url = "" # Required only for openai_compatible; leave blank for openrouter.

[search]
provider = "" # exa
api_key = ""

[brave_search]
provider = "" # brave
api_key = "" # Brave API key with Web Search access.
