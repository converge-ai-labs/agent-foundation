# LOCAL DEVELOPMENT ONLY. Safe to commit: all identities and credentials below
# are public, fictional test values. NEVER put real secrets in this file.
# Real credentials must be injected separately; never write them back here.
# Paths are relative to this TOML file, independent of the invocation directory.

[service]
role = "all"
host = "127.0.0.1"
port = 8000
# Exported as deployment.environment.name; trace backends show Env: local.
# This is independent of the Run's execution Environment/provider.
deployment_environment_name = "local"

[worker]
concurrency = 8

# Publish one read-only local Provider for every Workspace in this OSS instance.
[environments.local_providers."a13n.direct-local"]

[database]
url = "postgresql+psycopg://a13n_service_dev:local-only-password@127.0.0.1:15432/a13n_service_dev"
pool_size = 60
max_overflow = 20

[redis]
backend = "redis"
url = "redis://127.0.0.1:16379/0"
# Run publication, seed polling, and background tasks share this pool.
max_connections = 256

[objects]
backend = "local"
local_root = "../../var/service/objects"

[filesystem]
root = "../../var/service/files"

[iam]
public_origin = "http://127.0.0.1:5173"
initial_admin_email = "admin@example.com"

[secrets]
# Public 32-byte TEST key. It provides no access to any real environment.
master_key_base64 = "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
encryption_key_id = "local-public-test-key"

[connectivity]
# The local profile permits private and proxy-routed destinations for development.
private_endpoint_cidrs = ["0.0.0.0/0", "::/0"]
public_origin = "http://127.0.0.1:5173"
authorization_callback_urls = ["http://127.0.0.1:5173/connections/callback"]
http_origins = ["http://127.0.0.1:5173", "http://127.0.0.1:18080"]
setup_correlation_secret = "local-public-test-correlation-key-not-a-real-secret"

[models]
# The local profile permits private and proxy-routed model endpoints for development.
private_endpoint_cidrs = ["0.0.0.0/0", "::/0"]

[memory]
# Only the operation deadline is process configuration. Memory is opt-in:
# 1. Manually enable dev/mem0/local.toml, then make mem0-up starts unmodified OSS.
#    Default make dev/setup does not require or start any memory backend.
# 2. Create a Memory Provider through the API with its endpoint and credential.
# 3. Set config.memory.provider_id on an Agent revision.
# See dev/mem0/README.md for a runnable walkthrough and real embedding setup.
# No memory backend or credential belongs in Service process configuration.
timeout_seconds = 30

[pricing]
auto_update = false

[observability]
tracing = true
# Local debugging captures input/output content in the local Langfuse volumes.
trace_content = "standard"

[observability.query]
# Default: local Langfuse for both OTLP export and Console trace queries.
# The adjacent port (3001) serves Langfuse media. Neither backend reads .env.
provider = "langfuse"
langfuse_base_url = "http://127.0.0.1:3000"
langfuse_public_key = "lf_pk_agent_foundation_local"
langfuse_secret_key = "lf_sk_agent_foundation_local"

# Alternative: Logfire for both OTLP export and Console trace queries.
# Copy this file to local.private.toml, then replace the four Langfuse entries
# above with the following entries in this same [observability.query] table:
# provider = "logfire"
# logfire_base_url = "https://logfire-us.pydantic.dev"
# logfire_history_from = "2026-09-14T00:00:00Z"
# logfire_read_token = "YOUR_LOGFIRE_READ_TOKEN"
#
# Use the project's region (EU: https://logfire-eu.pydantic.dev) and a
# timezone-aware history lower bound covering the traces you want to query.
# Real tokens belong only in private configuration or environment variables.
# Instead of logfire_read_token in the private file, you can export:
#   export A13N_SERVICE_OBSERVABILITY_QUERY_LOGFIRE_READ_TOKEN='YOUR_LOGFIRE_READ_TOKEN'
# OTLP export requires a write token for the same project:
#   export LOGFIRE_TOKEN='YOUR_LOGFIRE_WRITE_TOKEN'
#   make dev SERVICE_CONFIG=dev/service/local.private.toml
#
# Export defaults to the selected query provider and its regional base URL;
# no Logfire SDK is required. A13N_DEV_TRACE_BACKEND and LOGFIRE_BASE_URL
# explicitly override export selection and address, independently of queries.
# For export-only Logfire, select provider = "none" and export
# A13N_DEV_TRACE_BACKEND=logfire (and LOGFIRE_BASE_URL for a non-US project).
# Keep tracing = true above; trace_content = "standard" uploads input/output
# to Logfire. Choose trace_content = "none" to omit that content.
# Switching backends does not reset Service data or migrate existing traces.

[migration]
auto_migrate = false

[logging]
level = "INFO"
format = "pretty"
