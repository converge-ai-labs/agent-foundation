# Owned by dev.service. Ports come from the effective Service configuration.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: a13n_service_dev
      POSTGRES_USER: a13n_service_dev
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:${A13N_DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a13n_service_dev -d a13n_service_dev"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 3
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${A13N_DEV_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 3
    volumes:
      - redis:/data
volumes:
  postgres:
  redis:
