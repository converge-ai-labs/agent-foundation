name: Release a13n Harness UI

on:
  push:
    tags:
      - "release/a13n-harness-ui-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-a13n-harness-ui
  cancel-in-progress: false
  queue: max

jobs:
  build-python:
    name: Build Harness UI distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Prepare bundled browser assets
        run: make a13n-harness-ui-assets

      - name: Prepare release version and compatible dependencies
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/a13n-harness-ui-v}"
          python scripts/prepare-release-version.py a13n-harness-ui "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Harness UI distribution
        run: make a13n-harness-ui-release-build

      - name: Upload Harness UI distribution
        uses: actions/upload-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-python:
    name: Publish Harness UI distribution
    needs: build-python
    runs-on: ubuntu-latest
    environment: agent-ui-pypi
    steps:
      - name: Download Harness UI distribution
        uses: actions/download-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  publish-image:
    name: Publish Harness UI image
    needs: [build-python, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Download the published Harness UI distribution
        uses: actions/download-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: dist/release

      - name: Prepare release image context
        env:
          VERSION: ${{ needs.build-python.outputs.version }}
        run: |
          python scripts/prepare-release-version.py a13n-harness-ui "$VERSION"
          python scripts/prepare_harness_ui_image.py --release-dist dist/release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        env:
          IMAGE: ghcr.io/converge-ai-labs/a13n-harness-ui
          VERSION: ${{ needs.build-python.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            if [[ "$VERSION" != *-rc.* ]]; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: dist/a13n-harness-ui-image
          file: deploy/containers/a13n-harness-ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ needs.build-python.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-a13n-harness-ui
          cache-to: type=gha,mode=max,scope=release-a13n-harness-ui

  create-release:
    name: Create GitHub Release
    needs: [build-python, publish-python, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Harness UI distribution
        uses: actions/download-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py a13n-harness-ui "$VERSION"
          "a13n Harness UI $VERSION" dist/*
