name: Release a13n Harness UI

on:
  push:
    tags:
      - "release/a13n-harness-ui-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-a13n-harness-ui
  cancel-in-progress: false
  queue: max

jobs:
  build-python:
    name: Build Harness UI distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Prepare bundled browser assets
        run: make a13n-harness-ui-assets

      - name: Prepare release version and compatible dependencies
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/a13n-harness-ui-v}"
          python scripts/prepare-release-version.py a13n-harness-ui "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify Harness UI distribution
        run: make a13n-harness-ui-release-build

      - name: Verify Harness UI artifacts use the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/check-release-version.py a13n-harness-ui "$VERSION"
          python_version="${VERSION/-rc./rc}"
          test -f "dist/a13n_harness_ui-${python_version}-py3-none-any.whl"
          test -f "dist/a13n_harness_ui-${python_version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" -eq 2

      - name: Upload Harness UI distribution
        uses: actions/upload-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Verify ${{ matrix.dependencies }} compatible dependencies
    needs: build-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, latest]
    steps:
      - name: Checkout release policy
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Harness UI distribution
        uses: actions/download-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Resolve declared dependency minimums
        if: matrix.dependencies == 'minimum'
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release_version import ENVIRONMENT_PROVIDER_MANIFEST, HARNESS_UI_MANIFEST, release_dependency_ranges
          constraints = {}
          for manifest in (ENVIRONMENT_PROVIDER_MANIFEST, HARNESS_UI_MANIFEST):
              constraints.update(release_dependency_ranges(Path.cwd(), manifest))
          Path("minimum-constraints.txt").write_text("".join(
              f"{package}=={constraint.split(',')[0][2:]}\n"
              for package, constraint in constraints.items()
          ))
          PY

      - name: Verify installed application and matching native runtime
        env:
          VERSION: ${{ needs.build-python.outputs.version }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          python_version="${VERSION/-rc./rc}"
          environment="${RUNNER_TEMP}/a13n-harness-ui-release-smoke"
          uv venv --python 3.13 "$environment"
          constraints=()
          if [[ "$DEPENDENCIES" == minimum ]]; then
            constraints=(--constraint minimum-constraints.txt)
          fi
          uv pip install \
            --python "$environment/bin/python" \
            --no-cache --resolution highest \
            --index-url https://pypi.org/simple \
            "${constraints[@]}" \
            "dist/a13n_harness_ui-${python_version}-py3-none-any.whl"
          uv pip check --python "$environment/bin/python"
          uv pip freeze --python "$environment/bin/python"
          "$environment/bin/a13n-harness-ui" --help
          "$environment/bin/a13n-harness-ui" webui --help
          mkdir -p "$RUNNER_TEMP/smoke-config"
          printf '{}\n' > "$RUNNER_TEMP/smoke-config/a13n-harness-ui.yaml"
          "$environment/bin/a13n-harness-ui" --config "$RUNNER_TEMP/smoke-config/a13n-harness-ui.yaml" config validate
          "$environment/bin/python" - <<'PY'
          import tempfile
          from pathlib import Path
          import anyio
          from a13n_harness_ui.managed_runtime import ManagedEnvdRuntime
          from a13n_harness_ui.settings import EnvdRuntimeSettings
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              runtime = ManagedEnvdRuntime(
                  cache_root=root / "cache", staging_root=root / "staging", settings=EnvdRuntimeSettings()
              )
              print(anyio.run(runtime.resolve))
          PY

  publish-python:
    name: Publish Harness UI distribution
    needs: [build-python, compatibility]
    runs-on: ubuntu-latest
    environment: agent-ui-pypi
    steps:
      - name: Download Harness UI distribution
        uses: actions/download-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  create-release:
    name: Create GitHub Release
    needs: [build-python, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Harness UI distribution
        uses: actions/download-artifact@v4
        with:
          name: a13n-harness-ui-python-dist
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py a13n-harness-ui "$VERSION"
          "a13n Harness UI $VERSION" dist/*
