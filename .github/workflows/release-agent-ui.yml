name: Release Agent UI

on:
  push:
    tags:
      - "release/agent-ui-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-agent-ui
  cancel-in-progress: false
  queue: max

jobs:
  build-python:
    name: Build Agent UI distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/harness-ui/package-lock.json

      - name: Prepare bundled browser assets
        run: make agent-ui-assets

      - name: Prepare release version and library pins
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/agent-ui-v}"
          python scripts/prepare-release-version.py agent-ui "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify Agent UI distribution
        run: make agent-ui-release-build

      - name: Verify Agent UI artifacts use the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/check-release-version.py agent-ui "$VERSION"
          python_version="${VERSION/-rc./rc}"
          test -f "dist/a13n_ui-${python_version}-py3-none-any.whl"
          test -f "dist/a13n_ui-${python_version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" -eq 2

      - name: Verify selected Harness release from PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python_version="${VERSION/-rc./rc}"
          environment="${RUNNER_TEMP}/agent-ui-release-smoke"
          uv venv --python 3.13 "$environment"
          uv pip install \
            --python "$environment/bin/python" \
            --no-cache \
            --index-url https://pypi.org/simple \
            "dist/a13n_ui-${python_version}-py3-none-any.whl"
          "$environment/bin/a13n-ui" --help

      - name: Upload Agent UI distribution
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-python:
    name: Publish Agent UI distribution
    needs: build-python
    runs-on: ubuntu-latest
    environment: agent-ui-pypi
    steps:
      - name: Download Agent UI distribution
        uses: actions/download-artifact@v4
        with:
          name: agent-ui-python-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  create-release:
    name: Create GitHub Release
    needs: [build-python, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Agent UI distribution
        uses: actions/download-artifact@v4
        with:
          name: agent-ui-python-dist
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py agent-ui "$VERSION"
          "Agent Foundation UI $VERSION" dist/*
