name: Service E2E CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &integration_inputs
      - ".github/workflows/ci-a13n-service-e2e.yml"
      - ".github/actions/load-ci-sandbox/**"
      - ".github/scripts/ci-sandbox-image.sh"
      - ".github/workflows/images.yml"
      - ".github/workflows/sandbox-binary.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/fixtures/**"
      - "e2e/**"
      - "deploy/docker/images/sandbox/**"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/a13n-envd/**"
      - "LICENSE"
      - "scripts/tests/test_service_e2e_tooling.py"
      - "packages/a13n-service/pyproject.toml"
      - "packages/a13n-service/*.py"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-harness/*.py"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-envd-client/*.py"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-stream-protocol/pyproject.toml"
      - "packages/a13n-stream-protocol/*.py"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-logging/pyproject.toml"
      - "packages/a13n-logging/*.py"
      - "packages/a13n-logging/a13n_logging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-deploy.yml"
      - "deploy/kubernetes/**"
      - "deploy/docker/images/a13n-service/**"
      - "scripts/deploy_smoke.py"
      - "scripts/k8s_local.py"
      - "dev/service/**"
  push:
    branches: [main]
    paths: *integration_inputs
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      service: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.service == 'true' }}
      deploy: ${{ github.event_name != 'pull_request' || steps.paths.outputs.deploy == 'true' }}
      image: ${{ steps.sandbox.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: paths
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            service:
              - ".github/workflows/ci-a13n-service-e2e.yml"
              - ".github/actions/load-ci-sandbox/**"
              - ".github/scripts/ci-sandbox-image.sh"
              - ".github/workflows/images.yml"
              - ".github/workflows/sandbox-binary.yml"
              - "Makefile"
              - "conftest.py"
              - "dev/fixtures/**"
              - "e2e/**"
              - "deploy/docker/images/sandbox/**"
              - ".dockerignore"
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/a13n-envd/**"
              - "LICENSE"
              - "scripts/tests/test_service_e2e_tooling.py"
              - "packages/a13n-service/pyproject.toml"
              - "packages/a13n-service/*.py"
              - "packages/a13n-service/a13n_service/**"
              - "packages/a13n-harness/pyproject.toml"
              - "packages/a13n-harness/*.py"
              - "packages/a13n-harness/a13n_harness/**"
              - "packages/a13n-envd-client/pyproject.toml"
              - "packages/a13n-envd-client/*.py"
              - "packages/a13n-envd-client/a13n_envd_client/**"
              - "packages/a13n-stream-protocol/pyproject.toml"
              - "packages/a13n-stream-protocol/*.py"
              - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
              - "packages/a13n-logging/pyproject.toml"
              - "packages/a13n-logging/*.py"
              - "packages/a13n-logging/a13n_logging/**"
              - "pyproject.toml"
              - "uv.lock"
            deploy:
              - ".github/workflows/ci-a13n-service-e2e.yml"
              - ".github/actions/load-ci-sandbox/**"
              - ".github/scripts/ci-sandbox-image.sh"
              - ".github/workflows/images.yml"
              - ".github/workflows/ci-deploy.yml"
              - ".github/workflows/sandbox-binary.yml"
              - "deploy/kubernetes/**"
              - "deploy/docker/images/a13n-service/**"
              - "deploy/docker/images/sandbox/**"
              - "scripts/deploy_smoke.py"
              - "scripts/k8s_local.py"
              - "e2e/service/test_environments.py"
              - "e2e/service/*kubernetes*"
              - "e2e/service/conftest.py"
              - "e2e/service/stack.py"
              - "dev/fixtures/**"
              - "scripts/tests/test_service_e2e_tooling.py"
              - "packages/a13n-service/a13n_service/providers/environment/kubernetes.py"
              - "packages/a13n-service/a13n_service/cli.py"
              - "packages/a13n-service/a13n_service/app.py"
              - "packages/a13n-service/a13n_service/migrations/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/a13n-envd/**"
              - ".dockerignore"
              - "Makefile"
              - "LICENSE"
      - name: Resolve a source-matched development sandbox
        id: sandbox
        if: github.event_name != 'pull_request' || steps.paths.outputs.service == 'true' || steps.paths.outputs.deploy == 'true'
        run: bash .github/scripts/ci-sandbox-image.sh

  support:
    name: Service E2E support
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate fixtures and reviewed selections
        run: make service-e2e-check

  sandbox-binary:
    needs: changes
    if: needs.changes.outputs.image == '' && (needs.changes.outputs.service == 'true' || needs.changes.outputs.deploy == 'true')
    uses: ./.github/workflows/sandbox-binary.yml
    with:
      arch: amd64
      runner: ubuntu-24.04

  scenarios:
    name: Service E2E scenarios (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: memory
            selection: test_memory
          - name: recovery
            selection: test_recovery
          - name: other
            selection: not (test_memory or test_recovery or docker)
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Rust for the native reverse-link journey
        if: matrix.name == 'other'
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Cache native reverse-link build
        if: matrix.name == 'other'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: service-e2e-envd
      - name: Build the checkout daemon for the slow reverse-link journey
        if: matrix.name == 'other'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --package a13n-envd --no-default-features
      - name: Run every journey but the opt-in hosted ones; an unavailable dependency fails it
        env:
          A13N_ENVD_TEST_BINARY: ${{ github.workspace }}/target/debug/a13n-envd
          SELECTION: ${{ matrix.selection }}
        run: make service-e2e SERVICE_E2E_ARGS="--require-all -k '$SELECTION' --junitxml=test-results/service-e2e.xml"
      - name: Report collected, executed and skipped journeys
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          cases = ET.parse("test-results/service-e2e.xml").getroot().findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          failed = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          print(f"Service E2E: {len(cases)} collected, {len(cases) - len(skipped)} executed, "
                f"{len(skipped)} skipped, {len(failed)} failed")
          assert cases and not skipped and not failed, "Every selected Service E2E scenario must pass without skipping"
          PYCODE
      - name: Retain Service E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-e2e-${{ matrix.name }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  sandbox-image:
    name: Build missing checkout sandbox
    needs: sandbox-binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: sandbox-binary-amd64-default
          path: tmp/sandbox-binaries/amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/images/sandbox/Dockerfile
          tags: a13n-sandbox:ci
          build-args: |
            ENVD_BINARY_SOURCE=prebuilt
            ENVD_VARIANT=default
          outputs: type=docker,dest=${{ runner.temp }}/sandbox.tar
          pull: true
          cache-from: type=gha,scope=service-e2e-sandbox
          cache-to: type=gha,scope=service-e2e-sandbox,mode=max,ignore-error=true
      - run: zstd -T0 -1 "$RUNNER_TEMP/sandbox.tar" -o "$RUNNER_TEMP/sandbox.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-sandbox-image
          path: ${{ runner.temp }}/sandbox.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  deployment:
    needs: [changes, sandbox-image]
    if: >-
      !cancelled() && needs.changes.outputs.deploy == 'true' &&
      (needs.changes.outputs.image != '' || needs.sandbox-image.result == 'success')
    uses: ./.github/workflows/ci-deploy.yml
    with:
      image: ${{ needs.changes.outputs.image }}

  docker:
    name: Service E2E Docker
    needs: [changes, sandbox-image]
    if: >-
      !cancelled() && needs.changes.outputs.service == 'true' &&
      (needs.changes.outputs.image != '' || needs.sandbox-image.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: ./.github/actions/load-ci-sandbox
        with:
          image: ${{ needs.changes.outputs.image }}
          tag: a13n-sandbox:local
      - name: Run Docker provider journeys without skips
        run: make service-e2e SERVICE_E2E_ARGS="--require-all -k docker --junitxml=test-results/service-e2e.xml"
      - name: Retain Docker journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-e2e-docker-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  e2e:
    name: Service E2E
    needs: [changes, support, scenarios, docker]
    if: >-
      always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result == 'failure' || needs.changes.outputs.service == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Require support checks and scenarios
        env:
          SUPPORT_RESULT: ${{ needs.support.result }}
          SCENARIOS_RESULT: ${{ needs.scenarios.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$SUPPORT_RESULT" = success
          test "$SCENARIOS_RESULT" = success
          test "$DOCKER_RESULT" = success
