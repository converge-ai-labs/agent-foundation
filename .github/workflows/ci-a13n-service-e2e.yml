name: Service E2E CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-service-e2e.yml"
      - ".github/workflows/sandbox-binary.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/fixtures/**"
      - "e2e/**"
      - "deploy/docker/images/sandbox/**"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/a13n-envd/**"
      - "LICENSE"
      - "scripts/tests/test_service_e2e_tooling.py"
      - "packages/a13n-service/pyproject.toml"
      - "packages/a13n-service/*.py"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-harness/*.py"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-envd-client/*.py"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-stream-protocol/pyproject.toml"
      - "packages/a13n-stream-protocol/*.py"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-logging/pyproject.toml"
      - "packages/a13n-logging/*.py"
      - "packages/a13n-logging/a13n_logging/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-service-e2e.yml"
      - ".github/workflows/sandbox-binary.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/fixtures/**"
      - "e2e/**"
      - "deploy/docker/images/sandbox/**"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/a13n-envd/**"
      - "LICENSE"
      - "scripts/tests/test_service_e2e_tooling.py"
      - "packages/a13n-service/pyproject.toml"
      - "packages/a13n-service/*.py"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-harness/*.py"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-envd-client/*.py"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-stream-protocol/pyproject.toml"
      - "packages/a13n-stream-protocol/*.py"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-logging/pyproject.toml"
      - "packages/a13n-logging/*.py"
      - "packages/a13n-logging/a13n_logging/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  support:
    name: Service E2E support
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate fixtures and reviewed selections
        run: make service-e2e-check

  sandbox-binary:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/sandbox-binary.yml
    with:
      arch: amd64
      runner: ubuntu-24.04

  scenarios:
    name: Service E2E scenarios (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: memory
            selection: test_memory
          - name: recovery
            selection: test_recovery
          - name: other
            selection: not (test_memory or test_recovery or docker)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run every journey but the opt-in hosted ones; an unavailable dependency fails it
        env:
          SELECTION: ${{ matrix.selection }}
        run: make service-e2e SERVICE_E2E_ARGS="--require-all -k '$SELECTION' --junitxml=test-results/service-e2e.xml"
      - name: Report collected, executed and skipped journeys
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          cases = ET.parse("test-results/service-e2e.xml").getroot().findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          failed = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          print(f"Service E2E: {len(cases)} collected, {len(cases) - len(skipped)} executed, "
                f"{len(skipped)} skipped, {len(failed)} failed")
          assert cases and not skipped and not failed, "Every selected Service E2E scenario must pass without skipping"
          PYCODE
      - name: Retain Service E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-e2e-${{ matrix.name }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  docker:
    name: Service E2E Docker
    needs: sandbox-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@v5
        with:
          name: sandbox-binary-amd64
          path: tmp/sandbox-binaries/amd64
      - uses: docker/setup-buildx-action@v3
      - name: Build the native Docker execution image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/images/sandbox/Dockerfile
          tags: a13n-sandbox:local
          build-args: ENVD_BINARY_SOURCE=prebuilt
          load: true
          pull: true
          cache-from: type=gha,scope=service-e2e-sandbox
          cache-to: type=gha,scope=service-e2e-sandbox,mode=max,ignore-error=true
      - name: Run Docker provider journeys without skips
        run: make service-e2e SERVICE_E2E_ARGS="--require-all -k docker --junitxml=test-results/service-e2e.xml"
      - name: Retain Docker journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-e2e-docker-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  e2e:
    name: Service E2E
    needs: [support, scenarios, docker]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Require support checks and scenarios
        env:
          SUPPORT_RESULT: ${{ needs.support.result }}
          SCENARIOS_RESULT: ${{ needs.scenarios.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$SUPPORT_RESULT" = success
          test "$SCENARIOS_RESULT" = success
          test "$DOCKER_RESULT" = success
