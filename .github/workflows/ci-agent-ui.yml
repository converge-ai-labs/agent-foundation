name: Agent UI CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-agent-ui.yml"
      - ".github/workflows/release-agent-ui.yml"
      - ".gitignore"
      - "packages/agent-environment-provider/**"
      - "packages/agent-harness/**"
      - "packages/agent-stream-protocol/**"
      - "packages/agent-ui/**"
      - "pyproject.toml"
      - "scripts/check-agent-ui-distribution.py"
      - "scripts/check_agent_ui_distribution.py"
      - "scripts/release_version.py"
      - "scripts/tests/test_check_agent_ui_distribution.py"
      - "scripts/tests/test_prepare_release_version.py"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-agent-ui.yml"
      - ".github/workflows/release-agent-ui.yml"
      - ".gitignore"
      - "packages/agent-environment-provider/**"
      - "packages/agent-harness/**"
      - "packages/agent-stream-protocol/**"
      - "packages/agent-ui/**"
      - "pyproject.toml"
      - "scripts/check-agent-ui-distribution.py"
      - "scripts/check_agent_ui_distribution.py"
      - "scripts/release_version.py"
      - "scripts/tests/test_check_agent_ui_distribution.py"
      - "scripts/tests/test_prepare_release_version.py"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Agent UI (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Agent UI test environment
        run: uv sync --locked --package a13n-ui --group test --no-default-groups

      - name: Type-check Agent UI
        if: matrix.name == 'Linux'
        run: >-
          uv run --locked pyright
          packages/agent-ui/a13n_ui
          scripts/check-agent-ui-distribution.py
          scripts/check_agent_ui_distribution.py
          scripts/release_version.py

      - name: Test Agent UI
        if: matrix.name == 'Linux'
        run: >-
          uv run --locked python -m pytest
          packages/agent-ui/tests
          scripts/tests/test_check_agent_ui_distribution.py
          scripts/tests/test_prepare_release_version.py

      - name: Test Agent UI on Windows and macOS
        if: matrix.name != 'Linux'
        run: uv run --locked python -m pytest packages/agent-ui/tests

      - name: Build Agent UI distribution
        if: matrix.name == 'Linux'
        run: uv build --package a13n-ui --out-dir dist/agent-ui

      - name: Verify CLI package and sdist wheel rebuild
        if: matrix.name == 'Linux'
        run: >-
          uv run --locked python scripts/check-agent-ui-distribution.py
          dist/agent-ui --rebuild-wheel
