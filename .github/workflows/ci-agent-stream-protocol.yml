name: Agent Stream Protocol CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-agent-stream-protocol.yml"
      - ".github/workflows/release-harness.yml"
      - "packages/agent-envd-client/**"
      - "packages/agent-environment-provider/**"
      - "packages/agent-harness/**"
      - "packages/agent-stream-protocol/**"
      - "pyproject.toml"
      - "scripts/check-agent-distributions.py"
      - "scripts/tests/test_check_agent_distributions.py"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-agent-stream-protocol.yml"
      - ".github/workflows/release-harness.yml"
      - "packages/agent-envd-client/**"
      - "packages/agent-environment-provider/**"
      - "packages/agent-harness/**"
      - "packages/agent-stream-protocol/**"
      - "pyproject.toml"
      - "scripts/check-agent-distributions.py"
      - "scripts/tests/test_check_agent_distributions.py"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Agent Stream Protocol
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check Agent Stream Protocol
        run: >-
          uv run --locked pyright
          packages/agent-stream-protocol/converge_agent_stream_protocol
          scripts/check-agent-distributions.py

      - name: Test Agent Stream Protocol
        run: >-
          uv run --locked python -m pytest
          packages/agent-stream-protocol/tests
          scripts/tests/test_check_agent_distributions.py

      - name: Build Harness libraries and local distribution dependencies
        run: |
          uv build --package converge-agent-envd-client --out-dir dist/harness
          uv build --package converge-agent-environment-provider --out-dir dist/harness
          uv build --package converge-agent-harness --out-dir dist/harness
          uv build --package converge-agent-stream-protocol --out-dir dist/harness

      - name: Verify isolated development distributions
        run: >-
          uv run --locked python scripts/check-agent-distributions.py
          dist/harness --require-local-dependencies
