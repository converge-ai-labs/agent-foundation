name: Release a13n Logging

on:
  push:
    tags:
      - "release/a13n-logging-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-a13n-logging
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build logging distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/a13n-logging-v}"
          python scripts/prepare-release-version.py a13n-logging "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build logging Python distributions
        run: make a13n-logging-python-build

      - name: Verify logging artifact scope
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/check-release-version.py a13n-logging "$VERSION"
          python_version="${VERSION/-rc./rc}"
          test -f "dist/a13n_logging-${python_version}-py3-none-any.whl"
          test -f "dist/a13n_logging-${python_version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" -eq 2

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: a13n-logging-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish logging to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: foundation-pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: a13n-logging-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Publish package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  create-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: a13n-logging-dist
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py a13n-logging "$VERSION"
          "a13n Logging $VERSION" dist/*
