name: a13n Stream Protocol CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-stream-protocol.yml"
      - ".github/workflows/release-a13n-harness.yml"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-environment/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-stream-protocol/**"
      - "pyproject.toml"
      - "scripts/check-a13n-distributions.py"
      - "scripts/tests/test_check_a13n_distributions.py"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-stream-protocol.yml"
      - ".github/workflows/release-a13n-harness.yml"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-environment/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-stream-protocol/**"
      - "pyproject.toml"
      - "scripts/check-a13n-distributions.py"
      - "scripts/tests/test_check_a13n_distributions.py"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: a13n Stream Protocol
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check a13n Stream Protocol
        run: >-
          uv run --locked pyright
          packages/a13n-stream-protocol/a13n_stream_protocol
          scripts/check-a13n-distributions.py

      - name: Test a13n Stream Protocol
        run: >-
          uv run --locked python -m pytest
          packages/a13n-stream-protocol/tests
          scripts/tests/test_check_a13n_distributions.py

      - name: Build Harness libraries and local distribution dependencies
        run: |
          uv build --package a13n-envd-client --out-dir dist/harness
          uv build --package a13n-environment --out-dir dist/harness
          uv build --package a13n-harness --out-dir dist/harness
          uv build --package a13n-stream-protocol --out-dir dist/harness

      - name: Verify isolated development distributions
        run: >-
          uv run --locked python scripts/check-a13n-distributions.py
          dist/harness --require-local-dependencies
