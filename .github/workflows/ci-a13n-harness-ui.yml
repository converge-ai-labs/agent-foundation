name: a13n Harness UI CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-harness-ui.yml"
      - ".github/workflows/release-a13n-harness-ui.yml"
      - ".gitignore"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "frontend/**"
      - "packages/a13n-environment/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-harness-ui/**"
      - "pyproject.toml"
      - "scripts/check-a13n-harness-ui-distribution.py"
      - "scripts/check_a13n_harness_ui_distribution.py"
      - "scripts/export-a13n-harness-ui-openapi.py"
      - "scripts/prepare-a13n-harness-ui-assets.py"
      - "scripts/prepare_a13n_harness_ui_assets.py"
      - "scripts/release_version.py"
      - "scripts/tests/test_check_a13n_harness_ui_distribution.py"
      - "scripts/tests/test_prepare_release_version.py"
      - "scripts/tests/test_prepare_a13n_harness_ui_assets.py"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-harness-ui.yml"
      - ".github/workflows/release-a13n-harness-ui.yml"
      - ".gitignore"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "frontend/**"
      - "packages/a13n-environment/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-harness-ui/**"
      - "pyproject.toml"
      - "scripts/check-a13n-harness-ui-distribution.py"
      - "scripts/check_a13n_harness_ui_distribution.py"
      - "scripts/export-a13n-harness-ui-openapi.py"
      - "scripts/prepare-a13n-harness-ui-assets.py"
      - "scripts/prepare_a13n_harness_ui_assets.py"
      - "scripts/release_version.py"
      - "scripts/tests/test_check_a13n_harness_ui_distribution.py"
      - "scripts/tests/test_prepare_release_version.py"
      - "scripts/tests/test_prepare_a13n_harness_ui_assets.py"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Harness UI (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm
        if: matrix.name == 'Linux'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        if: matrix.name == 'Linux'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install and check frontend workspace
        if: matrix.name == 'Linux'
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run check
          pnpm --dir frontend run build

      - name: Synchronize Harness UI test environment
        run: uv sync --locked --package a13n-harness-ui --group test --no-default-groups

      - name: Prepare bundled Harness UI WebUI assets
        if: matrix.name == 'Linux'
        run: uv run --locked python scripts/prepare-a13n-harness-ui-assets.py

      - name: Type-check Harness UI
        if: matrix.name == 'Linux'
        run: >-
          uv run --locked pyright
          packages/a13n-harness-ui/a13n_harness_ui
          scripts/check-a13n-harness-ui-distribution.py
          scripts/check_a13n_harness_ui_distribution.py
          scripts/prepare-a13n-harness-ui-assets.py
          scripts/prepare_a13n_harness_ui_assets.py
          scripts/release_version.py

      - name: Test Harness UI
        if: matrix.name == 'Linux'
        run: >-
          uv run --locked python -m pytest
          packages/a13n-harness-ui/tests
          scripts/tests/test_check_a13n_harness_ui_distribution.py
          scripts/tests/test_prepare_a13n_harness_ui_assets.py
          scripts/tests/test_prepare_release_version.py

      - name: Test Harness UI on Windows and macOS
        if: matrix.name != 'Linux'
        run: uv run --locked python -m pytest packages/a13n-harness-ui/tests

      - name: Test native command lifecycle
        run: >-
          uv run --locked python -m pytest
          packages/a13n-environment/tests/test_direct_local.py
          packages/a13n-environment/tests/test_direct_local_processes.py

      - name: Build Harness UI distribution
        if: matrix.name == 'Linux'
        run: uv build --package a13n-harness-ui --out-dir dist/a13n-harness-ui

      - name: Verify bundled assets and sdist wheel rebuild
        if: matrix.name == 'Linux'
        run: >-
          uv run --locked python scripts/check-a13n-harness-ui-distribution.py
          dist/a13n-harness-ui --rebuild-wheel
