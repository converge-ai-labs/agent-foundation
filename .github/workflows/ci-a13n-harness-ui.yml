name: UI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-harness-ui*.yml"
      - ".github/workflows/release-a13n-harness-ui.yml"
      - ".gitignore"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "frontend/**"
      - "proto/a13n-service/**"
      - "packages/*/pyproject.toml"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-logging/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-environment/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-harness-ui/**"
      - "docs/a13n-harness-ui/**"
      - "pyproject.toml"
      - "conftest.py"
      - "scripts/run_python_tests.py"
      - "scripts/tests/test_harness_ui_ci_workflow.py"
      - "scripts/check-a13n-harness-ui-distribution.py"
      - "scripts/check_a13n_harness_ui_distribution.py"
      - "scripts/export-a13n-harness-ui-openapi.py"
      - "scripts/prepare-a13n-harness-ui-assets.py"
      - "scripts/prepare_a13n_harness_ui_assets.py"
      - "scripts/release_version.py"
      - "scripts/tests/test_check_a13n_harness_ui_distribution.py"
      - "scripts/tests/test_prepare_release_version.py"
      - "scripts/tests/test_prepare_a13n_harness_ui_assets.py"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-harness-ui*.yml"
      - ".github/workflows/release-a13n-harness-ui.yml"
      - ".gitignore"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "frontend/**"
      - "proto/a13n-service/**"
      - "packages/*/pyproject.toml"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-logging/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-environment/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-harness-ui/**"
      - "docs/a13n-harness-ui/**"
      - "pyproject.toml"
      - "conftest.py"
      - "scripts/run_python_tests.py"
      - "scripts/tests/test_harness_ui_ci_workflow.py"
      - "scripts/check-a13n-harness-ui-distribution.py"
      - "scripts/check_a13n_harness_ui_distribution.py"
      - "scripts/export-a13n-harness-ui-openapi.py"
      - "scripts/prepare-a13n-harness-ui-assets.py"
      - "scripts/prepare_a13n_harness_ui_assets.py"
      - "scripts/release_version.py"
      - "scripts/tests/test_check_a13n_harness_ui_distribution.py"
      - "scripts/tests/test_prepare_release_version.py"
      - "scripts/tests/test_prepare_a13n_harness_ui_assets.py"
      - "uv.lock"
  # Full Windows coverage is a backstop, not a second sweep after every merge.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect UI changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      frontend: ${{ steps.filter.outputs.frontend }}
      distribution: ${{ steps.filter.outputs.distribution }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify UI inputs
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - '.github/workflows/ci-a13n-harness-ui*.yml'
              - '.github/workflows/release-a13n-harness-ui.yml'
              - '.gitignore'
              - '.pre-commit-config.yaml'
              - 'Makefile'
              - 'packages/*/pyproject.toml'
              - 'packages/a13n-envd-client/**'
              - 'packages/a13n-logging/**'
              - 'packages/a13n-harness/**'
              - 'packages/a13n-environment/**'
              - 'packages/a13n-stream-protocol/**'
              - 'packages/a13n-harness-ui/**'
              - 'docs/a13n-harness-ui/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'conftest.py'
              - 'scripts/run_python_tests.py'
              - 'scripts/tests/test_harness_ui_ci_workflow.py'
              - 'scripts/check-a13n-harness-ui-distribution.py'
              - 'scripts/check_a13n_harness_ui_distribution.py'
              - 'scripts/prepare-a13n-harness-ui-assets.py'
              - 'scripts/prepare_a13n_harness_ui_assets.py'
              - 'scripts/release_version.py'
            frontend:
              - '.github/workflows/ci-a13n-harness-ui*.yml'
              - '.github/workflows/release-a13n-harness-ui.yml'
              - '.gitignore'
              - '.pre-commit-config.yaml'
              - 'Makefile'
              - 'frontend/*'
              - 'frontend/apps/a13n-console/**'
              - 'frontend/packages/**'
              - 'proto/a13n-service/**'
              - 'scripts/tests/test_harness_ui_ci_workflow.py'
            distribution:
              - '.github/workflows/ci-a13n-harness-ui*.yml'
              - '.github/workflows/release-a13n-harness-ui.yml'
              - '.gitignore'
              - '.pre-commit-config.yaml'
              - 'Makefile'
              - 'frontend/*'
              - 'frontend/apps/a13n-harness-ui/**'
              - 'frontend/packages/**'
              # Package-root metadata/build hooks and runtime sources, not tests.
              - 'packages/*/pyproject.toml'
              - 'packages/a13n-envd-client/*'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'packages/a13n-logging/*'
              - 'packages/a13n-logging/a13n_logging/**'
              - 'packages/a13n-environment/*'
              - 'packages/a13n-environment/a13n_environment/**'
              - 'packages/a13n-harness/*'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/*'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-harness-ui/*'
              - 'packages/a13n-harness-ui/a13n_harness_ui/**'
              - 'docs/a13n-harness-ui/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'conftest.py'
              - 'scripts/run_python_tests.py'
              - 'scripts/tests/test_harness_ui_ci_workflow.py'
              - 'scripts/check-a13n-harness-ui-distribution.py'
              - 'scripts/check_a13n_harness_ui_distribution.py'
              - 'scripts/export-a13n-harness-ui-openapi.py'
              - 'scripts/prepare-a13n-harness-ui-assets.py'
              - 'scripts/prepare_a13n_harness_ui_assets.py'
              - 'scripts/release_version.py'
              - 'scripts/tests/test_check_a13n_harness_ui_distribution.py'
              - 'scripts/tests/test_prepare_release_version.py'
              - 'scripts/tests/test_prepare_a13n_harness_ui_assets.py'

  tests:
    name: UI Python tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize UI test environment
        run: uv sync --locked --package a13n-harness-ui --group test --no-default-groups

      # Cached editable wheels do not rerun the package build hook.
      - name: Prepare bundled configuration Skill
        run: uv run --locked --no-sync python packages/a13n-harness-ui/build_skills.py

      - name: Type-check UI
        run: >-
          uv run --locked --no-sync pyright
          packages/a13n-harness-ui/a13n_harness_ui
          packages/a13n-harness-ui/build_skills.py
          scripts/check-a13n-harness-ui-distribution.py
          scripts/check_a13n_harness_ui_distribution.py
          scripts/prepare-a13n-harness-ui-assets.py
          scripts/prepare_a13n_harness_ui_assets.py
          scripts/release_version.py

      # Bound individual tests separately from the full-suite budget on standard runners.
      - name: Test UI
        timeout-minutes: 8
        env:
          PYTEST_ADDOPTS: -v --durations=20 -o faulthandler_timeout=45 --timeout=60 --timeout-method=thread --max-worker-restart=0 --junitxml=test-results/ui.xml -r a
        run: >-
          /usr/bin/time -p uv run --locked --no-sync python -m scripts.run_python_tests --workers 3
          packages/a13n-harness-ui/tests

      - name: Test native command lifecycle
        timeout-minutes: 2
        run: >-
          uv run --locked --no-sync python -m pytest --junitxml=test-results/native-lifecycle.xml
          packages/a13n-environment/tests/test_direct_local.py
          packages/a13n-environment/tests/test_direct_local_processes.py

      - name: Retain UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-python-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  frontend:
    name: Console and shared frontend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend workspace
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check frontend workspace
        run: |
          pnpm --dir frontend run format:check
          pnpm --dir frontend --filter a13n-console run generate:check
          pnpm --dir frontend --filter '!a13n-harness-ui-webui' --filter '!a13n-docs' --filter '!a13n-site' -r run check

      - name: Test Console and shared frontend
        run: >-
          pnpm --dir frontend --filter '!a13n-harness-ui-webui' --filter '!a13n-docs' --filter '!a13n-site' -r run test
          --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Retain frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-shared-${{ github.run_attempt }}
          path: frontend/**/test-results/*.xml
          retention-days: 7

      - name: Build frontend workspace
        run: pnpm --dir frontend --filter '!a13n-harness-ui-webui' --filter '!a13n-docs' --filter '!a13n-site' -r run build

  distribution:
    name: UI distribution
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Synchronize UI test environment
        run: uv sync --locked --package a13n-harness-ui --group test --no-default-groups

      # Cached editable wheels do not rerun the package build hook.
      - name: Prepare bundled configuration Skill
        run: uv run --locked --no-sync python packages/a13n-harness-ui/build_skills.py

      - name: Install WebUI dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check WebUI
        run: |
          pnpm --dir frontend exec prettier --check apps/a13n-harness-ui
          pnpm --dir frontend --filter a13n-harness-ui-webui run check

      - name: Test WebUI
        timeout-minutes: 6
        run: >-
          /usr/bin/time -p pnpm --dir frontend --filter a13n-harness-ui-webui run test --maxWorkers=2
          --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Retain WebUI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-${{ github.run_attempt }}
          path: frontend/apps/a13n-harness-ui/test-results/*.xml
          retention-days: 7

      - name: Build WebUI assets
        run: pnpm --dir frontend --filter a13n-harness-ui-webui run build

      - name: Prepare bundled WebUI assets
        run: uv run --locked --no-sync python scripts/prepare-a13n-harness-ui-assets.py

      - name: Test distribution tooling
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/distribution.xml --durations=20 -r a
        run: >-
          uv run --locked --no-sync python -m scripts.run_python_tests --workers 2
          scripts/tests/test_check_a13n_harness_ui_distribution.py
          scripts/tests/test_prepare_a13n_harness_ui_assets.py
          scripts/tests/test_prepare_release_version.py
          scripts/tests/test_harness_ui_ci_workflow.py

      - name: Build UI distribution
        run: uv build --package a13n-harness-ui --out-dir dist/a13n-harness-ui

      - name: Verify bundled assets and sdist wheel rebuild
        run: >-
          uv run --locked --no-sync python scripts/check-a13n-harness-ui-distribution.py
          dist/a13n-harness-ui --rebuild-wheel

      - name: Retain distribution test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-distribution-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  linux:
    name: UI (Linux)
    needs: [changes, tests, frontend, distribution]
    if: >-
      always() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Require all Linux checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          TESTS_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.tests == 'true' }}
          FRONTEND_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
          DISTRIBUTION_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.distribution == 'true' }}
        run: |
          test "$CHANGES_RESULT" = success
          for component in TESTS FRONTEND DISTRIBUTION; do
            selected="${component}_SELECTED"
            result="${component}_RESULT"
            expected=skipped
            if [[ "${!selected}" == true ]]; then
              expected=success
            fi
            test "${!result}" = "$expected" || exit 1
          done

  windows:
    name: UI (Windows)
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.tests == 'true')
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      PYTEST_ADDOPTS: -v -o faulthandler_timeout=90 --timeout=120 --timeout-method=thread
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize UI test environment
        run: uv sync --locked --package a13n-harness-ui --group test --no-default-groups

      # Cached editable wheels do not rerun the package build hook.
      - name: Prepare bundled configuration Skill
        run: uv run --locked --no-sync python packages/a13n-harness-ui/build_skills.py

      - name: Test Windows native UI integration
        timeout-minutes: 5
        if: github.event_name == 'pull_request'
        # Keep real subprocess, filesystem, shell, and input-backend coverage.
        # Mocked platform-policy tests still run in the full Linux suite.
        run: >-
          uv run --locked --no-sync python -m pytest --durations=20 --junitxml=test-results/ui-native.xml
          packages/a13n-harness-ui/tests/test_entrypoint.py
          packages/a13n-harness-ui/tests/test_thread_files.py
          packages/a13n-harness-ui/tests/test_host_files.py
          packages/a13n-harness-ui/tests/test_host_git.py
          packages/a13n-harness-ui/tests/test_configuration_mutation.py
          packages/a13n-harness-ui/tests/test_composition.py::test_full_control_shell_inherits_host_path_and_custom_variables
          packages/a13n-harness-ui/tests/test_projectless_threads.py::test_scratch_cwd_and_selected_configuration_file_mount
          packages/a13n-harness-ui/tests/test_cli_interactions.py::test_inline_decision_keys_preserve_preexisting_draft
          packages/a13n-harness-ui/tests/test_configuration.py::test_loads_multi_file_resources_and_canonical_markdown_set
          packages/a13n-harness-ui/tests/test_configuration.py::test_rejects_symlinked_canonical_directory

      - name: Test full UI suite on Windows
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run --locked --no-sync python -m pytest --durations=20 --junitxml=test-results/ui-full.xml packages/a13n-harness-ui/tests

      - name: Test native command lifecycle
        timeout-minutes: 2
        run: >-
          uv run --locked --no-sync python -m pytest --durations=20 --junitxml=test-results/native-lifecycle.xml
          packages/a13n-environment/tests/test_direct_local.py
          packages/a13n-environment/tests/test_direct_local_processes.py

      - name: Retain Windows test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-windows-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
