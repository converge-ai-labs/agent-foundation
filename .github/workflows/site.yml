name: Site

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "frontend/*"
      - "frontend/apps/a13n-docs/**"
      - "frontend/apps/a13n-site/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/apps/a13n-harness-ui/src/openapi.json"
      - "proto/a13n-service/openapi.json"
      - "scripts/docs/service-settings.schema.json"
      - "Makefile"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "frontend/*"
      - "frontend/apps/a13n-docs/**"
      - "frontend/apps/a13n-site/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/apps/a13n-harness-ui/src/openapi.json"
      - "proto/a13n-service/openapi.json"
      - "scripts/docs/service-settings.schema.json"
      - "Makefile"
      - ".github/workflows/site.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build site
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend workspace
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check docs
        run: pnpm --dir frontend --filter a13n-docs run check

      - name: Check landing page
        run: pnpm --dir frontend --filter a13n-site run check

      - name: Test landing page
        run: pnpm --dir frontend --filter a13n-site run test

      # The docs build tests localization and fails on broken internal links or anchors.
      - name: Build site
        run: make site-build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/apps/a13n-site/dist
          if-no-files-found: error

  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      deployments: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The environment predates the landing page; the Cloudflare secrets are scoped to it.
    environment:
      name: docs
      url: https://a13n.converge.ai/
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=a13n-site --branch=main
