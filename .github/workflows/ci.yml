name: Repository CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run repository lint checks
        run: make lint

      - name: Test CI routing and failure propagation
        run: >-
          uv run --locked python -m pytest
          scripts/tests/test_ci_inputs.py
          scripts/tests/test_envd_ci_workflow.py
          scripts/tests/test_harness_ui_ci_workflow.py
          scripts/tests/test_image_workflows.py
          --junitxml=test-results/workflows.xml

      - name: Retain workflow test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-tests-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
