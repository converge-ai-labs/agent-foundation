name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-sdks.yml"
      - ".github/workflows/release-a13n-go.yml"
      - ".github/workflows/release-a13n-python.yml"
      - ".github/workflows/release-a13n-rust.yml"
      - ".github/workflows/release-a13n-typescript.yml"
      - ".github/workflows/release-a13n-service-cli.yml"
      - ".pre-commit-config.yaml"
      - "Cargo.toml"
      - "pyproject.toml"
      - "sdk/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-sdks.yml"
      - ".github/workflows/release-a13n-go.yml"
      - ".github/workflows/release-a13n-python.yml"
      - ".github/workflows/release-a13n-rust.yml"
      - ".github/workflows/release-a13n-typescript.yml"
      - ".github/workflows/release-a13n-service-cli.yml"
      - ".pre-commit-config.yaml"
      - "Cargo.toml"
      - "pyproject.toml"
      - "sdk/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect SDK changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      a13n_service_cli: ${{ steps.filter.outputs.a13n_service_cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '.github/workflows/ci-sdks.yml'
              - '.github/workflows/release-a13n-go.yml'
              - 'sdk/go/**'
            python:
              - '.github/workflows/ci-sdks.yml'
              - '.github/workflows/release-a13n-python.yml'
              - 'pyproject.toml'
              - 'sdk/python/**'
            rust:
              - '.github/workflows/ci-sdks.yml'
              - '.github/workflows/release-a13n-rust.yml'
              - 'Cargo.toml'
              - 'sdk/rust/**'
              - '!sdk/rust/a13n-service-cli/**'
            typescript:
              - '.github/workflows/ci-sdks.yml'
              - '.github/workflows/release-a13n-typescript.yml'
              - 'sdk/typescript/**'
            a13n_service_cli:
              - '.github/workflows/ci-sdks.yml'
              - '.github/workflows/release-a13n-service-cli.yml'
              - '.pre-commit-config.yaml'
              - 'sdk/rust/Cargo.toml'
              - 'sdk/rust/Cargo.lock'
              - 'sdk/rust/src/**'
              - 'sdk/rust/a13n-service-cli/**'

  python:
    name: Python SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Run complete Python SDK checks
        run: make sdk-python-check-all

  go:
    name: Go SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Run complete Go SDK checks
        run: make sdk-go-check-all

  rust:
    name: Rust SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target
          shared-key: a13n

      - name: Run complete Rust SDK checks
        run: make sdk-rust-check-all

  a13n-service-cli:
    name: a13n Service CLI (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.a13n_service_cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust/a13n-service-cli -> target
          shared-key: a13n-service-cli-${{ matrix.os }}

      - name: Run complete a13n Service CLI checks
        if: runner.os == 'Linux'
        run: make a13n-service-cli-check-all

      - name: Run native Windows tests
        if: runner.os == 'Windows'
        run: cargo test --all-features --locked --manifest-path sdk/rust/a13n-service-cli/Cargo.toml

      - name: Build native Windows binary
        if: runner.os == 'Windows'
        run: cargo build --all-features --locked --manifest-path sdk/rust/a13n-service-cli/Cargo.toml

  typescript:
    name: TypeScript SDK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Run complete TypeScript SDK checks
        run: make sdk-typescript-check-all
