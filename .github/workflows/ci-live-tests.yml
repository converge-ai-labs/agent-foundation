name: Live Tests CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-live-tests.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/fixtures/**"
      - "dev/live_tests/**"
      - "deploy/containers/docker-environment/**"
      - "scripts/tests/test_live_test_tooling.py"
      - "packages/a13n-service/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-live-tests.yml"
      - "Makefile"
      - "conftest.py"
      - "dev/fixtures/**"
      - "dev/live_tests/**"
      - "deploy/containers/docker-environment/**"
      - "scripts/tests/test_live_test_tooling.py"
      - "packages/a13n-service/**"
      - "packages/a13n-harness/**"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  support:
    name: Live test support
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate fixtures and reviewed selections
        run: make live-test-check

  journeys:
    name: Service live journeys
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the native Docker execution image
        run: make image-docker-environment
      - name: Run every journey but the opt-in hosted ones; an unavailable dependency fails it
        run: make live-test LIVE_TEST_ARGS="--require-all --junitxml=test-results/live.xml"
      - name: Report collected, executed and skipped journeys
        if: always()
        run: |
          python - <<'PYCODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          cases = ET.parse("test-results/live.xml").getroot().findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          failed = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          print(f"Live journeys: {len(cases)} collected, {len(cases) - len(skipped)} executed, "
                f"{len(skipped)} skipped, {len(failed)} failed")
          assert cases and not skipped, "Every live journey must execute"
          PYCODE
      - name: Retain live journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-journeys-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
