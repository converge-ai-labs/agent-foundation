name: Release a13n for Go

on:
  push:
    tags:
      - "release/a13n/go/*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-a13n-go
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Prepare a13n for Go release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/a13n/go/}"
          python3 scripts/prepare-release-version.py a13n-go "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-tag:
    name: Publish Go module tag
    needs: validate
    runs-on: ubuntu-latest
    environment: sdk-go-github
    permissions:
      contents: write
    steps:
      - name: Create canonical Go module tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="sdk/go/v${VERSION}"
          existing=""
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA" || {
              echo "Tag $tag already points to $existing, expected $GITHUB_SHA" >&2
              exit 1
            }
            echo "Tag $tag already points to the release commit"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$GITHUB_SHA"

  create-release:
    name: Create GitHub Release
    needs: [validate, publish-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py a13n-go "$VERSION"
          "a13n SDK for Go $VERSION"
