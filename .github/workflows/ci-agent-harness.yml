name: Agent Harness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-agent-harness.yml"
      - ".github/workflows/release-harness.yml"
      - "packages/agent-environment-provider/**"
      - "packages/agent-harness/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-agent-harness.yml"
      - ".github/workflows/release-harness.yml"
      - "packages/agent-environment-provider/**"
      - "packages/agent-harness/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Agent Harness (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            test_targets: packages/agent-harness/tests
          - name: Windows
            runner: windows-2025
            test_targets: >-
              packages/agent-harness/tests/test_environment_local.py
              packages/agent-harness/tests/test_environment_processes.py
              packages/agent-harness/tests/test_monitored_process.py
          - name: macOS
            runner: macos-15
            test_targets: >-
              packages/agent-harness/tests/test_environment_local.py
              packages/agent-harness/tests/test_environment_processes.py
              packages/agent-harness/tests/test_monitored_process.py
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check Agent Harness
        if: matrix.name == 'Linux'
        run: uv run --locked pyright packages/agent-harness/a13n_harness

      - name: Test Agent Harness
        run: uv run --locked python -m pytest -vv ${{ matrix.test_targets }}

      - name: Build Agent Harness distribution
        if: matrix.name == 'Linux'
        run: uv build --package a13n-harness --out-dir dist/harness
