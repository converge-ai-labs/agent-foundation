name: Release a13n Service

on:
  push:
    tags:
      - "release/a13n-service-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  A13N_SERVICE_IMAGE: ghcr.io/converge-ai-labs/a13n-service

permissions:
  contents: read

concurrency:
  group: release-a13n-service
  cancel-in-progress: false
  queue: max

jobs:
  build-python:
    name: Build Python distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/a13n-service-v}"
          python scripts/prepare-release-version.py a13n-service "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build a13n Service Python distributions
        run: make a13n-service-python-build

      - name: Verify a13n Service artifact scope
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/check-release-version.py a13n-service "$VERSION"
          python_version="${VERSION/-rc./rc}"
          test -f "dist/a13n_service-${python_version}-py3-none-any.whl"
          test -f "dist/a13n_service-${python_version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" -eq 2

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: a13n-service-python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-python:
    name: Publish Python distributions
    needs: build-python
    runs-on: ubuntu-latest
    environment: foundation-pypi
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: a13n-service-python-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Publish packages to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  publish-image:
    name: Publish a13n-service image
    needs: [build-python, publish-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release version
        env:
          VERSION: ${{ needs.build-python.outputs.version }}
        run: python3 scripts/prepare-release-version.py a13n-service "$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        env:
          IMAGE: ${{ env.A13N_SERVICE_IMAGE }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            if [[ "$VERSION" != *-rc.* ]]; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/containers/a13n-service/Dockerfile
          # Release publishing is intentionally native amd64 only; other architectures build locally.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ needs.build-python.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-a13n-service
          cache-to: type=gha,mode=max,scope=release-a13n-service

      - name: Verify published image tags
        env:
          IMAGE: ${{ env.A13N_SERVICE_IMAGE }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: |
          version_digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}')"
          test -n "$version_digest"
          if [[ "$VERSION" != *-rc.* ]]; then
            latest_digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}')"
            test "$version_digest" = "$latest_digest"
          fi

  create-release:
    name: Create GitHub Release
    needs: [build-python, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: a13n-service-python-dist
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py a13n-service "$VERSION"
          "a13n Service $VERSION" dist/*
