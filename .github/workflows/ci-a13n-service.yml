name: a13n Service CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-service.yml"
      - ".github/workflows/release-a13n-service.yml"
      - "conftest.py"
      - "scripts/run_python_tests.py"
      - ".github/service-test-durations.json"
      - "dev/service/**"
      - "dev/fixtures/**"
      - "dev/observability/**"
      - "deploy/monitoring/**"
      - "packages/a13n-service/**"
      - "docs/a13n-service/**"
      - "frontend/apps/a13n-console/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/pnpm-lock.yaml"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "Makefile"
      - "proto/a13n-service/**"
      - "scripts/export-a13n-service-openapi.py"
      - "scripts/tests/test_service_contract.py"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-harness/*.py"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/pyproject.toml"
      - "packages/a13n-stream-protocol/*.py"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-envd-client/*.py"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-service.yml"
      - ".github/workflows/release-a13n-service.yml"
      - "conftest.py"
      - "scripts/run_python_tests.py"
      - ".github/service-test-durations.json"
      - "dev/service/**"
      - "dev/fixtures/**"
      - "dev/observability/**"
      - "deploy/monitoring/**"
      - "packages/a13n-service/**"
      - "docs/a13n-service/**"
      - "frontend/apps/a13n-console/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/pnpm-lock.yaml"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "Makefile"
      - "proto/a13n-service/**"
      - "scripts/export-a13n-service-openapi.py"
      - "scripts/tests/test_service_contract.py"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-harness/*.py"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/pyproject.toml"
      - "packages/a13n-stream-protocol/*.py"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-envd-client/*.py"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Service test inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bundled documentation and package README/license text retain the checks
      # job (wheel builds and documentation search) without database-backed tests.
      - name: Classify Service inputs
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - '.github/workflows/ci-a13n-service.yml'
              - '.github/workflows/release-a13n-service.yml'
              - 'conftest.py'
              - 'scripts/run_python_tests.py'
              - '.github/service-test-durations.json'
              - 'dev/service/**'
              - 'dev/fixtures/**'
              - 'dev/observability/**'
              - 'deploy/monitoring/**'
              - 'packages/a13n-service/pyproject.toml'
              - 'packages/a13n-service/*.py'
              - 'packages/a13n-service/.importlinter'
              - 'packages/a13n-service/a13n_service/**'
              - 'packages/a13n-service/tests/**'
              - 'packages/a13n-logging/pyproject.toml'
              - 'packages/a13n-logging/*.py'
              - 'packages/a13n-logging/a13n_logging/**'
              - 'packages/a13n-logging/tests/**'
              - 'pyproject.toml'
              - 'Makefile'
              - 'proto/a13n-service/**'
              - 'scripts/export-a13n-service-openapi.py'
              - 'scripts/tests/test_service_contract.py'
              - 'packages/a13n-harness/pyproject.toml'
              - 'packages/a13n-harness/*.py'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/pyproject.toml'
              - 'packages/a13n-stream-protocol/*.py'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-envd-client/pyproject.toml'
              - 'packages/a13n-envd-client/*.py'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'uv.lock'

      - name: Build validation matrix
        id: matrix
        env:
          TESTS_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tests == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.run_python_tests import balanced_shards

          # The locked Playwright Chromium build supports Ubuntu 24.04.
          matrix = [{"name": "checks", "runner": "ubuntu-24.04", "targets": ""}]
          if os.environ["TESTS_CHANGED"] == "true":
              root = Path("packages/a13n-service/tests")
              # Keep whole files together, matching loadgroup's file-local fixture isolation.
              # Envd and management providers retain their dedicated test steps.
              files = sorted(
                  str(path) for path in root.rglob("*.py")
                  if (path.match("test_*.py") or path.match("*_test.py"))
                  and path not in {
                      root / "test_environments_envd.py", root / "test_monitoring_collectors_live.py",
                      root / "test_monitoring_bundle_live.py",
                      root / "test_browser_native_live.py", root / "test_browser_selfhost_live.py",
                  }
                  and not path.is_relative_to(root / "environment_providers")
              )
              # Weights never select tests: new files receive the current suite's median.
              durations = json.loads(Path(".github/service-test-durations.json").read_text())
              matrix.append({"name": "native", "runner": "ubuntu-24.04", "targets": ""})
              for shard, targets in enumerate(balanced_shards(files, 5, durations), start=1):
                  assert targets, "Service test shards must not be empty"
                  print(f"Service shard {shard}: {len(targets)} files")
                  matrix.append({
                      "name": f"tests-{shard}",
                      "runner": "ubuntu-24.04",
                      "targets": "\n".join(targets),
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  validation:
    name: a13n Service Python (${{ matrix.task.name }}, ${{ matrix.python-version }})
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
        task: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    runs-on: ${{ matrix.task.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check a13n Service Python packages
        if: matrix.task.name == 'checks'
        run: >-
          uv run --locked pyright
          packages/a13n-logging/a13n_logging
          packages/a13n-service/a13n_service

      - name: Check Service import boundaries
        if: matrix.task.name == 'checks'
        run: make service-boundaries

      # Generated contracts use the canonical development/release interpreter.
      - name: Check Service contract export
        if: matrix.task.name == 'checks' && matrix.python-version == '3.13'
        run: uv run --locked python scripts/export-a13n-service-openapi.py --check

      - name: Test Service contract export
        if: matrix.task.name == 'checks' && matrix.python-version == '3.13'
        run: uv run --locked python -m pytest scripts/tests/test_service_contract.py --junitxml=test-results/contract.xml

      - name: Test logging
        if: matrix.task.name == 'checks'
        run: uv run --locked python -m pytest packages/a13n-logging/tests --junitxml=test-results/logging.xml

      - name: Check local Service development tools
        if: matrix.task.name == 'checks'
        run: make dev-state-check

      - name: Set up Chrome for Testing
        if: startsWith(matrix.task.name, 'tests-') || matrix.task.name == 'native'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Allow the test browser to create sandbox namespaces
        if: startsWith(matrix.task.name, 'tests-') || matrix.task.name == 'native'
        shell: bash
        env:
          BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Match Harness native tests: allow this executable, preserving Chromium's sandbox.
          sudo tee /etc/apparmor.d/service-chrome-testing >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile service-chrome-testing "$BROWSER_EXECUTABLE" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/service-chrome-testing

      - name: Test a13n Service
        if: startsWith(matrix.task.name, 'tests-')
        # Balanced runner shards preserve file-local fixtures and execute the complete suite.
        # Individual stalled tests still fail through faulthandler below.
        timeout-minutes: 6
        env:
          TEST_TARGETS: ${{ matrix.task.targets }}
          BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done <<< "$TEST_TARGETS"
          /usr/bin/time -p uv run --locked python -m pytest \
            -n 4 --dist loadgroup --max-worker-restart=0 \
            -vv --tb=short --durations=30 -r a \
            --junitxml=test-results/service.xml \
            --browser-executable="$BROWSER_EXECUTABLE" \
            -o faulthandler_timeout=120 \
            -o faulthandler_exit_on_timeout=true \
            "${targets[@]}"

      - name: Install native Browser desktop dependencies
        if: matrix.task.name == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xauth x11vnc websockify x11-apps x11-utils

      - name: Test native Browser lifecycle and Service assets
        if: matrix.task.name == 'native'
        env:
          A13N_TEST_BROWSER_NATIVE_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          uv run --locked pytest -q --junitxml=test-results/browser-native.xml \
            packages/a13n-service/tests/test_browser_native_live.py \
            'packages/a13n-service/tests/test_browser_selfhost_live.py::test_selfhost_service_asset_transfer[native]'
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('test-results/browser-native.xml').getroot()
          assert report.findall('.//testcase') and not report.findall('.//skipped')
          PY

      - name: Test native Environment management drivers
        if: matrix.task.name == 'native'
        run: uv run --locked python -m pytest packages/a13n-service/tests/environment_providers --junitxml=test-results/environment-providers.xml

      - name: Require Service execution without skips
        if: startsWith(matrix.task.name, 'tests-')
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET

          report = ET.parse("test-results/service.xml").getroot()
          assert report.findall(".//testcase"), "Service tests did not execute any cases"
          assert not report.findall(".//skipped"), "Service tests must not skip implemented capabilities"
          PYCODE

      - name: Retain Service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.task.name }}-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Set up pnpm
        if: matrix.task.name == 'checks'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        if: matrix.task.name == 'checks'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Exercise stock Console OIDC sign-in and cutover
        if: matrix.task.name == 'checks'
        run: |
          make a13n-console-build
          pnpm --dir frontend --filter a13n-console exec playwright install --with-deps chromium
          uv run --locked python -m dev.service.oidc_review --directory "$RUNNER_TEMP/oidc"

      - name: Build a13n Service Python distributions
        if: matrix.task.name == 'checks'
        run: |
          make a13n-service-assets
          uv build --package a13n-logging --out-dir dist/a13n-service
          uv build --package a13n-service --out-dir dist/a13n-service
          # uv builds the wheel from the sdist. Search that artifact, not the editable checkout.
          uv run --locked python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from importlib.metadata import distribution
          from importlib.resources import files

          wheel = next(Path("dist/a13n-service").glob("a13n_service-*.whl")).resolve()
          sys.path.insert(0, str(wheel))
          from a13n_service.console_sdk import main as export_console_sdk
          from a13n_service.documentation import Documents
          from a13n_service.resources.agents.schemas import AgentConfig

          skills = files("a13n_service").joinpath("builtin_skills/platform-operations")
          assert skills.joinpath("SKILL.md").is_file()
          assert json.loads(skills.joinpath("schemas/agent-config.json").read_text()) == AgentConfig.model_json_schema()
          assert str(files("a13n_service")).startswith(str(wheel))
          assert str(distribution("a13n-service").locate_file("a13n_service/documentation.json")).startswith(str(wheel))
          sdk = files("a13n_service").joinpath("static/console-sdk/index.d.ts").read_bytes()
          assert b"AppContribution" in sdk and b"bridgeVersion" in sdk
          with TemporaryDirectory() as temp:
              destination = Path(temp) / "sdk" / "index.d.ts"
              sys.argv = ["a13n_service.console_sdk", str(destination)]
              export_console_sdk()
              assert destination.read_bytes() == sdk
          docs = Documents()
          assert docs.search("upload")["results"]
          assert docs.search("上传", language="zh-CN")["results"]
          assert any("assigned_run_id" in item["text"] for item in docs.search("Execute an Agent", limit=10)["results"])
          PY

  python:
    name: a13n Service Python
    needs: [changes, validation]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all a13n Service checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$CHANGES_RESULT" = success && test "$VALIDATION_RESULT" = success
