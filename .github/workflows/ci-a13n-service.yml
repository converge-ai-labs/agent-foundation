name: a13n Service CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-service.yml"
      - ".github/workflows/release-a13n-service.yml"
      - ".github/service-test-durations.json"
      - "conftest.py"
      - "scripts/tests/test_ci_inputs.py"
      - "dev/**"
      - "packages/a13n-service/**"
      - "docs/a13n-service/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "Makefile"
      - "proto/a13n-service/**"
      - "scripts/export-a13n-service-openapi.py"
      - "scripts/tests/test_service_contract.py"
      - "packages/a13n-harness/*"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/*"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-envd-client/*"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-service.yml"
      - ".github/workflows/release-a13n-service.yml"
      - ".github/service-test-durations.json"
      - "conftest.py"
      - "scripts/tests/test_ci_inputs.py"
      - "dev/**"
      - "packages/a13n-service/**"
      - "docs/a13n-service/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "Makefile"
      - "proto/a13n-service/**"
      - "scripts/export-a13n-service-openapi.py"
      - "scripts/tests/test_service_contract.py"
      - "packages/a13n-harness/*"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/*"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-envd-client/*"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Service test inputs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Bundled Service documentation is a build input, so the checks job (wheel
      # build and documentation search) always runs. The database-backed test
      # suite only needs to run when something other than that documentation
      # changed; this list is the trigger list above without docs/a13n-service/**.
      - name: Classify Service inputs
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - '.github/workflows/ci-a13n-service.yml'
              - '.github/workflows/release-a13n-service.yml'
              - '.github/service-test-durations.json'
              - 'conftest.py'
              - 'scripts/tests/test_ci_inputs.py'
              - 'dev/**'
              - 'packages/a13n-service/**'
              - 'packages/a13n-logging/**'
              - 'pyproject.toml'
              - 'Makefile'
              - 'proto/a13n-service/**'
              - 'scripts/export-a13n-service-openapi.py'
              - 'scripts/tests/test_service_contract.py'
              - 'packages/a13n-harness/*'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/*'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-envd-client/*'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'uv.lock'

      - name: Build validation matrix
        id: matrix
        env:
          TESTS_CHANGED: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tests == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          matrix = [{"name": "checks", "runner": "ubuntu-latest", "targets": ""}]
          if os.environ["TESTS_CHANGED"] == "true":
              root = Path("packages/a13n-service/tests")
              # Keep whole files together, matching loadgroup's file-local fixture isolation.
              # Envd and management providers retain their dedicated test steps.
              files = sorted(
                  str(path) for path in root.rglob("*.py")
                  if (path.match("test_*.py") or path.match("*_test.py"))
                  and path not in {root / "test_environments_envd.py", root / "test_monitoring_collectors_live.py"}
                  and not path.is_relative_to(root / "environment_providers")
              )
              # Historical seconds are weights, never an allowlist. New files get the
              # current suite's median; removed files' stale timings have no effect.
              durations = json.loads(Path(".github/service-test-durations.json").read_text())
              known = [durations[path] for path in files if path in durations]
              fallback = median(known) if known else 1.0
              weights = {path: durations.get(path, fallback) for path in files}
              shards = [[], []]
              totals = [0.0, 0.0]
              for path in sorted(files, key=lambda path: (-weights[path], path)):
                  shard = min(range(2), key=lambda index: (totals[index], len(shards[index]), index))
                  shards[shard].append(path)
                  totals[shard] += weights[path]
              for shard, targets in enumerate(shards):
                  print(f"Service shard {shard + 1}: {len(targets)} files, {totals[shard]:.1f} historical test-seconds")
                  assert targets, "Service test shards must not be empty"
                  matrix.append({
                      "name": f"tests-{shard + 1}",
                      "runner": "ubuntu-24.04",
                      "targets": "\n".join(targets),
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  validation:
    name: a13n Service Python (${{ matrix.name }})
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check a13n Service Python packages
        if: matrix.name == 'checks'
        run: >-
          uv run --locked pyright
          packages/a13n-logging/a13n_logging
          packages/a13n-service/a13n_service

      - name: Check Service import boundaries
        if: matrix.name == 'checks'
        run: make service-boundaries

      - name: Check Service contract export
        if: matrix.name == 'checks'
        run: uv run --locked python scripts/export-a13n-service-openapi.py --check

      - name: Test Service contract export
        if: matrix.name == 'checks'
        run: uv run --locked python -m pytest scripts/tests/test_service_contract.py --junitxml=test-results/contract.xml

      - name: Test logging
        if: matrix.name == 'checks'
        run: uv run --locked python -m pytest packages/a13n-logging/tests --junitxml=test-results/logging.xml

      - name: Check local Service development tools
        if: matrix.name == 'checks'
        run: make dev-state-check

      - name: Test a13n Service
        if: startsWith(matrix.name, 'tests-')
        # Separate runners shorten the critical path without increasing per-runner contention.
        # Individual stalled tests still fail through faulthandler below.
        timeout-minutes: 15
        env:
          TEST_TARGETS: ${{ matrix.targets }}
        run: |
          targets=()
          while IFS= read -r target; do
            targets+=("$target")
          done <<< "$TEST_TARGETS"
          /usr/bin/time -p uv run --locked python -m pytest \
            -n 3 --dist loadgroup --max-worker-restart=0 \
            -vv --tb=short --durations=30 -r a \
            --junitxml=test-results/service.xml \
            -o faulthandler_timeout=120 \
            -o faulthandler_exit_on_timeout=true \
            "${targets[@]}"

      - name: Test native Environment management drivers
        if: matrix.name == 'tests-1'
        run: uv run --locked python -m pytest packages/a13n-service/tests/environment_providers --junitxml=test-results/environment-providers.xml

      - name: Require Service execution without skips
        if: startsWith(matrix.name, 'tests-')
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET

          report = ET.parse("test-results/service.xml").getroot()
          assert report.findall(".//testcase"), "Service tests did not execute any cases"
          assert not report.findall(".//skipped"), "Service tests must not skip implemented capabilities"
          PYCODE

      - name: Retain Service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.name }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Set up pnpm
        if: matrix.name == 'checks'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        if: matrix.name == 'checks'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build a13n Service Python distributions
        if: matrix.name == 'checks'
        run: |
          make a13n-service-assets
          uv build --package a13n-logging --out-dir dist/a13n-service
          uv build --package a13n-service --out-dir dist/a13n-service
          # uv builds the wheel from the sdist. Search that artifact, not the editable checkout.
          uv run --locked python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from importlib.metadata import distribution
          from importlib.resources import files

          wheel = next(Path("dist/a13n-service").glob("a13n_service-*.whl")).resolve()
          sys.path.insert(0, str(wheel))
          from a13n_service.documentation import Documents
          from a13n_service.resources.agents.schemas import AgentConfig

          skills = files("a13n_service").joinpath("builtin_skills/platform-operations")
          assert skills.joinpath("SKILL.md").is_file()
          assert json.loads(skills.joinpath("schemas/agent-config.json").read_text()) == AgentConfig.model_json_schema()
          assert str(files("a13n_service")).startswith(str(wheel))
          assert str(distribution("a13n-service").locate_file("a13n_service/documentation.json")).startswith(str(wheel))
          docs = Documents()
          assert docs.search("upload")["results"]
          assert docs.search("上传", language="zh-CN")["results"]
          assert any("assigned_run_id" in item["text"] for item in docs.search("Execute an Agent", limit=10)["results"])
          PY

  python:
    name: a13n Service Python
    needs: [changes, validation]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all a13n Service checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$CHANGES_RESULT" = success && test "$VALIDATION_RESULT" = success
