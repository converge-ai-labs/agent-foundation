name: Deployment CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-deploy.yml"
      - "Makefile"
      - "deploy/docker/images/a13n-service/**"
      - "deploy/kubernetes/**"
      - "scripts/deploy_smoke.py"
      - "scripts/k8s_local.py"
      - "e2e/service/**"
      - "dev/service/**"
      - "scripts/tests/test_service_e2e_tooling.py"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "dev/fixtures/**"
      - "deploy/docker/images/sandbox/**"
      - "crates/a13n-envd/**"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-harness/*.py"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-service/pyproject.toml"
      - "packages/a13n-service/*.py"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-stream-protocol/**"
      - "packages/a13n-logging/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Helm chart checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint and test the chart for every values file
        run: make sync k8s-check

  helm:
    name: Helm installation and rolling upgrade
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      K8S_ENVIRONMENTS: "1"
      K8S_BUILD_CACHE: gha
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select private temporary state paths
        run: |
          echo "K8S_STATE_DIR=$RUNNER_TEMP/a13n-kind" >> "$GITHUB_ENV"
          echo "E2E_KUBERNETES_PROFILE=$RUNNER_TEMP/kubernetes-e2e.json" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install pinned kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          kubectl_version: v1.34.1
          install_only: true

      - name: Start the pinned cluster alongside image builds
        run: |
          # Expand the environment in the child shell.
          # shellcheck disable=SC2016
          nohup bash -c '
            kind create cluster --name a13n-local \
              --image kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a \
              --config deploy/kubernetes/kind-local.yaml --wait 5m
            echo "$?" > "$RUNNER_TEMP/kind-create.status"
          ' > "$RUNNER_TEMP/kind-create.log" 2>&1 < /dev/null &

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # ubuntu-latest uses the containerd image store: build directly into it,
          # without a second image tar export/load or a BuildKit container teardown.
          driver: docker

      - name: Expose the job-scoped BuildKit cache credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              core.exportVariable(name, process.env[name]);
            }

      - name: Build both checkout images alongside cluster creation
        run: |
          python3 - <<'PY'
          import os
          from concurrent.futures import ThreadPoolExecutor
          from scripts.k8s_local import prepare_image

          images = [
              ("K8S_SERVICE_IMAGE", "a13n-service", "a13n-service:ci"),
              ("K8S_SANDBOX_IMAGE", "sandbox", "a13n-sandbox:ci"),
          ]
          with ThreadPoolExecutor(max_workers=2) as pool:
              builds = [(variable, pool.submit(prepare_image, component, tag))
                        for variable, component, tag in images]
              prepared = [(variable, build.result()) for variable, build in builds]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for variable, image in prepared:
                  output.write(f"{variable}={image}\n")
          PY

      - name: Require successful cluster creation
        timeout-minutes: 5
        run: |
          until test -f "$RUNNER_TEMP/kind-create.status"; do sleep 1; done
          cat "$RUNNER_TEMP/kind-create.log"
          test "$(cat "$RUNNER_TEMP/kind-create.status")" = 0

      - name: Install locked test dependencies
        run: make sync

      - name: Install the Service, bootstrap and verify a native run
        # Image imports overlap; k8s-up joins both before publishing deployment.json.
        run: make k8s-up k8s-smoke

      # A new rollout annotation upgrades the release: a new migration Job, then rolling Deployments.
      - name: Upgrade the release with the same checkout images
        run: |
          K8S_SERVICE_IMAGE=$(jq -r .service_image "$K8S_STATE_DIR/deployment.json")
          K8S_SANDBOX_IMAGE=$(jq -r .sandbox_image "$K8S_STATE_DIR/deployment.json")
          export K8S_SERVICE_IMAGE K8S_SANDBOX_IMAGE
          make k8s-up k8s-smoke

      - name: Require the upgraded revision and its migration
        run: |
          test "$(helm --kube-context kind-a13n-local -n a13n-service status a13n -o json | jq .version)" = 2
          kubectl --context kind-a13n-local -n a13n-service wait --for=condition=complete job/a13n-a13n-migrate-2 --timeout=60s

      - name: Show the deployment on failure
        if: failure()
        run: |
          kubectl --context kind-a13n-local -n a13n-service get pods,jobs,pvc,events || true
          kubectl --context kind-a13n-local -n a13n-service logs deployment/a13n-a13n-control --all-containers --tail 200 || true
          kubectl --context kind-a13n-local -n a13n-service logs deployment/a13n-a13n-worker --all-containers --tail 200 || true
          kubectl --context kind-a13n-local -n a13n-service logs job/a13n-a13n-migrate-2 --all-containers --tail 200 || true
          kubectl --context kind-a13n-local get pv,storageclasses || true
          kind export logs --name a13n-local test-results/kind || true

      - name: Delete the job-owned kind cluster
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/kind-create.log"; then
            # shellcheck disable=SC2016
            timeout 5m bash -c 'until test -f "$RUNNER_TEMP/kind-create.status"; do sleep 1; done' || true
          fi
          kind delete cluster --name a13n-local

      - name: Retain Kubernetes reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  journeys:
    name: Kubernetes journeys (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Cold sandbox builds include both embedded VM runtimes; leave time for journeys.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: storage
            selection: claim_lifecycle
            count: 2
          - name: failures
            selection: failed_preparation
            count: 4
          - name: recovery
            selection: fresh_run_survives
            count: 1
          - name: lifecycle
            selection: not (claim_lifecycle or failed_preparation or fresh_run_survives)
            count: 2
    env:
      E2E_KUBERNETES_CONNECTION: port_forward
      SANDBOX_IMAGE: a13n-sandbox:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select private temporary state paths
        run: |
          echo "K8S_STATE_DIR=$RUNNER_TEMP/a13n-kind" >> "$GITHUB_ENV"
          echo "E2E_KUBERNETES_PROFILE=$RUNNER_TEMP/kubernetes-e2e.json" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install pinned kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          kubectl_version: v1.34.1
          install_only: true

      - name: Start the pinned cluster alongside image builds
        run: |
          # Expand the environment in the child shell.
          # shellcheck disable=SC2016
          nohup bash -c '
            kind create cluster --name a13n-local \
              --image kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a \
              --config deploy/kubernetes/kind-local.yaml --wait 5m
            echo "$?" > "$RUNNER_TEMP/kind-create.status"
          ' > "$RUNNER_TEMP/kind-create.log" 2>&1 < /dev/null &

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # ubuntu-latest uses the containerd image store: build directly into it,
          # without a second image tar export/load or a BuildKit container teardown.
          driver: docker

      - name: Build the checkout sandbox with reusable layers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/images/sandbox/Dockerfile
          tags: a13n-sandbox:ci
          load: true
          cache-from: type=gha,scope=service-e2e-sandbox
          # Service E2E owns this cache; journey shards only consume it.

      - name: Require successful cluster creation
        timeout-minutes: 5
        run: |
          until test -f "$RUNNER_TEMP/kind-create.status"; do sleep 1; done
          cat "$RUNNER_TEMP/kind-create.log"
          test "$(cat "$RUNNER_TEMP/kind-create.status")" = 0

      - name: Install locked test dependencies and load the sandbox
        run: |
          make sync
          kind load docker-image a13n-sandbox:ci --name a13n-local
          kubectl --context kind-a13n-local create namespace a13n-service

      - name: Configure the real Pod journeys
        run: |
          kind get kubeconfig --name a13n-local > "$RUNNER_TEMP/kubernetes-e2e.kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubernetes-e2e.kubeconfig"
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          profile = {
              "authentication": "kubeconfig",
              "kubeconfig": str(Path(os.environ["RUNNER_TEMP"]) / "kubernetes-e2e.kubeconfig"),
              "context": "kind-a13n-local",
              "namespaces": ["a13n-service"],
              "ownership_id": "service-e2e",
              "sandbox_service_account": "default",
              "allow_port_forward": True,
              "allow_plaintext_envd": True,
          }
          Path(os.environ["E2E_KUBERNETES_PROFILE"]).write_text(json.dumps(profile))
          PYCODE

      - name: Run Kubernetes lifecycle, storage and recovery journeys
        env:
          SELECTION: ${{ matrix.selection }}
        run: make service-e2e SERVICE_E2E_ARGS="-m kubernetes -k '$SELECTION' --require-all --junitxml=test-results/kubernetes-e2e.xml"

      - name: Require every selected Kubernetes journey without skips
        if: always()
        shell: bash
        env:
          EXPECTED: ${{ matrix.count }}
        run: |
          python - <<'PYCODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          cases = ET.parse("test-results/kubernetes-e2e.xml").getroot().findall(".//testcase")
          skipped = [case for case in cases if case.find("skipped") is not None]
          failed = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          print(f"Kubernetes E2E: {len(cases)} collected, {len(cases) - len(skipped)} executed, "
                f"{len(skipped)} skipped, {len(failed)} failed")
          assert len(cases) == int(os.environ["EXPECTED"]) and not skipped and not failed
          PYCODE

      - name: Show the deployment on failure
        if: failure()
        run: |
          kubectl --context kind-a13n-local -n a13n-service get pods,jobs,pvc,events || true
          kubectl --context kind-a13n-local -n a13n-service logs deployment/a13n-a13n-control --all-containers --tail 200 || true
          kubectl --context kind-a13n-local -n a13n-service logs deployment/a13n-a13n-worker --all-containers --tail 200 || true
          kubectl --context kind-a13n-local -n a13n-service logs job/a13n-a13n-migrate-2 --all-containers --tail 200 || true
          kubectl --context kind-a13n-local get pv,storageclasses || true
          kind export logs --name a13n-local test-results/kind || true

      - name: Delete the job-owned kind cluster
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/kind-create.log"; then
            # shellcheck disable=SC2016
            timeout 5m bash -c 'until test -f "$RUNNER_TEMP/kind-create.status"; do sleep 1; done' || true
          fi
          kind delete cluster --name a13n-local

      - name: Retain Kubernetes reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-${{ matrix.name }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  kind:
    name: Helm install and upgrade on kind
    needs: [chart, helm, journeys]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Require Helm and all nine Kubernetes journeys
        env:
          CHART_RESULT: ${{ needs.chart.result }}
          HELM_RESULT: ${{ needs.helm.result }}
          JOURNEYS_RESULT: ${{ needs.journeys.result }}
        run: test "$CHART_RESULT" = success && test "$HELM_RESULT" = success && test "$JOURNEYS_RESULT" = success
