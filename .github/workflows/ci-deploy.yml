name: Deployment CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-deploy.yml"
      - "Makefile"
      - "deploy/docker/images/a13n-service/**"
      - "deploy/kubernetes/**"
      - "scripts/deploy_smoke.py"
      - "scripts/k8s_local.py"
      - "e2e/service/deployed_kubernetes.py"
      - "e2e/service/api.py"
      - "e2e/service/scripted.py"
      - "dev/fixtures/**"
      - "deploy/docker/images/sandbox/**"
      - "crates/a13n-envd/**"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/kubernetes/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/remote_envd/**"
      - "packages/a13n-service/a13n_service/providers/**"
      - "packages/a13n-service/a13n_service/runs/environments/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: Helm install and upgrade on kind
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      K8S_ENVIRONMENTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Lint and test the chart for every values file
        run: make k8s-check

      - name: Install the chart and create the administrator
        run: make k8s-up k8s-smoke

      # A rebuilt image under a new tag upgrades the release: a new migration Job, then rolling Deployments.
      - name: Upgrade the release
        run: make k8s-up k8s-smoke

      - name: Require the upgraded revision and its migration
        run: |
          test "$(helm --kube-context kind-a13n-local -n a13n-service status a13n -o json | jq .version)" = 2
          kubectl --context kind-a13n-local -n a13n-service wait --for=condition=complete job/a13n-a13n-migrate-2 --timeout=60s

      - name: Show the deployment on failure
        if: failure()
        run: |
          kubectl --context kind-a13n-local -n a13n-service get pods,jobs,pvc,events || true
          kubectl --context kind-a13n-local -n a13n-service logs deployment/a13n-a13n-control --all-containers --tail 200 || true
          kubectl --context kind-a13n-local -n a13n-service logs deployment/a13n-a13n-worker --all-containers --tail 200 || true
