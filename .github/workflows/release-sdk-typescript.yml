name: Release TypeScript SDK

on:
  push:
    tags:
      - "release/sdk/typescript/*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-sdk-typescript
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build TypeScript SDK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/sdk/typescript/}"
          python3 scripts/prepare-release-version.py sdk-typescript "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Build TypeScript SDK
        run: make sdk-typescript-build

      - name: Pack npm package
        run: |
          mkdir -p dist
          cd sdk/typescript
          npm pack --pack-destination ../../dist

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: foundation-sdk-typescript-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish TypeScript SDK to npm
    needs: build
    runs-on: ubuntu-latest
    environment: sdk-typescript-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: foundation-sdk-typescript-package
          path: dist

      - name: Set up Node.js for npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prevent the latest dist-tag from moving backward
        if: ${{ !contains(needs.build.outputs.version, '-rc.') }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          published="$(npm view a13n-sdk version 2>/dev/null || true)"
          if [ -z "$published" ]; then
            exit 0
          fi
          PUBLISHED_VERSION="$published" node <<'JS'
          const published = process.env.PUBLISHED_VERSION.split(".").map(Number);
          const candidate = process.env.VERSION.split(".").map(Number);
          const compare = candidate.findIndex((part, index) => part !== published[index]);
          if (compare === -1 || candidate[compare] < published[compare]) {
            throw new Error(
              `Refusing to publish ${process.env.VERSION} after ${process.env.PUBLISHED_VERSION}`,
            );
          }
          JS

      - name: Publish package with npm Trusted Publishing
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$VERSION" == *-rc.* ]]; then
            npm publish ./dist/*.tgz --access public --tag rc
          else
            npm publish ./dist/*.tgz --access public
          fi

  create-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: foundation-sdk-typescript-package
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py sdk-typescript "$VERSION"
          "Foundation SDK for TypeScript $VERSION" dist/*
