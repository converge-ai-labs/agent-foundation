name: Release Rust SDK

on:
  push:
    tags:
      - "release/sdk/rust/*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-sdk-rust
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build Rust SDK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/sdk/rust/}"
          python3 scripts/prepare-release-version.py sdk-rust "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target
          shared-key: foundation-sdk-release

      - name: Package crate
        run: make sdk-rust-package

      - name: Upload crate
        uses: actions/upload-artifact@v4
        with:
          name: foundation-sdk-rust-crate
          path: sdk/rust/target/package/a13n-sdk-*.crate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Rust SDK to crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: sdk-rust-crates-io
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare release version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/prepare-release-version.py sdk-rust "$VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty --manifest-path sdk/rust/Cargo.toml

  create-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download crate
        uses: actions/download-artifact@v4
        with:
          name: foundation-sdk-rust-crate
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py sdk-rust "$VERSION"
          "Foundation SDK for Rust $VERSION" dist/*
