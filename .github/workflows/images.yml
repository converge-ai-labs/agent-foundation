name: Development Images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deploy/containers/foundation-service/Dockerfile"
      - "deploy/containers/sandbox/Dockerfile"
      - "LICENSE"
      - "apps/foundation-web/**"
      - "crates/agent-envd/**"
      - "packages/agent-envd-client/pyproject.toml"
      - "packages/agent-environment-provider/pyproject.toml"
      - "packages/agent-harness/pyproject.toml"
      - "packages/agent-stream-protocol/pyproject.toml"
      - "packages/agent-ui/pyproject.toml"
      - "packages/foundation-service/**"
      - "packages/logging/**"
      - "pyproject.toml"
      - "scripts/docker-entrypoint.sh"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: development-images
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundation-service
            file: deploy/containers/foundation-service/Dockerfile
            image: ghcr.io/converge-ai-labs/agent-foundation-service
            local_image: agent-foundation-service:local
            check_target: image-check-foundation-service
          - name: sandbox
            file: deploy/containers/sandbox/Dockerfile
            image: ghcr.io/converge-ai-labs/agent-foundation-sandbox
            local_image: agent-foundation-sandbox:local
            check_target: image-check-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-,format=long

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          # Development publishing is intentionally native amd64 only; other architectures build locally.
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ matrix.local_image }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=dev
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke-check image
        run: make ${{ matrix.check_target }}

      - name: Publish image
        run: docker push --all-tags "${{ matrix.image }}"
