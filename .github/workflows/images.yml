name: Development Images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deploy/docker/images/a13n-service/Dockerfile"
      - "deploy/docker/images/a13n-service/entrypoint.sh"
      - "deploy/docker/images/a13n-service/service.toml"
      - "deploy/docker/images/sandbox/Dockerfile"
      - "LICENSE"
      - "crates/a13n-envd/**"
      - "packages/a13n-envd-client/*"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-harness/*"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/*"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "frontend/apps/a13n-console/**"
      - "proto/a13n-service/openapi.json"
      - "frontend/packages/a13n-ui/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/tsconfig.base.json"
      - "packages/a13n-harness-ui/pyproject.toml"
      - "packages/a13n-service/*"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-logging/*"
      - "packages/a13n-logging/a13n_logging/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: development-images
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Detect development image changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify image inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Select package-root metadata/build hooks and runtime trees, not tests.
          filters: |
            service:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'deploy/docker/images/a13n-service/Dockerfile'
              - 'deploy/docker/images/a13n-service/entrypoint.sh'
              - 'deploy/docker/images/a13n-service/service.toml'
              - 'packages/a13n-envd-client/*'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'packages/a13n-harness/*'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/*'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-harness-ui/pyproject.toml'
              - 'packages/a13n-service/*'
              - 'packages/a13n-service/a13n_service/**'
              - 'packages/a13n-logging/*'
              - 'packages/a13n-logging/a13n_logging/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'frontend/apps/a13n-console/**'
              - 'frontend/packages/a13n-ui/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.base.json'
              - 'proto/a13n-service/openapi.json'
            sandbox:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/a13n-envd/**'
              - 'deploy/docker/images/sandbox/Dockerfile'
              - 'LICENSE'

      - name: Build image matrix
        id: matrix
        env:
          A13N_SERVICE_CHANGED: ${{ steps.filter.outputs.service }}
          SANDBOX_CHANGED: ${{ steps.filter.outputs.sandbox }}
        run: |
          python - <<'PY'
          import json
          import os

          images = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["A13N_SERVICE_CHANGED"] == "true":
              images.append({
                  "name": "a13n-service",
                  "runner": "ubuntu-latest",
                  "file": "deploy/docker/images/a13n-service/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-service",
                  "context": ".",
                  "platforms": "linux/amd64,linux/arm64",
              })
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["SANDBOX_CHANGED"] == "true":
              images.append({
                  "name": "a13n-sandbox",
                  "runner": "ubuntu-24.04",
                  "file": "deploy/docker/images/sandbox/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-sandbox",
                  "context": ".",
                  "platforms": "linux/amd64,linux/arm64",
              })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"images={json.dumps(images, separators=(',', ':'))}\n")
          PY

  publish:
    name: Publish ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU for arm64
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=dev

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=dev
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
