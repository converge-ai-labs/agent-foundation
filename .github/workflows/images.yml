name: Development Images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deploy/docker/images/a13n-service/Dockerfile"
      - "deploy/docker/images/a13n-service/entrypoint.sh"
      - "deploy/docker/images/a13n-service/service.toml"
      - "deploy/docker/images/sandbox/**"
      - "LICENSE"
      - "crates/a13n-envd/**"
      - "packages/a13n-envd-client/*"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-harness/*"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/*"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "frontend/apps/a13n-console/**"
      - "proto/a13n-service/openapi.json"
      - "frontend/packages/a13n-ui/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/tsconfig.base.json"
      - "packages/a13n-harness-ui/pyproject.toml"
      - "packages/a13n-service/*"
      - "docs/a13n-service/**"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-logging/*"
      - "packages/a13n-logging/a13n_logging/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: development-images
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Detect development image changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify image inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Select package-root metadata/build hooks and runtime trees, not tests.
          filters: |
            service:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'deploy/docker/images/a13n-service/Dockerfile'
              - 'deploy/docker/images/a13n-service/entrypoint.sh'
              - 'deploy/docker/images/a13n-service/service.toml'
              - 'packages/a13n-envd-client/*'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'packages/a13n-harness/*'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/*'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-harness-ui/pyproject.toml'
              - 'packages/a13n-service/*'
              - 'docs/a13n-service/**'
              - 'packages/a13n-service/a13n_service/**'
              - 'packages/a13n-logging/*'
              - 'packages/a13n-logging/a13n_logging/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'frontend/apps/a13n-console/**'
              - 'frontend/packages/a13n-ui/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.base.json'
              - 'proto/a13n-service/openapi.json'
            sandbox:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/a13n-envd/**'
              - 'deploy/docker/images/sandbox/**'
              - 'LICENSE'

      - name: Build image matrix
        id: matrix
        env:
          A13N_SERVICE_CHANGED: ${{ steps.filter.outputs.service }}
          SANDBOX_CHANGED: ${{ steps.filter.outputs.sandbox }}
        run: |
          python - <<'PY'
          import json
          import os

          images = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["A13N_SERVICE_CHANGED"] == "true":
              images.append({
                  "name": "a13n-service",
                  "runner": "ubuntu-latest",
                  "file": "deploy/docker/images/a13n-service/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-service",
                  "context": ".",
                  "platforms": "linux/amd64,linux/arm64",
                  "variant": "standard",
                  "tag": "dev",
              })
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["SANDBOX_CHANGED"] == "true":
              for variant in ("standard", "slim"):
                  images.append({
                      "name": "a13n-sandbox",
                      "runner": "ubuntu-24.04",
                      "file": "deploy/docker/images/sandbox/Dockerfile",
                      "image": "ghcr.io/converge-ai-labs/a13n-sandbox",
                      "context": ".",
                      "platforms": "linux/amd64,linux/arm64",
                      "variant": variant,
                      "tag": "dev" if variant == "standard" else "dev-slim",
                  })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"images={json.dumps(images, separators=(',', ':'))}\n")
          PY

  sandbox-binaries:
    name: Build sandbox binary (${{ matrix.arch }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.images).*.name, 'a13n-sandbox')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-sandbox-${{ matrix.target }}

      - name: Build native sandbox binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package a13n-envd --target "$TARGET"

      - name: Upload sandbox binary
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-binary-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/a13n-envd
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }} (${{ matrix.variant }})
    needs: [changes, sandbox-binaries]
    # A skipped/failed sandbox build must not suppress Service publication.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.images != '[]' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require successful sandbox binaries
        if: matrix.name == 'a13n-sandbox'
        env:
          BINARY_BUILD_RESULT: ${{ needs.sandbox-binaries.result }}
        run: test "$BINARY_BUILD_RESULT" = success

      - name: Download AMD64 sandbox binary
        if: matrix.name == 'a13n-sandbox'
        uses: actions/download-artifact@v4
        with:
          name: sandbox-binary-amd64
          path: tmp/sandbox-binaries/amd64

      - name: Download ARM64 sandbox binary
        if: matrix.name == 'a13n-sandbox'
        uses: actions/download-artifact@v4
        with:
          name: sandbox-binary-arm64
          path: tmp/sandbox-binaries/arm64

      - name: Set up QEMU for arm64
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.tag }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'a13n-sandbox' && 'ENVD_BINARY_SOURCE=prebuilt' || '' }}
            ${{ matrix.name == 'a13n-sandbox' && format('SANDBOX_VARIANT={0}', matrix.variant) || '' }}
            BUILD_VERSION=dev
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.variant }}
