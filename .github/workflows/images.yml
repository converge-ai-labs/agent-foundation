name: Development Images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deploy/containers/a13n-service/Dockerfile"
      - "deploy/containers/sandbox/Dockerfile"
      - "LICENSE"
      - "crates/a13n-envd/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-environment/pyproject.toml"
      - "packages/a13n-harness/pyproject.toml"
      - "packages/a13n-stream-protocol/pyproject.toml"
      - "packages/a13n-harness-ui/pyproject.toml"
      - "packages/a13n-service/**"
      - "packages/a13n-logging/**"
      - "pyproject.toml"
      - "scripts/docker-entrypoint.sh"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: development-images
  cancel-in-progress: false

jobs:
  changes:
    name: Detect development image changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify image inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'deploy/containers/a13n-service/Dockerfile'
              - 'packages/a13n-envd-client/pyproject.toml'
              - 'packages/a13n-environment/pyproject.toml'
              - 'packages/a13n-harness/pyproject.toml'
              - 'packages/a13n-stream-protocol/pyproject.toml'
              - 'packages/a13n-harness-ui/pyproject.toml'
              - 'packages/a13n-service/**'
              - 'packages/a13n-logging/**'
              - 'pyproject.toml'
              - 'scripts/docker-entrypoint.sh'
              - 'uv.lock'
            sandbox:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/a13n-envd/**'
              - 'deploy/containers/sandbox/Dockerfile'
              - 'LICENSE'

      - name: Build image matrix
        id: matrix
        env:
          A13N_SERVICE_CHANGED: ${{ steps.filter.outputs.service }}
          SANDBOX_CHANGED: ${{ steps.filter.outputs.sandbox }}
        run: |
          python - <<'PY'
          import json
          import os

          images = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["A13N_SERVICE_CHANGED"] == "true":
              images.append({
                  "name": "a13n-service",
                  "runner": "ubuntu-latest",
                  "file": "deploy/containers/a13n-service/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-service",
                  "local_image": "a13n-service:local",
                  "check_target": "image-check-a13n-service",
              })
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["SANDBOX_CHANGED"] == "true":
              images.append({
                  "name": "a13n-sandbox",
                  "runner": "ubuntu-24.04-8core",
                  "file": "deploy/containers/sandbox/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-sandbox",
                  "local_image": "a13n-sandbox:local",
                  "check_target": "image-check-sandbox",
              })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"images={json.dumps(images, separators=(',', ':'))}\n")
          PY

  publish:
    name: Publish ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-,format=long

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          # Development publishing is intentionally native amd64 only; other architectures build locally.
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ matrix.local_image }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=dev
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke-check image
        run: make ${{ matrix.check_target }}

      - name: Publish image
        run: docker push --all-tags "${{ matrix.image }}"
