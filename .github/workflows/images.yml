name: Development Images

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "deploy/containers/a13n-service/Dockerfile"
      - "deploy/containers/a13n-service/service.toml"
      - "deploy/containers/sandbox/Dockerfile"
      - "deploy/containers/docker-environment/Dockerfile"
      - "LICENSE"
      - "crates/a13n-envd/**"
      - "packages/a13n-envd-client/*"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-environment/*"
      - "packages/a13n-environment/a13n_environment/**"
      - "packages/a13n-harness/*"
      - "packages/a13n-harness/a13n_harness/**"
      - "packages/a13n-stream-protocol/*"
      - "packages/a13n-stream-protocol/a13n_stream_protocol/**"
      - "packages/a13n-harness-ui/*"
      - "packages/a13n-harness-ui/a13n_harness_ui/**"
      - "docs/a13n-harness-ui/**"
      - "mkdocs.yml"
      - "frontend/apps/a13n-harness-ui/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/tsconfig.base.json"
      - "deploy/containers/a13n-harness-ui/**"
      - "scripts/prepare_harness_ui_image.py"
      - "scripts/prepare-a13n-harness-ui-assets.py"
      - "scripts/prepare_a13n_harness_ui_assets.py"
      - "Makefile"
      - "packages/a13n-service/*"
      - "packages/a13n-service/a13n_service/**"
      - "packages/a13n-logging/*"
      - "packages/a13n-logging/a13n_logging/**"
      - "pyproject.toml"
      - "scripts/docker-entrypoint.sh"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: development-images
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    name: Detect development image changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify image inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Select package-root metadata/build hooks and runtime trees, not tests.
          filters: |
            service:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'deploy/containers/a13n-service/Dockerfile'
              - 'deploy/containers/a13n-service/service.toml'
              - 'packages/a13n-envd-client/*'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'packages/a13n-environment/*'
              - 'packages/a13n-environment/a13n_environment/**'
              - 'packages/a13n-harness/*'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/*'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-harness-ui/pyproject.toml'
              - 'packages/a13n-service/*'
              - 'packages/a13n-service/a13n_service/**'
              - 'packages/a13n-logging/*'
              - 'packages/a13n-logging/a13n_logging/**'
              - 'pyproject.toml'
              - 'scripts/docker-entrypoint.sh'
              - 'uv.lock'
            harness_ui:
              - '.github/workflows/images.yml'
              - 'deploy/containers/a13n-harness-ui/**'
              - 'packages/a13n-envd-client/*'
              - 'packages/a13n-envd-client/a13n_envd_client/**'
              - 'packages/a13n-environment/*'
              - 'packages/a13n-environment/a13n_environment/**'
              - 'packages/a13n-harness/*'
              - 'packages/a13n-harness/a13n_harness/**'
              - 'packages/a13n-stream-protocol/*'
              - 'packages/a13n-stream-protocol/a13n_stream_protocol/**'
              - 'packages/a13n-harness-ui/*'
              - 'packages/a13n-harness-ui/a13n_harness_ui/**'
              - 'docs/a13n-harness-ui/**'
              - 'mkdocs.yml'
              - 'packages/a13n-logging/*'
              - 'packages/a13n-logging/a13n_logging/**'
              - 'frontend/apps/a13n-harness-ui/**'
              - 'frontend/packages/a13n-ui/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig.base.json'
              - 'scripts/prepare_harness_ui_image.py'
              - 'scripts/prepare-a13n-harness-ui-assets.py'
              - 'scripts/prepare_a13n_harness_ui_assets.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
            docker_environment:
              - ".github/workflows/images.yml"
              - "deploy/containers/docker-environment/Dockerfile"
              - "Makefile"
            sandbox:
              - '.dockerignore'
              - '.github/workflows/images.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/a13n-envd/**'
              - 'deploy/containers/sandbox/Dockerfile'
              - 'LICENSE'

      - name: Build image matrix
        id: matrix
        env:
          A13N_SERVICE_CHANGED: ${{ steps.filter.outputs.service }}
          DOCKER_ENVIRONMENT_CHANGED: ${{ steps.filter.outputs.docker_environment }}
          SANDBOX_CHANGED: ${{ steps.filter.outputs.sandbox }}
          HARNESS_UI_CHANGED: ${{ steps.filter.outputs.harness_ui }}
        run: |
          python - <<'PY'
          import json
          import os

          images = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["A13N_SERVICE_CHANGED"] == "true":
              images.append({
                  "name": "a13n-service",
                  "runner": "ubuntu-latest",
                  "file": "deploy/containers/a13n-service/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-service",
                  "context": ".",
              })
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["SANDBOX_CHANGED"] == "true":
              images.append({
                  "name": "a13n-sandbox",
                  "runner": "ubuntu-24.04-8core",
                  "file": "deploy/containers/sandbox/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-sandbox",
                  "context": ".",
              })
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["HARNESS_UI_CHANGED"] == "true":
              images.append({
                  "name": "a13n-harness-ui",
                  "runner": "ubuntu-latest",
                  "file": "deploy/containers/a13n-harness-ui/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-harness-ui",
                  "context": "dist/a13n-harness-ui-image",
              })
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" or os.environ["DOCKER_ENVIRONMENT_CHANGED"] == "true":
              images.append({
                  "name": "a13n-docker-environment",
                  "runner": "ubuntu-latest",
                  "file": "deploy/containers/docker-environment/Dockerfile",
                  "image": "ghcr.io/converge-ai-labs/a13n-docker-environment",
                  "context": "deploy/containers/docker-environment",
              })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"images={json.dumps(images, separators=(',', ':'))}\n")
          PY

  publish:
    name: Publish ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python for Harness UI
        if: matrix.name == 'a13n-harness-ui'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv for Harness UI
        if: matrix.name == 'a13n-harness-ui'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up pnpm for Harness UI
        if: matrix.name == 'a13n-harness-ui'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js for Harness UI
        if: matrix.name == 'a13n-harness-ui'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Prepare Harness UI image context
        if: matrix.name == 'a13n-harness-ui'
        run: make a13n-harness-ui-image-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=dev

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Development publishing is intentionally native amd64 only; other architectures build locally.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=dev
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
