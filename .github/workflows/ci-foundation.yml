name: Foundation CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-foundation.yml"
      - ".github/workflows/release-foundation.yml"
      - "conftest.py"
      - "dev/**"
      - "packages/foundation-service/**"
      - "packages/logging/**"
      - "pyproject.toml"
      - "scripts/dev.sh"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-foundation.yml"
      - ".github/workflows/release-foundation.yml"
      - "conftest.py"
      - "dev/**"
      - "packages/foundation-service/**"
      - "packages/logging/**"
      - "pyproject.toml"
      - "scripts/dev.sh"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      temporary-storage:
        description: Temporary test storage for performance comparisons
        type: choice
        options: [disk, memory]
        default: disk

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Foundation Python (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            runner: ubuntu-latest
          - name: tests
            runner: ubuntu-24.04-8core
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check Foundation Python packages
        if: matrix.name == 'checks'
        run: >-
          uv run --locked pyright
          packages/logging/a13n_logging
          packages/foundation-service/a13n_service

      - name: Test logging
        if: matrix.name == 'checks'
        run: uv run --locked python -m pytest packages/logging/tests

      - name: Test Foundation Service
        if: matrix.name == 'tests'
        timeout-minutes: 10
        env:
          TEST_TEMPORARY_STORAGE: ${{ inputs.temporary-storage || 'disk' }}
        run: |
          lscpu
          df -h "$RUNNER_TEMP" /dev/shm
          stats="$RUNNER_TEMP/foundation-vmstat.log"
          vmstat 5 > "$stats" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; cat "$stats"' EXIT
          temporary_root="$RUNNER_TEMP"
          if [[ "$TEST_TEMPORARY_STORAGE" == memory ]]; then
            temporary_root=/dev/shm
          fi
          test_directory="$(mktemp -d "$temporary_root/foundation-tests.XXXXXX")"
          /usr/bin/time -v uv run --locked python -m pytest \
            -n 7 --dist loadgroup --max-worker-restart=0 \
            -vv --tb=short --durations=30 \
            -o faulthandler_timeout=120 \
            -o faulthandler_exit_on_timeout=true \
            --basetemp "$test_directory" \
            packages/foundation-service/tests

      - name: Build Foundation Python distributions
        if: matrix.name == 'checks'
        run: |
          uv build --package a13n-logging --out-dir dist/foundation
          uv build --package a13n-service --out-dir dist/foundation

  python:
    name: Foundation Python
    needs: validation
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Require all Foundation checks to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
