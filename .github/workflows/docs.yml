name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "frontend/*"
      - "frontend/apps/a13n-docs/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/apps/a13n-harness-ui/src/openapi.json"
      - "proto/a13n-service/openapi.json"
      - "scripts/docs/service-settings.schema.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "frontend/*"
      - "frontend/apps/a13n-docs/**"
      - "frontend/packages/a13n-ui/**"
      - "frontend/apps/a13n-harness-ui/src/openapi.json"
      - "proto/a13n-service/openapi.json"
      - "scripts/docs/service-settings.schema.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build docs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend workspace
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check docs site
        run: pnpm --dir frontend --filter a13n-docs run check

      # The build fails on any broken internal link or anchor.
      - name: Build docs site
        run: pnpm --dir frontend --filter a13n-docs run build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: frontend/apps/a13n-docs/out
          if-no-files-found: error

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      deployments: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: docs
      url: https://agent-foundation-docs.converge.ai/
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=agent-foundation-docs --branch=main
