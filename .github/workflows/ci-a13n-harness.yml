name: a13n Harness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-harness.yml"
      - ".github/workflows/release-a13n-harness.yml"
      - "packages/a13n-harness/**"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-logging/a13n_logging/**"
      - "packages/a13n-logging/pyproject.toml"
      - "conftest.py"
      - "scripts/run_python_tests.py"
      - "dev/observation-demo/**"
      - "scripts/provider-smoke/**"
      - "scripts/tests/provider_smoke/**"
      - "scripts/check-a13n-distributions.py"
      - "scripts/release_version.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-harness.yml"
      - ".github/workflows/release-a13n-harness.yml"
      - "packages/a13n-harness/**"
      - "packages/a13n-envd-client/a13n_envd_client/**"
      - "packages/a13n-envd-client/pyproject.toml"
      - "packages/a13n-logging/a13n_logging/**"
      - "packages/a13n-logging/pyproject.toml"
      - "conftest.py"
      - "scripts/run_python_tests.py"
      - "dev/observation-demo/**"
      - "scripts/provider-smoke/**"
      - "scripts/tests/provider_smoke/**"
      - "scripts/check-a13n-distributions.py"
      - "scripts/release_version.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: a13n Harness (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests-1
            runner: ubuntu-24.04
            shard: 1
          - name: tests-2
            runner: ubuntu-24.04
            shard: 2
          - name: checks
            runner: ubuntu-24.04
          - name: browser
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
            test_options: ""
            test_targets: >-
              packages/a13n-harness/tests/test_environment_core.py
              packages/a13n-harness/tests/test_monitored_process.py
              packages/a13n-harness/tests/providers_environment

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check a13n Harness
        if: matrix.name == 'checks'
        run: uv run --locked pyright packages/a13n-harness/a13n_harness

      - name: Test a13n Harness on Windows
        if: matrix.name == 'Windows'
        run: uv run --locked python -m pytest -vv ${{ matrix.test_options }} ${{ matrix.test_targets }} --junitxml=test-results/harness.xml --durations=30 -r a

      - name: Test a13n Harness shard
        if: startsWith(matrix.name, 'tests-')
        env:
          PYTEST_ADDOPTS: -vv --junitxml=test-results/harness.xml --durations=30 -r a
        run: >-
          uv run --locked python scripts/run_python_tests.py
          --workers 2 --shard ${{ matrix.shard }} 2 packages/a13n-harness/tests

      - name: Set up Chrome for Testing
        if: matrix.name == 'browser'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Allow the test browser to create sandbox namespaces
        if: matrix.name == 'browser'
        shell: bash
        env:
          BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Ubuntu 24.04 restricts user namespaces for downloaded Chrome builds.
          # Allow only this executable; keep Chromium's sandbox and the global policy.
          sudo tee /etc/apparmor.d/harness-chrome-testing >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile harness-chrome-testing "$BROWSER_EXECUTABLE" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/harness-chrome-testing

      - name: Test native Chromium browser workflows
        if: matrix.name == 'browser'
        shell: bash
        env:
          BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "$BROWSER_EXECUTABLE" --version
          uv run --locked python -m pytest -vv \
            packages/a13n-harness/tests/test_browser_cdp_native.py \
            packages/a13n-harness/tests/test_browser_workflows_native.py \
            --browser-executable="$BROWSER_EXECUTABLE" --junitxml=test-results/browser.xml

      - name: Test provider diagnostics without external calls
        if: matrix.name == 'checks'
        run: uv run --locked python -m pytest scripts/tests/provider_smoke --junitxml=test-results/providers.xml

      - name: Retain Harness test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.name }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Build a13n Harness distribution
        if: matrix.name == 'checks'
        run: |
          uv build --package a13n-harness --out-dir dist/harness

  linux:
    name: a13n Harness (Linux)
    needs: harness
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Require all Harness checks
        env:
          RESULT: ${{ needs.harness.result }}
        run: test "$RESULT" = success
