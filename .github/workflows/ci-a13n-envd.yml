name: a13n-envd CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ci-a13n-envd.yml"
      - ".github/workflows/release-a13n-envd.yml"
      - "scripts/envd_size.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "conftest.py"
      - "crates/a13n-envd/**"
      - "dev/fixtures/linux-desktop/**"
      - "packages/a13n-harness/tests/test_accessibility_linux_native.py"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/eip/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/local_envd/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/remote_envd/**"
      - "packages/a13n-harness/tests/providers_environment/test_*envd*.py"
      - "packages/a13n-harness/tests/providers_environment/test_envd_error_boundaries.py"
      - "packages/a13n-service/a13n_service/providers/envd.py"
      - "packages/a13n-service/a13n_service/providers/endpoints.py"
      - "packages/a13n-service/a13n_service/infra/crypto.py"
      - "packages/a13n-service/a13n_service/runs/environments/**"
      - "packages/a13n-service/tests/test_environments_envd.py"
      - "packages/a13n-service/tests/environments_support.py"
      - "packages/a13n-service/tests/client_envd_support.py"
      - "examples/environment-provider/**"
      - "proto/a13n-envd/eip/**"
      - "pyproject.toml"
      - "scripts/eip_codegen/**"
      - "scripts/tests/test_eip_codegen.py"
      - "spec/a13n-envd/01-daemon-lifecycle-and-configuration.md"
      - "spec/a13n-envd/02-eip-protocol.md"
      - "spec/a13n-envd/05-command-and-process-execution.md"
      - "spec/a13n-envd/07-execution-isolation.md"
      - "spec/a13n-envd/08-protocol-source-client-and-generation.md"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-a13n-envd.yml"
      - ".github/workflows/release-a13n-envd.yml"
      - "scripts/envd_size.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "conftest.py"
      - "crates/a13n-envd/**"
      - "dev/fixtures/linux-desktop/**"
      - "packages/a13n-harness/tests/test_accessibility_linux_native.py"
      - "packages/a13n-envd-client/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/eip/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/local_envd/**"
      - "packages/a13n-harness/a13n_harness/providers/environment/remote_envd/**"
      - "packages/a13n-harness/tests/providers_environment/test_*envd*.py"
      - "packages/a13n-harness/tests/providers_environment/test_envd_error_boundaries.py"
      - "packages/a13n-service/a13n_service/providers/envd.py"
      - "packages/a13n-service/a13n_service/providers/endpoints.py"
      - "packages/a13n-service/a13n_service/infra/crypto.py"
      - "packages/a13n-service/a13n_service/runs/environments/**"
      - "packages/a13n-service/tests/test_environments_envd.py"
      - "packages/a13n-service/tests/environments_support.py"
      - "packages/a13n-service/tests/client_envd_support.py"
      - "examples/environment-provider/**"
      - "proto/a13n-envd/eip/**"
      - "pyproject.toml"
      - "scripts/eip_codegen/**"
      - "scripts/tests/test_eip_codegen.py"
      - "spec/a13n-envd/01-daemon-lifecycle-and-configuration.md"
      - "spec/a13n-envd/02-eip-protocol.md"
      - "spec/a13n-envd/05-command-and-process-execution.md"
      - "spec/a13n-envd/07-execution-isolation.md"
      - "spec/a13n-envd/08-protocol-source-client-and-generation.md"
      - "uv.lock"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect a13n-envd changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      daemon: ${{ steps.filter.outputs.daemon }}
      protocol: ${{ steps.filter.outputs.protocol }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            daemon:
              - '.github/workflows/ci-a13n-envd.yml'
              - 'Makefile'
              - 'conftest.py'
              - '.github/workflows/release-a13n-envd.yml'
              - 'crates/a13n-envd/**'
              - 'dev/fixtures/linux-desktop/**'
              - 'packages/a13n-harness/tests/test_accessibility_linux_native.py'
              - 'spec/a13n-envd/01-daemon-lifecycle-and-configuration.md'
              - 'spec/a13n-envd/05-command-and-process-execution.md'
              - 'spec/a13n-envd/07-execution-isolation.md'
              - 'proto/a13n-envd/eip/**'
              - 'Cargo.toml'
              - 'scripts/envd_size.py'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'uv.lock'
            client:
              - '.github/workflows/ci-a13n-envd.yml'
              - 'Makefile'
              - 'conftest.py'
              - '.github/workflows/release-a13n-envd.yml'
              - 'packages/a13n-envd-client/**'
              - 'proto/a13n-envd/eip/**'
              - 'scripts/eip_codegen/**'
              - 'scripts/tests/test_eip_codegen.py'
              - 'pyproject.toml'
              - 'uv.lock'
            protocol:
              - '.github/workflows/ci-a13n-envd.yml'
              - 'Makefile'
              - 'conftest.py'
              - '.github/workflows/release-a13n-envd.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # Rust build inputs; packaging metadata and the Swift launcher
              # do not participate in the Linux protocol integration job.
              - 'crates/a13n-envd/Cargo.toml'
              - 'crates/a13n-envd/build.rs'
              - 'crates/a13n-envd/build_support/**'
              - 'crates/a13n-envd/src/**'
              - 'crates/a13n-envd/protocol/**'
              - 'crates/a13n-envd/tests/**'
              - 'dev/fixtures/linux-desktop/**'
              - 'packages/a13n-harness/tests/test_accessibility_linux_native.py'
              - 'packages/a13n-envd-client/**'
              - 'packages/a13n-harness/a13n_harness/providers/environment/eip/**'
              - 'packages/a13n-harness/a13n_harness/providers/environment/local_envd/**'
              - 'packages/a13n-harness/a13n_harness/providers/environment/remote_envd/**'
              - 'packages/a13n-harness/tests/providers_environment/test_*envd*.py'
              - 'packages/a13n-harness/tests/providers_environment/test_envd_error_boundaries.py'
              - 'packages/a13n-service/a13n_service/providers/envd.py'
              - 'packages/a13n-service/a13n_service/providers/endpoints.py'
              - 'packages/a13n-service/a13n_service/infra/crypto.py'
              - 'packages/a13n-service/a13n_service/runs/environments/**'
              - 'packages/a13n-service/tests/test_environments_envd.py'
              - 'packages/a13n-service/tests/environments_support.py'
              - 'packages/a13n-service/tests/client_envd_support.py'
              - 'examples/environment-provider/**'
              - 'proto/a13n-envd/eip/**'
              - 'scripts/eip_codegen/**'
              - 'scripts/tests/test_eip_codegen.py'
              - 'spec/a13n-envd/02-eip-protocol.md'
              - 'spec/a13n-envd/08-protocol-source-client-and-generation.md'
              - 'pyproject.toml'
              - 'uv.lock'

  protocol:
    name: EIP protocol
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install Linux isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: eip-protocol

      - name: Verify generated protocol and shared integration
        env:
          PYTEST_ADDOPTS: --durations=30 -r a
          EIP_TEST_REPORT_DIR: ${{ github.workspace }}/test-results
        run: make eip-verify eip-integration-test

      - name: Retain EIP test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eip-protocol-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Type-check EIP generator
        run: uv run --locked pyright scripts/eip_codegen

  client:
    name: a13n-envd client
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize Python workspace
        run: uv sync --locked --all-packages

      - name: Type-check a13n-envd client
        run: uv run --locked pyright packages/a13n-envd-client/a13n_envd_client

      - name: Test a13n-envd client
        run: uv run --locked python -m pytest packages/a13n-envd-client/tests --junitxml=test-results/client.xml --durations=30 -r a

      - name: Retain client test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envd-client-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Build a13n-envd client distribution
        run: uv build --package a13n-envd-client --out-dir dist/a13n-envd-client

  daemon:
    name: a13n-envd (${{ matrix.name }}, ${{ matrix.envd-variant }})
    env:
      BOXLITE_DEPS_STUB: "2"
      BOXLITE_EMBED_RUNTIME: "1"
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || needs.changes.outputs.daemon == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            envd-variant: default
            features: ""
            cache-key: linux-x86_64
            complete: true
            linux: true
            components: clippy, rustfmt
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            envd-variant: default
            features: ""
            cache-key: linux-aarch64
            complete: false
            linux: true
            components: ""
          - name: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            envd-variant: default
            features: ""
            cache-key: windows
            complete: false
            linux: false
            components: ""
          # macOS exercises the Seatbelt-backed execution-isolation path.
          - name: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            envd-variant: default
            features: ""
            cache-key: macos
            complete: false
            linux: false
            components: ""
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            envd-variant: vm
            features: vm
            cache-key: linux-x86_64-vm
            complete: false
            linux: true
            components: ""
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            envd-variant: vm
            features: vm
            cache-key: linux-aarch64-vm
            complete: false
            linux: true
            components: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux isolation dependency
        if: matrix.linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap xvfb xauth xclip protobuf-compiler \
            dbus-daemon dbus-x11 at-spi2-core libatk-adaptor python3-gi gir1.2-gtk-3.0
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # setup-python changes PKG_CONFIG_PATH, which native Cargo build scripts
      # track. Set it up before compiling so later tests reuse those artifacts.
      - name: Set up Python for size and native EIP tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: ${{ matrix.components }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: a13n-envd-${{ matrix.cache-key }}

      - name: Run complete a13n-envd checks
        if: matrix.complete
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          make rust-check rust-package 2>&1 | tee test-results/native.log

      # Integration tests compile the distributable binary too; size reporting
      # consumes that exact binary without a second cargo build.
      - name: Run a13n-envd tests
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -o pipefail
          mkdir -p test-results
          cargo test --release --locked --package a13n-envd --features "$FEATURES" 2>&1 | tee test-results/native.log

      - name: Measure release binary and archive size
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ENVD_VARIANT: ${{ matrix.envd-variant }}
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          python3 scripts/envd_size.py --binary "target/release/a13n-envd$EXE_SUFFIX" \
            --target "$TARGET" --variant "$ENVD_VARIANT" --output "test-results/size/report.json"

      - name: Retain size report even on budget failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envd-size-${{ matrix.cache-key }}-attempt-${{ github.run_attempt }}
          path: test-results/size/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Test native X11 clipboard under Xvfb
        if: matrix.linux
        shell: bash
        run: |
          set -o pipefail
          # Tests close every X client between cases; keep the server from
          # resetting while the next test connects.
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --release --locked --package a13n-envd --features "${{ matrix.features }}" --lib clipboard -- --include-ignored --test-threads=1 2>&1 | tee test-results/clipboard-x11.log

      - name: Set up uv for native EIP tests
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Test native AT-SPI in an isolated desktop and user bus
        if: matrix.linux
        shell: bash
        run: |
          set -o pipefail
          make accessibility-linux-test 2>&1 | tee test-results/accessibility-linux.log

      - name: Exercise native system information and metrics through every EIP carrier
        shell: bash
        env:
          EXE_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          export A13N_ENVD_TEST_BINARY="$PWD/target/release/a13n-envd$EXE_SUFFIX"
          uv run --locked --package a13n-envd-client --group test --no-default-groups python -m pytest \
            packages/a13n-envd-client/tests/eip/test_device_sessions.py \
            -k monitoring -q --junitxml=test-results/monitoring-eip.xml

      # A plain Python runtime supplies the test driver, not an Envd release.
      # Mount the binary built above; namespace permissions allow managed bootstrap.
      - name: Test current Envd binary against real cgroup limits
        if: matrix.runner == 'ubuntu-24.04' && matrix.envd-variant == 'default'
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network=none --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --cgroupns=private --cpus=0.5 --memory=512m --user 0 \
            --mount "type=bind,src=$PWD/target/release/a13n-envd,dst=/test-bin/a13n-envd,readonly" \
            --mount "type=bind,src=$PWD/crates/a13n-envd/tests,dst=/tests,readonly" \
            --entrypoint python3 python:3.13-slim-trixie \
            /tests/monitoring_linux.py /test-bin/a13n-envd 2>&1 | tee test-results/monitoring-managed.log

      - name: Test managed OTLP export and Session credential isolation
        if: matrix.runner == 'ubuntu-24.04' && matrix.envd-variant == 'default'
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --package a13n-envd --test otlp --no-run --message-format=json > test-results/otlp-build.jsonl
          test_binary=$(python3 -c 'import json; from pathlib import Path; artifacts = [json.loads(line) for line in Path("test-results/otlp-build.jsonl").read_text().splitlines()]; print(next(item["executable"] for item in artifacts if item.get("target", {}).get("name") == "otlp" and item.get("executable")))')
          docker run --rm --network=none --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --user 0 \
            --mount "type=bind,src=$PWD/target/release/a13n-envd,dst=$PWD/target/release/a13n-envd,readonly" \
            --mount "type=bind,src=$test_binary,dst=/otlp-test,readonly" \
            --entrypoint /otlp-test python:3.13-slim-trixie \
            managed_mtls_export_keeps_credentials_out_of_sessions --ignored --nocapture 2>&1 | tee test-results/otlp-managed.log

      - name: Exercise native Windows EIP process ownership and fail-closed isolation
        if: matrix.runner == 'windows-2025'
        env:
          A13N_ENVD_TEST_BINARY: ${{ github.workspace }}\target\release\a13n-envd.exe
        run: >-
          uv run --locked --package a13n-envd-client --group test --no-default-groups python -m pytest
          packages/a13n-envd-client/tests/eip/test_windows_process_e2e.py
          packages/a13n-envd-client/tests/eip/test_stdio_e2e.py
          -k "windows_eip_job_lifecycle or configured_daemon_command_process_and_output_plane or required_isolation_default_fails_closed"
          -q --junitxml=test-results/windows-eip.xml

      - name: Retain native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envd-${{ matrix.cache-key }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  validation:
    name: a13n-envd checks
    needs: [changes, protocol, client, daemon]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all selected checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          DAEMON_RESULT: ${{ needs.daemon.result }}
          PROTOCOL_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.protocol == 'true' }}
          CLIENT_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true' }}
          DAEMON_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.daemon == 'true' }}
        run: |
          test "$CHANGES_RESULT" = success
          for component in PROTOCOL CLIENT DAEMON; do
            selected="${component}_SELECTED"
            result="${component}_RESULT"
            expected=skipped
            if [[ "${!selected}" == true ]]; then
              expected=success
            fi
            test "${!result}" = "$expected" || exit 1
          done
