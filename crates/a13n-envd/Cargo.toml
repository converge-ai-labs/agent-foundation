[package]
name = "a13n-envd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment daemon and protocol provider for Agent Foundation"
readme = "README.md"
keywords = ["agents", "ai", "cloud", "daemon", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[lib]
# The library has no documentation examples, so `cargo test` skips the empty doc-test pass.
doctest = false

[[bin]]
name = "a13n-envd"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
cap-primitives = "3.4.5"
cap-std = "3.4.5"
chrono = { version = "0.4.42", features = ["serde"] }
fs2 = "0.4.3"
futures-util = "0.3.31"
getrandom = "0.3.3"
globset = "0.4.16"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server", "client"] }
ignore = "0.4.25"
hyper-util = { version = "0.1.17", features = ["tokio"] }
libc = "0.2.175"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "http-proto", "grpc-tonic", "reqwest-blocking-client", "tls-ring", "tls-roots"] }
regex = "1.11.2"
# Reuse Envd's ring provider; reqwest's `rustls` feature adds a competing AWS-LC provider.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
url = "2.5.7"
rcgen = "0.14"
zeroize = "1.8"

[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos")))'.dependencies]
# sha2 0.10 gates ARM SHA intrinsics behind asm, with runtime CPU detection and fallback.
# Its ARM runtime detection does not support Windows.
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
image = { version = "0.25.8", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr", "xkb", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", features = ["exception"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFString", "CFCGTypes"] }
objc2-core-graphics = "0.3.2"
xcap = { version = "0.9.7", default-features = false }

[target.'cfg(windows)'.dependencies]
# Pin the published native PSEC runner; never dispatch to MXC's fallback backends.
mxc-sdk = { version = "=1.0.0", default-features = false }
flatbuffers = "25"
# 1.2.4 imports OneCore_apiset, unavailable in the Windows GNU toolchain.
tracelogging = "=1.2.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Performance", "Win32_System_IO", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Wdk_System_SystemServices", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "tls-ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.14.1"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "testing"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Controls"] }

[build-dependencies]
heck = "0.5.0"
prost = "0.14.1"
prost-build = "0.14.1"
prost-reflect = "0.16.2"
prost-types = "0.14.1"
sha2 = "0.10.9"
