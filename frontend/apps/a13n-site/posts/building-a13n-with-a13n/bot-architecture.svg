<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="bot-title bot-desc">
  <title id="bot-title">Many conversations. One project context.</title>
  <desc id="bot-desc">Lark, Slack and GitHub host discussions. Each discussion has a Main that coordinates its own Work threads. Mains query and report to one project Core, which maintains shared project memory and informs relevant Mains. Core coordinates knowledge, not task execution. The a13n runtime supplies asynchronous tools, context management, environments and thread lifecycles.</desc>
  <text class="pt acc" x="24" y="22">A13N BOT / COLLABORATION ARCHITECTURE</text>
  <text class="pt ink" x="24" y="53" style="font-size:22px">Many conversations. One project context.</text>
