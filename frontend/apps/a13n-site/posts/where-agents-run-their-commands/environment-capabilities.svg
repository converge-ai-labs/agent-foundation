<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="An agent requests CSV analysis. Inside the execution environment, Python uses CPU resources to process data.csv and produce chart.png; the filesystem stores the input, script, and output.">
  <rect class="pl" x="24" y="100" width="164" height="78" rx="3" />
  <text class="pt ink" x="106" y="132" text-anchor="middle">agent runtime</text>
