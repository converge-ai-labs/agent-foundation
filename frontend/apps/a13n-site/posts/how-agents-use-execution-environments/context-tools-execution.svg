  <text class="pt ink" x="289.25" y="274.482" style="font-size: 11.05px">Prepare + dispatch</text>
  <text class="pt" x="279.5" y="316.719" style="font-size: 9.1px">Route calls; return results</text>
  <rect class="pl" x="26" y="221" width="130" height="65" />
  <text class="pt ink" x="35.75" y="245.362" style="font-size: 14.3px">Model</text>
  <text class="pt" x="35.75" y="268.84" style="font-size: 9.75px">Choose next action</text>
  <rect class="pl" x="559" y="221" width="143" height="65" />
  <text class="pt ink" x="568.75" y="245.362" style="font-size: 14.3px">Environment</text>
  <text class="pt" x="568.75" y="268.619" style="font-size: 9.1px">Read / run / interact</text>
  <path class="pa" d="M279.5 169 L91 169 L91 221 M94.25 215.15 L91 221 L87.75 215.15" />
  <text class="pt acc" x="110.5" y="154.661" style="font-size: 10.4px">context + tools</text>
