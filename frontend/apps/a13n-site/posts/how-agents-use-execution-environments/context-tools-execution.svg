  <path class="pa" d="M279.5 273 L156 273 M161.85 276.25 L156 273 L161.85 269.75" />
  <text class="pt acc" x="162.5" y="297.44" style="font-size: 9.75px">status + output</text>
  <path class="pl" d="M435.5 237.25 L559 237.25 M553.15 234 L559 237.25 L553.15 240.5" />
  <text class="pt ink" x="455" y="225.94" style="font-size: 9.75px">operation</text>
