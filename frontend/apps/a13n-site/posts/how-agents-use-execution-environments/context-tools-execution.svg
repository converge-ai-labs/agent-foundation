  <rect class="pa" x="279.5" y="133.25" width="156" height="71.5" />
  <text class="pt acc" x="289.25" y="152.711" style="font-size: 10.4px">Environment context</text>
  <text class="pt" x="289.25" y="170.469" style="font-size: 9.1px">names / paths / access</text>
  <text class="pt ink" x="289.25" y="191.711" style="font-size: 10.4px">Tools + instructions</text>
  <rect class="pl" x="279.5" y="221" width="156" height="65" />
