<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 390" role="img" aria-label="Harness supplies environment context and tool instructions to the model, routes tool calls, and returns status and output from the environment.">
  <text class="pt ink" x="26" y="39.338" style="font-size: 18.2px">Context, calls and feedback</text>
  <text class="pt" x="26" y="63.882" style="font-size: 11.05px">The model chooses an action. Harness connects it to the environment.</text>
  <rect class="pf" x="266.5" y="91" width="182" height="247" />
  <text class="pt ink" x="279.5" y="115.362" style="font-size: 14.3px">Harness</text>
