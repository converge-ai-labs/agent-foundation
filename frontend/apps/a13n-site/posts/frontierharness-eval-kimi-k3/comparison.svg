<svg xmlns="http://www.w3.org/2000/svg" class="benchmark-comparison" viewBox="0 0 800 440">
  <title>FrontierHarness Eval: pass rate and reported standardized cost per pass</title>
  <desc>a13n is a local run; the twelve published configurations used different runtime and provider conditions. a13n passed 21 of 30 tasks at $2.93 per pass. Cost excludes nine requests with unknown usage, other attempts and machines; raw usage is complete for 22 of 30 a13n tasks. Hollow baseline points have partial reported cost coverage. All values are also in the comparison table.</desc>
  <text class="fi" x="70" y="22" style="font:400 14px var(--mono)">Pass rate</text>
  <path class="pf" d="M70 289.44H770" /><text class="fi" x="55" y="294.44" text-anchor="end" style="font:400 13px var(--mono)">50%</text>
  <path class="pf" d="M70 238.52H770" /><text class="fi" x="55" y="243.52" text-anchor="end" style="font:400 13px var(--mono)">55%</text>
  <path class="pf" d="M70 187.59H770" /><text class="fi" x="55" y="192.59" text-anchor="end" style="font:400 13px var(--mono)">60%</text>
  <path class="pf" d="M70 136.67H770" /><text class="fi" x="55" y="141.67" text-anchor="end" style="font:400 13px var(--mono)">65%</text>
  <path class="pf" d="M70 85.74H770" /><text class="fi" x="55" y="90.74" text-anchor="end" style="font:400 13px var(--mono)">70%</text>
  <text class="fi" x="104.49" y="350" text-anchor="middle" style="font:400 13px var(--mono)">$1</text>
  <text class="fi" x="251.61" y="350" text-anchor="middle" style="font:400 13px var(--mono)">$2</text>
  <text class="fi" x="446.10" y="350" text-anchor="middle" style="font:400 13px var(--mono)">$5</text>
  <text class="fi" x="593.22" y="350" text-anchor="middle" style="font:400 13px var(--mono)">$10</text>
  <text class="fi" x="740.34" y="350" text-anchor="middle" style="font:400 13px var(--mono)">$20</text>
  <text class="fi" x="420" y="382" text-anchor="middle" style="font:400 14px var(--mono)">Cost per pass · USD, logarithmic scale</text>
  <g data-result="a13n Harness" data-summary="21/30 passed · $2.93 per pass" data-note="Reported cost covers the selected tasks after nine unknown-usage requests were excluded. Complete raw usage: 22/30 tasks.">
    <title>a13n Harness: 21/30 passed · $2.93 per pass. Reported cost covers the selected tasks after nine unknown-usage requests were excluded. Complete raw usage: 22/30 tasks.</title>
