[project]
name = {{ cookiecutter.project_slug | tojson }}
version = {{ cookiecutter.version | tojson }}
description = {{ cookiecutter.project_name | tojson }}
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["a13n-service"]

[project.entry-points."a13n_service.app_plugins"]
{{ cookiecutter.app_id | tojson }} = "{{ cookiecutter.module_name }}.app:definition"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.module_name }}"]

[tool.hatch.build.targets.wheel.force-include]
"src/{{ cookiecutter.module_name }}/static" = "{{ cookiecutter.module_name }}/static"

[tool.hatch.build.targets.sdist]
include = ["src", "frontend", "tests", "scripts", "README.md", "Makefile", ".python-version", ".service-ref"]
exclude = ["frontend/node_modules"]

[tool.hatch.build.targets.sdist.force-include]
"src/{{ cookiecutter.module_name }}/static" = "src/{{ cookiecutter.module_name }}/static"

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."

[tool.ruff]
target-version = "py313"
line-length = 120
