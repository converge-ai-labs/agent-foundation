[project]
name = {{ cookiecutter.project_slug | tojson }}
version = {{ cookiecutter.version | tojson }}
description = {{ cookiecutter.project_name | tojson }}
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["a13n-service=={{ cookiecutter.service_version }}"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[project.entry-points."a13n_service.app_plugins"]
{{ cookiecutter.app_id | tojson }} = "{{ cookiecutter.module_name }}.app:definition"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

{% if cookiecutter.surface != 'backend-only' -%}
[tool.hatch.build]
artifacts = ["src/{{ cookiecutter.module_name }}/static/**"]

{% endif -%}
[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.module_name }}"]

[tool.hatch.build.targets.sdist]
include = ["src", {% if cookiecutter.surface != 'backend-only' %}"frontend", {% endif %}"tests", "scripts", "README.md", "Makefile", ".python-version", "compose.dev.yaml", "service.dev.toml"]
exclude = ["frontend/node_modules", "frontend/.console-sdk"]

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."

[tool.ruff]
target-version = "py313"
line-length = 120
