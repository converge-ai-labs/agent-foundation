site_name: Agent Foundation
site_description: Build and embed Pydantic AI agents with portable environments and typed streams
site_url: https://agent-foundation-docs.converge.ai/
repo_name: converge-ai-labs/agent-foundation
repo_url: https://github.com/converge-ai-labs/agent-foundation
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

nav:
  - Home: index.md
  - Harness UI:
      - Start here: a13n-harness-ui/index.md
      - Use the terminal: a13n-harness-ui/everyday-use.md
      - Configuration reference: a13n-harness-ui/configuration.md
      - Models and authentication: a13n-harness-ui/models-and-authentication.md
      - Agents and subagents: a13n-harness-ui/agents-and-subagents.md
      - Environments and Projects: a13n-harness-ui/environments-and-projects.md
      - Extensions and MCP: a13n-harness-ui/extensions-and-mcp.md
      - Native and Web tools: a13n-harness-ui/native-and-web-tools.md
      - Automation and troubleshooting: a13n-harness-ui/automation-and-troubleshooting.md
  - Agent Harness:
      - Overview: a13n-harness/index.md
      - Get started:
          - Getting Started: a13n-harness/getting-started.md
          - Testing: a13n-harness/testing.md
      - Core concepts:
          - Agents and Runs: a13n-harness/agents-and-runs.md
          - Capabilities: a13n-harness/capabilities.md
          - Environments: a13n-harness/environments.md
          - State and Resume: a13n-harness/state-and-resume.md
      - Build behavior:
          - Multimedia Understanding: a13n-harness/multimedia-understanding.md
          - Delegation and CodeAct: a13n-harness/delegation-and-codeact.md
          - Skills: a13n-harness/skills.md
      - Integrate and operate:
          - Observation: a13n-harness/observation.md
          - Embedding in a Host: a13n-harness/hosting.md
          - Plugins and Extensions: a13n-harness/plugins.md
  - Environments:
      - Overview: environments/index.md
      - a13n Environment:
          - Overview: a13n-environment/index.md
          - Built-in Examples: a13n-environment/examples.md
          - Remote Envd: a13n-environment/remote-envd.md
      - a13n-envd: a13n-envd/index.md
  - a13n Service:
      - Identity and Access: a13n-service/identity.md
      - External Tools: a13n-service/external-tools.md
      - Configure Models: a13n-service/models.md
      - Configure Web Search: a13n-service/search.md
      - Background Tasks: a13n-service/background-tasks.md
  - Streaming:
      - Agent Stream Protocol: a13n-stream-protocol/index.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
