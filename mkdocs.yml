site_name: Agent Foundation
site_description: Build and embed Pydantic AI agents with portable environments and typed streams
site_url: https://agent-foundation-docs.converge.ai/
repo_name: converge-ai-labs/agent-foundation
repo_url: https://github.com/converge-ai-labs/agent-foundation
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

nav:
  - Home: index.md
  - Agent Harness:
      - Overview: agent-harness/index.md
      - Get started:
          - Getting Started: agent-harness/getting-started.md
          - Testing: agent-harness/testing.md
      - Core concepts:
          - Agents and Runs: agent-harness/agents-and-runs.md
          - Capabilities: agent-harness/capabilities.md
          - Environments: agent-harness/environments.md
          - State and Resume: agent-harness/state-and-resume.md
      - Build behavior:
          - Multimedia Understanding: agent-harness/multimedia-understanding.md
          - Delegation and CodeAct: agent-harness/delegation-and-codeact.md
          - Skills: agent-harness/skills.md
      - Integrate and operate:
          - Observation: agent-harness/observation.md
          - Embedding in a Host: agent-harness/hosting.md
          - Plugins and Extensions: agent-harness/plugins.md
  - Environments:
      - Overview: environments/index.md
      - Environment Provider:
          - Overview: agent-environment-provider/index.md
          - Built-in Examples: agent-environment-provider/examples.md
      - agent-envd: agent-envd/index.md
  - Streaming:
      - Agent Stream Protocol: agent-stream-protocol/index.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
