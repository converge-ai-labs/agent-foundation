theme:
  name: material
  custom_dir: scripts/docs/theme
  font: false
  logo: assets/a13n/logo.svg
  favicon: assets/a13n/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: phosphor/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: phosphor/sun
        name: Switch to light mode
  icon:
    menu: phosphor/list
    search: phosphor/magnifying-glass
    close: phosphor/x
    previous: phosphor/arrow-left
    next: phosphor/arrow-right
    top: phosphor/arrow-up
    repo: phosphor/github-logo
    edit: phosphor/pencil-simple
    admonition:
      note: phosphor/pencil-simple
      info: phosphor/info
      tip: phosphor/lightbulb
      warning: phosphor/warning
      danger: phosphor/warning-circle
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
